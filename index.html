enter long before the data are analysed.","cite":"A field that can cite its own failures is more credible.","credibility":"What gives a claim credibility is not the confidence of the author.","evidence":"Some fields ask for the evidence to be shared before a paper is accepted.","peer":"Peer review is meant to catch this.","reproduce":"The strongest test is whether others can reproduce the result.","sample":"The process begins with a sample.","significant":"The difference may be too small to be significant.","statistics":"Telling the two apart requires the statistics used.","transparent":"Transparent reporting is not a formality.","verify":"Transparent reporting is what allows others to verify the work.","funding":"Funding, careers and attention all reward the exciting claim.","publication":"Publication adds another pressure."},"ctxzh":{"bias":"偏差在分析数据之前很久就能进入。","cite":"一个能引用自己失败的领域更可信。","credibility":"让一个说法可信的，不是作者的自信。","evidence":"有些领域要求论文接收前先公开证据。","peer":"同行评审本应抓住这一点。","reproduce":"最强的检验是别人能否复现这个结果。","sample":"过程从样本开始。","significant":"差异可能小到没有统计学意义。","statistics":"区分两者需要看用过的统计方法。","transparent":"透明的报告不是形式。","verify":"透明的报告正是让别人能核实这项工作的东西。","funding":"经费、职业和关注都在奖励那个惊人的说法。","publication":"发表又增加一重压力。"},"questions":[{"type":"细节","q":"What makes a scientific claim credible, according to paragraph 1?","options":["Independent groups have tested it without breaking it.","The author is confident about it.","It appears in the news.","It is published quickly."],"answer":0,"zh":"根据第一段，什么让一个科学说法可信？","optzh":["独立团队检验过它、没能推翻它。","作者对它很自信。","它上了新闻。","它发表得很快。"],"exp":"the number of independent groups that have tested it and failed to break it。","src":"failed to break it"},{"type":"推断","q":"Why may the published literature be misleading?","options":["Studies that find nothing are less likely to be published.","Journals publish too many old results.","Reviewers read papers too carefully.","Most studies are never finished."],"answer":0,"zh":"为什么已发表的文献可能造成误导？","optzh":["没发现结果的研究更不容易被发表。","期刊发表了太多旧结果。","评审人读论文太仔细。","大多数研究都没做完。"],"exp":"a study that finds nothing may never appear, and the literature slowly fills with successes。","src":"literature slowly fills with successes"},{"type":"细节","q":"What is needed to tell a failed reproduction from a flawed original?","options":["Detailed records of conditions, methods and software.","A larger number of authors.","A longer title and abstract.","More funding for the first team."],"answer":0,"zh":"要区分“复现失败”和“原研究有错”，需要什么？","optzh":["关于条件、方法和软件的详细记录。","更多的作者。","更长的标题和摘要。","给第一个团队更多经费。"],"exp":"requires detail: the exact conditions, the statistics used, the version of the software。","src":"the exact conditions"},{"type":"主旨","q":"What is the writer's attitude towards science?","options":["Trusting, but aware that it needs checks that do not rely on trust.","Completely doubtful about all published results.","Indifferent, since ordinary people cannot judge it.","Confident that funding always produces truth."],"answer":0,"zh":"作者对科学的态度是什么？","optzh":["信任，但清楚它需要不依赖信任的核查。","对所有已发表结果完全怀疑。","无所谓，因为普通人无法判断。","相信经费总能带来真理。"],"exp":"a system built on trust needs checks that do not depend on trust。","src":"checks that do not depend on trust"}]},{"id":24,"title":"Four Towers, Four Answers","level":"高考 · 说明","words":243,"min":8,"tags":["真题","社会","城市"],"paras":["Are tall apartment blocks an answer to a housing shortage or a problem in their own right? Four British developments show why answers to that question have varied.","Kensal House opened in west London in 1936 as housing for working families. Its designers put airy rooms, balconies and well-planned kitchens within their reach. Residents shared outdoor space and took part in running the place. The project showed what could be achieved with a new approach, and many later housing developments followed its example.","Ronan Point, an east London tower finished in 1968, was a warning. A gas explosion in one flat took out part of a building whose concrete panels lacked adequate support. The collapse killed residents and brought attention to unsafe construction in other blocks. The exposure of a problem, however, did not mean it would be fixed everywhere.","Trellick Tower, completed four years later, showed another possibility. Its designer wanted the land around a tall block to be available for gardens. High-quality finishes demonstrated that public housing could offer more than basic shelter. The project set a standard for what a public high-rise could be.","Cascades opened beside the Thames in 1988. The design took ideas from ships and nearby warehouses, but its pool and gym served a new group of buyers. Here a tower had become a private luxury address. The contrast was striking: a shape long associated with public housing was also being sold as a mark of wealth."],"tr":["高层住宅楼究竟是住房短缺的解决办法，还是本身就是个问题？英国的四个住宅项目说明了为什么这个问题的答案一直各不相同。","肯萨尔屋 1936 年在伦敦西区落成，是给工薪家庭住的房子。设计者让这些家庭也能享有通风的房间、阳台和精心设计的厨房。住户共用室外空间，还参与这处住宅的管理。这个项目显示了采用新做法能取得什么成效，后来许多住宅项目都效仿了它。","1968 年完工的伦敦东区高楼罗南角是一个警告。一户公寓里的燃气爆炸摧毁了大楼的一部分，而楼内混凝土板本就缺乏足够的支撑。坍塌造成住户死亡，也使其他楼栋不安全的施工问题受到关注。然而，问题被曝光，并不意味着各处都会得到修复。","四年后建成的特雷利克塔展示了另一种可能。它的设计者希望高楼周围的土地能留作花园。高质量的装修表明，公共住房能提供的不只是基本的栖身之所。这个项目为“公共高层住宅可以是什么样”树立了一个标准。","1988 年，卡斯凯兹在泰晤士河畔落成。设计借鉴了船只和附近仓库的形态，但它的泳池和健身房服务的是另一批买家。在这里，一座高楼成了私人的豪华住宅。这种反差十分醒目：一种长期与公共住房联系在一起的外形，同时也作为财富的标志被出售。"],"targets":["shortage","approach","resident","adequate","collapse","construction","exposure","shelter","standard","demonstrate","luxury","contrast","wealth"],"ctx":{"shortage":"Are tall apartment blocks an answer to a housing shortage or a problem in their own right?","approach":"The project showed what could be achieved with a new approach, and many later housing developments followed its example.","resident":"Residents shared outdoor space and took part in running the place.","adequate":"A gas explosion in one flat took out part of a building whose concrete panels lacked adequate support.","collapse":"The collapse killed residents and brought attention to unsafe construction in other blocks.","construction":"The collapse killed residents and brought attention to unsafe construction in other blocks.","exposure":"The exposure of a problem, however, did not mean it would be fixed everywhere.","shelter":"High-quality finishes demonstrated that public housing could offer more than basic shelter.","standard":"The project set a standard for what a public high-rise could be.","demonstrate":"High-quality finishes demonstrated that public housing could offer more than basic shelter.","luxury":"Here a tower had become a private luxury address.","contrast":"The contrast was striking: a shape long associated with public housing was also being sold as a mark of wealth.","wealth":"The contrast was striking: a shape long associated with public housing was also being sold as a mark of wealth."},"ctxzh":{"shortage":"高层住宅楼究竟是住房短缺的解决办法，还是本身就是个问题？","approach":"这个项目显示了采用新做法能取得什么成效，后来许多住宅项目都效仿了它。","resident":"住户共用室外空间，还参与这处住宅的管理。","adequate":"一户公寓里的燃气爆炸摧毁了大楼的一部分，而楼内混凝土板本就缺乏足够的支撑。","collapse":"坍塌造成住户死亡，也使其他楼栋不安全的施工问题受到关注。","construction":"坍塌造成住户死亡，也使其他楼栋不安全的施工问题受到关注。","exposure":"然而，问题被曝光，并不意味着各处都会得到修复。","shelter":"高质量的装修表明，公共住房能提供的不只是基本的栖身之所。","standard":"这个项目为“公共高层住宅可以是什么样”树立了一个标准。","demonstrate":"高质量的装修表明，公共住房能提供的不只是基本的栖身之所。","luxury":"在这里，一座高楼成了私人的豪华住宅。","contrast":"这种反差十分醒目：一种长期与公共住房联系在一起的外形，同时也作为财富的标志被出售。","wealth":"这种反差十分醒目：一种长期与公共住房联系在一起的外形，同时也作为财富的标志被出售。"},"questions":[{"type":"细节","q":"What can be learned from the case of Ronan Point?","options":["Poor construction contributed to a deadly collapse.","The project introduced safer building materials.","The tower was designed as an expensive private address.","The accident led to repairs in every affected block."],"answer":0,"zh":"从罗南角这个例子可以得出什么？","optzh":["施工缺陷导致了一场致命的坍塌。","这个项目引入了更安全的建筑材料。","这座塔被设计成昂贵的私人住宅。","这起事故使每一栋受影响的楼都得到修复。"],"exp":"第 3 段：燃气爆炸损毁了大楼一部分，而“concrete panels lacked adequate support”，坍塌造成住户死亡。爆炸是导火索，支撑不足使局部坍塌，所以 A 对。B 文中没有；C 属于 Cascades；D 与段末“曝光不等于到处都修好”相反。","src":"whose concrete panels lacked adequate support","detail":"定位第 3 段：“A gas explosion in one flat took out part of a building whose concrete panels lacked adequate support.”（一户公寓内的燃气爆炸损毁了大楼一部分，而楼内混凝土板本就缺少充分支撑。）\n同一段：“The collapse killed residents and brought attention to unsafe construction in other blocks.”（坍塌造成居民死亡，也使其他楼栋不安全的施工问题受到关注。）\n因果链完整：支撑不足（结构缺陷）→ 爆炸导致局部坍塌 → 死亡与关注。所以 A“糟糕的施工导致了致命的坍塌”对。\n排错：B 原文没有任何“改进材料”的信息；C 描述的是 Cascades（第 5 段）；D 把“引起关注”夸大成“所有楼都修好了”，与段末“问题被暴露，不等于到处都修好了”正好相反。"},{"type":"推理","q":"What do Kensal House and Trellick Tower have in common?","options":["They offered models for public housing design.","They gave each household its own garden.","They made costly materials their main attraction.","They were run under rules made by their residents."],"answer":0,"zh":"肯萨尔屋和特雷利克塔有什么共同点？","optzh":["它们为公共住房设计提供了范例。","它们给每户人家一个私家花园。","它们把昂贵的材料当作主要卖点。","它们按居民自定的规矩管理。"],"exp":"第 2 段“many later housing developments followed its example”，第 4 段“set a standard for what a public high-rise could be”：一个是“被效仿”，一个是“树立标准”，都指向示范作用，A 对。B 原文是共享室外空间、把周围土地留作花园；C 只接近 Trellick 的装修描述；D 的居民参与管理只出现在 Kensal 一段。","src":"followed its example","detail":"定位第 2 段：“The project showed what could be achieved with a new approach, and many later housing developments followed its example.”（该项目展示了新做法能达到什么，后来很多住宅项目都效仿它。）\n第 4 段：“The project set a standard for what a public high-rise could be.”（该项目为公共高层住宅树立了标准。）\nfollowed its example（被效仿）与 set a standard（树立标准）都指向“示范作用”，所以 A 对。\n排错：B 原文说 Kensal House 的居民共享室外空间（shared outdoor space），不是每家一个花园；C 只有 Trellick 提到高质量装修，且不是“主要卖点”；D 居民参与管理只出现在 Kensal House 一段，不能说两栋都这样。"},{"type":"推理","q":"What change does Cascades illustrate?","options":["Modernist design was no longer used.","Pools and gyms became standard in all towers.","The high-rise form also came to serve private luxury buyers.","Homes by the river became affordable for workers."],"answer":2,"zh":"卡斯凯兹说明了什么变化？","optzh":["现代主义设计不再被使用。","泳池和健身房成了所有高楼的标配。","高楼这种形式也开始服务于私人豪华买家。","河边的住宅变得工薪家庭也买得起了。"],"exp":"第 5 段“a shape long associated with public housing was also being sold as a mark of wealth”：长期与公共住房绑定的外形，如今也作为财富标志出售。also 表示“在原有用途之外多了一种用途”，所以 C 对。A 把新用途误读成风格被替换；B 把一栋楼的设施推广到所有楼；D 与“面向富裕买家”正好相反。","src":"also being sold as a mark of wealth","detail":"定位第 5 段：“The contrast was striking: a shape long associated with public housing was also being sold as a mark of wealth.”（反差很明显：一种长期被视为公共住房的建筑外形，也开始作为富裕的标志被出售。）\n关键在 also：同一个建筑形式，在原有用途之外又多了新用途——被卖给私人豪宅买家。所以 C 对。\n排错：A 把“用途扩展”误读成“风格被替换”，原文说这种形状仍在使用；B 把一栋楼里的泳池和健身房推广到“所有高楼”；D 与原文相反，Cascades 面向的是新一批买家（富裕买家），不是工人。"}]},{"id":25,"title":"The Words We Use About Bodies","level":"高考 · 议论","words":258,"min":9,"tags":["真题","社会","健康"],"paras":["In my research on body image, I have noticed how much our choice of words depends on where we work. In clinics, terms are often borrowed from medical classification. Researchers on body image may prefer a phrase such as “higher weight”. A choice that sounds routine in one setting can be heard quite differently in another.","One response to insulting language was to put the person first. A doctor might say “a person with obesity”, thereby making clear that the individual is more than a description. I can see why people wanted to make this change. In discussions of body size, however, the wording can still present a large body as a medical problem even when illness is not the subject under discussion.","People also disagree about which expressions they want others to use. Some groups that campaign for acceptance of larger bodies use “fat” as an ordinary descriptive word. In a consultation, the same word can be heard as an insult or may simply be the technical name for a kind of tissue. Knowing how a word is used by one group tells us only part of what it may mean elsewhere.","It can be tempting to dismiss this issue as a matter of manners. The way people are addressed can nevertheless affect whether they trust a healthcare provider enough to return. I would ask people how they wish to be described and consider the situation in which they will hear the word. A respectful choice in one conversation need not be prescribed for every other conversation."],"tr":["在研究身体形象的过程中，我注意到我们对词语的选择在很大程度上取决于我们在哪里工作。在诊所里，用词常常借自医学分类。研究身体形象的人可能更愿意说“体重较高”。在一个场合听起来很平常的说法，换到另一个场合听起来可能大不一样。","针对侮辱性语言的一种应对办法，是把人放在前面说。医生可能会说“一个患有肥胖症的人”，以此表明这个人不只是一个描述。我能理解人们为什么想作这种改变。然而在讨论体型时，即使谈的并不是疾病，这样的措辞仍然可能把较大的体型呈现成一个医学问题。","人们对于希望别人用哪种说法也意见不一。一些为“接纳较大体型”而发声的群体把 fat 当作普通的描述词。可在就诊时，同一个词可能被听成侮辱，也可能只是某类组织的技术名称。知道一个词被某个群体怎么用，只能告诉我们它在别处可能是什么意思的一部分。","把这个问题当成礼貌问题打发掉，是很有诱惑力的。但人们被称呼的方式，会影响他们是否信任一位医护人员、信任到愿意再来。我会问别人希望怎样被描述，并考虑他们将在什么情境下听到这个词。一次谈话里得体的用词，不必被规定成其他所有谈话的用法。"],"targets":["setting","routine","classification","insult","obesity","individual","campaign","consultation","tissue","manners","trust","respectful","prescribe"],"ctx":{"setting":"A choice that sounds routine in one setting can be heard quite differently in another.","routine":"A choice that sounds routine in one setting can be heard quite differently in another.","classification":"In clinics, terms are often borrowed from medical classification.","insult":"One response to insulting language was to put the person first.","obesity":"A doctor might say “a person with obesity”, thereby making clear that the individual is more than a description.","individual":"A doctor might say “a person with obesity”, thereby making clear that the individual is more than a description.","campaign":"Some groups that campaign for acceptance of larger bodies use “fat” as an ordinary descriptive word.","consultation":"In a consultation, the same word can be heard as an insult or may simply be the technical name for a kind of tissue.","tissue":"In a consultation, the same word can be heard as an insult or may simply be the technical name for a kind of tissue.","manners":"It can be tempting to dismiss this issue as a matter of manners.","trust":"The way people are addressed can nevertheless affect whether they trust a healthcare provider enough to return.","respectful":"A respectful choice in one conversation need not be prescribed for every other conversation.","prescribe":"A respectful choice in one conversation need not be prescribed for every other conversation."},"ctxzh":{"setting":"在一个场合听起来很平常的说法，换到另一个场合听起来可能大不一样。","routine":"在一个场合听起来很平常的说法，换到另一个场合听起来可能大不一样。","classification":"在诊所里，用词常常借自医学分类。","insult":"针对侮辱性语言的一种应对办法，是把人放在前面说。","obesity":"医生可能会说“一个患有肥胖症的人”，以此表明这个人不只是一个描述。","individual":"医生可能会说“一个患有肥胖症的人”，以此表明这个人不只是一个描述。","campaign":"一些为“接纳较大体型”而发声的群体把 fat 当作普通的描述词。","consultation":"可在就诊时，同一个词可能被听成侮辱，也可能只是某类组织的技术名称。","tissue":"可在就诊时，同一个词可能被听成侮辱，也可能只是某类组织的技术名称。","manners":"把这个问题当成礼貌问题打发掉，是很有诱惑力的。","trust":"但人们被称呼的方式，会影响他们是否信任一位医护人员、信任到愿意再来。","respectful":"一次谈话里得体的用词，不必被规定成其他所有谈话的用法。","prescribe":"一次谈话里得体的用词，不必被规定成其他所有谈话的用法。"},"questions":[{"type":"推理","q":"What limitation does the author see in person-first wording about body size?","options":["It forces people to provide more personal details.","Few people working in clinics accept it.","It can keep a disease-based way of looking at body size.","It is too informal for a discussion between specialists."],"answer":2,"zh":"作者认为“把人放在前面”这种措辞在体型问题上有何局限？","optzh":["它迫使人们提供更多个人信息。","诊所里很少有人接受它。","它可能让人继续用疾病的角度看体型。","对专家之间的讨论来说它太不正式。"],"exp":"第 2 段 however 之后：“the wording can still present a large body as a medical problem even when illness is not the subject”。still 说明措辞改了，看体型的角度可能还是疾病那一套，C 对。A 的个人信息、B 的医护不接受、D 的不够正式，本段都没有讨论。","src":"can still present a large body as a medical problem","detail":"定位第 2 段：“In discussions of body size, however, the wording can still present a large body as a medical problem even when illness is not the subject under discussion.”（但在讨论体型时，即使谈的并不是疾病，这种措辞仍可能把较大的体型呈现为一个医疗问题。）\nhowever 之后是作者指出的局限，still 说明“说法变了，看问题的角度没变”——仍然是按疾病看体型。所以 C 对。\n排错：A（要求提供更多个人信息）、B（诊所里很少人接受这种说法）、D（对专家来说太不正式）在原文中都没有依据，属于把“用词讨论”替换成别的议题。"},{"type":"推理","q":"What does the example of the word “fat” show?","options":["It carries the same meaning in all reliable research.","It is recommended as a way to increase trust in clinics.","Its medical sense is always the politest form of address.","Its meaning can differ depending on the group using it."],"answer":3,"zh":"“fat”这个词的例子说明了什么？","optzh":["在所有可靠的研究里它的意思都一样。","它被推荐用来增加诊所里的信任。","它的医学含义总是最礼貌的称呼。","它的意思会随使用它的群体而不同。"],"exp":"第 3 段：某些群体把 fat 当普通描述词，而“In a consultation, the same word can be heard as an insult or may simply be the technical name for a kind of tissue”。同一个词在不同场合作用不同，说明含义要看使用者和语境，D 对。A 与“same”一词的证据相反；B 把这个词的效果和尊重他人偏好混为一谈；C 忽略“称呼人”和“术语”的区别。","src":"can be heard as an insult","detail":"定位第 3 段：“Some groups that campaign for acceptance of larger bodies use 'fat' as an ordinary descriptive word.”（一些提倡接纳较大体型的群体把 fat 当作普通描述词。）\n同一段：“In a consultation, the same word can be heard as an insult or may simply be the technical name for a kind of tissue.”（在就诊时，同一个词可能被听成冒犯，也可能只是某类组织的术语。）\n同一个词，在不同人群、不同场合含义不同 → D。\n排错：A 说“在所有可靠研究里含义相同”，与原文相反；B 把“尊重他人偏好带来的信任”说成“这个词本身的功效”；C 说“医学义永远最礼貌”，原文并未这样排序。"},{"type":"推理","q":"Which policy would the author most likely support?","options":["Use the same clinical terms in every setting.","Choose wording with the listener and setting in mind.","Avoid expressing any preference about word choice.","Remove every non-medical expression from a consultation."],"answer":1,"zh":"作者最可能支持哪种做法？","optzh":["在任何场合都用同一套临床术语。","根据听话人和场合来选择措辞。","避免对用词表达任何偏好。","把一切非医学表述都从就诊中删掉。"],"exp":"第 4 段“I would ask people how they wish to be described and consider the situation in which they will hear the word”：问对方希望被怎么称呼（听话人）＋考虑听到的情境（场合），B 同时覆盖两点。A 把统一用语当原则；C 把“问清偏好”改成“回避偏好”；D 一律排除非医学词，超出了作者主张。","src":"ask people how they wish to be described","detail":"定位第 4 段：“I would ask people how they wish to be described and consider the situation in which they will hear the word.”（我会问人们希望怎样被描述，并考虑他们将在什么情境下听到这个词。）\nask people → 顾及个人偏好；consider the situation → 顾及场合。B 同时覆盖两点。\n排错：A 主张“所有场合统一临床术语”，正是作者反对的；C 把“问清偏好”改成“回避偏好”；D“一律剔除非医学术语”超出了作者主张（作者只说得体用词不必强加于其他所有谈话）。"},{"type":"主旨","q":"Which title best captures the article as a whole?","options":["Body Image: Three Decades of Research","Medical Vocabulary: A History of Clinical Labels","Trust: How Clinical Research Measures It","Word Choice: Talking Respectfully About Body Size"],"answer":3,"zh":"哪个标题最能概括全文？","optzh":["身体形象：三十年研究","医学词汇：临床标签的历史","信任：临床研究如何测量它","用词选择：如何得体地谈论体型"],"exp":"第 1 段“A choice that sounds routine in one setting can be heard quite differently in another”提出选词随场合而变；中间举 person-first、fat 两个例子；第 4 段落到“A respectful choice in one conversation need not be prescribed for every other conversation”。首段立论、中段举例、末段给原则，D 覆盖全篇。A 只谈研究年限；B 只涵盖医学标签；C 把作为后果提到的信任当成研究对象。","src":"A respectful choice in one conversation","detail":"定位第 1 段：“A choice that sounds routine in one setting can be heard quite differently in another.”（一个场合里习以为常的用语，换个场合听起来可能大不一样。）\n第 4 段：“A respectful choice in one conversation need not be prescribed for every other conversation.”（一次谈话中得体的用词，不必成为其他所有谈话的规定。）\n首段提出“不同场合怎样选词”，中间三个实例（诊所、研究、患者群体、就诊），末段给出原则（问偏好＋看场合），主线就是“怎样尊重地谈论体型”，所以 D 对。\n排错：A 谈研究年限，原文没有；B 只覆盖医疗标签这一部分；C 把作为“后果”提到的信任当成了研究对象。"}]},{"id":26,"title":"Loneliness and the Series We Can't Stop","level":"高考 · 研究说明","tags":["真题","研究","心理"],"words":239,"min":8,"targets":["threshold","criteria","measure","problematic","frequent","loneliness","rewarding","estimate","predict","questionnaire","link","screen","identify"],"paras":["Watching several episodes of a series in one sitting may be an ordinary way to relax. Xiaofan Yue and Xin Cui asked what separates that habit from the kind of viewing that starts getting in the way of daily life.","Their study used questionnaires from 551 adults in China. People could take part only if they met a viewing threshold based on the length of a single sitting and the number of episodes watched. The researchers then used a separate measure to identify problematic viewing. Some frequent viewers did not meet its criteria.","Among people whose viewing was problematic, those reporting more loneliness tended to score higher on measures of viewing problems. The link did not appear in the same way for frequent viewers whose habits were not causing problems. The researchers suggested two reasons some viewers might turn to a series: to get a break from unpleasant feelings or to find an experience that feels rewarding.","About one person in six around the world experiences loneliness, according to an estimate from the World Health Organization. That figure places a concern raised by the survey in a much wider setting.","The survey cannot tell us whether loneliness came first. It looked at television series rather than every kind of screen use. Still, within the group it studied, loneliness helped predict how serious the viewing problems were. That is a clearer result than simply saying that frequent viewers are lonely."],"tr":["一次坐着连看好几集剧，也许是再普通不过的放松方式。岳晓帆和崔欣想弄清楚：这种习惯，与那种开始妨碍日常生活的观看行为，究竟差在哪里。","他们的研究使用了一份来自中国 551 位成年人的问卷。只有达到“观看门槛”的人才能参加，这个门槛依据一次观看的时长和所看的集数来定。研究者随后又用另一套指标来识别“有问题的观看”。有些频繁观看者并不符合这套标准。","在观看行为已经成问题的人当中，报告更孤独的人往往在“观看问题”量表上得分更高。而对于那些习惯并未造成问题的频繁观看者，这种关联并没有以同样的方式出现。研究者提出了两个可能的原因：有人转向追剧，是为了从难受的情绪里暂时脱身，或者是为了找到一种让人觉得有回报的体验。","据世界卫生组织的一项估计，全球大约每六个人中就有一人经历孤独。这个数字把调查所提出的担忧放进了一个广阔得多的背景里。","这项调查无法告诉我们是不是孤独先出现。它看的是电视剧，而不是所有形式的屏幕使用。不过，在它所研究的这个群体里，孤独程度确实有助于预测观看问题有多严重。这比简单地说“频繁观看的人很孤独”要清楚得多。"],"ctx":{"threshold":"People could take part only if they met a viewing threshold based on the length of a single sitting and the number of episodes watched.","criteria":"Some frequent viewers did not meet its criteria.","measure":"The researchers then used a separate measure to identify problematic viewing.","problematic":"Among people whose viewing was problematic, those reporting more loneliness tended to score higher on measures of viewing problems.","frequent":"The link did not appear in the same way for frequent viewers whose habits were not causing problems.","loneliness":"About one person in six around the world experiences loneliness, according to an estimate from the World Health Organization.","rewarding":"The researchers suggested two reasons some viewers might turn to a series: to get a break from unpleasant feelings or to find an experience that feels rewarding.","estimate":"About one person in six around the world experiences loneliness, according to an estimate from the World Health Organization.","predict":"Still, within the group it studied, loneliness helped predict how serious the viewing problems were.","questionnaire":"Their study used questionnaires from 551 adults in China.","link":"The link did not appear in the same way for frequent viewers whose habits were not causing problems.","screen":"It looked at television series rather than every kind of screen use.","identify":"The researchers then used a separate measure to identify problematic viewing."},"ctxzh":{"threshold":"只有达到“观看门槛”的人才能参加，这个门槛依据一次观看的时长和所看的集数来定。","criteria":"有些频繁观看者并不符合这套标准。","measure":"研究者随后又用另一套指标来识别“有问题的观看”。","problematic":"在观看行为已经成问题的人当中，报告更孤独的人往往得分更高。","frequent":"对于习惯并未造成问题的频繁观看者，这种关联并没有以同样的方式出现。","loneliness":"据世界卫生组织估计，全球约六分之一的人经历孤独。","rewarding":"有人转向追剧，是为了找到一种让人觉得有回报的体验。","estimate":"据世界卫生组织的一项估计，全球约六分之一的人经历孤独。","predict":"在它所研究的群体里，孤独程度有助于预测观看问题有多严重。","questionnaire":"他们的研究使用了来自中国 551 位成年人的问卷。","link":"这种关联在问题未出现的频繁观看者身上没有出现。","screen":"它看的是电视剧，而不是所有形式的屏幕使用。","identify":"研究者用另一套指标来识别“有问题的观看”。"},"questions":[{"type":"细节理解","q":"What was true of everyone who took part in the study?","zh":"参加这项研究的每个人都有什么共同点？","options":["They had already been classed as having a viewing problem.","They had sought help for poor physical health.","They reached the study's threshold for watching series.","They had been drawn at random from the whole population."],"optzh":["他们已被判定为观看有问题。","他们因身体不好而求助过。","他们达到了研究的追剧门槛。","他们是从全体人群中随机抽出的。"],"answer":2,"exp":"第 2 段说参加者必须达到 viewing threshold。门槛和“有问题的观看”是两套不同标准，所以不能说每个人都已经有问题。","detail":"定位第 2 段：“People could take part only if they met a viewing threshold based on the length of a single sitting and the number of episodes watched.”（只有达到观看门槛的人才能参加，门槛看一次观看的时长和集数。）\n下一句又明确：“Some frequent viewers did not meet its criteria.”（一些频繁观看者并不符合“有问题的观看”的标准。）\n所以“参加门槛”和“问题标准”是分开的两件事：所有人都达到了前者，才可能参加；但并非所有人都符合后者。选 C。\n排错：A 把“问题标准”当成“参加条件”，与原文相反；B 原文没有任何求医记录；D 忽略了按观看条件筛选志愿者，不是随机抽样。","src":""},{"type":"写作意图","q":"What does the WHO figure contribute to the article?","zh":"文中世界卫生组织的数字起了什么作用？","options":["It shows that loneliness is a widespread concern.","It measures the health cost of watching series.","It tells how many frequent viewers have viewing problems.","It independently verifies the survey's correlation."],"optzh":["它说明孤独是一个普遍存在的问题。","它衡量了追剧带来的健康代价。","它说明有多少频繁观看者存在观看问题。","它独立验证了调查中的相关性。"],"answer":0,"exp":"WHO 的数字说的是“全球六分之一的人孤独”，紧接着一句说这个数字把调查的担忧放进更广的背景，所以它是给“孤独”提供规模证据。","detail":"定位第 4 段：“About one person in six around the world experiences loneliness, according to an estimate from the World Health Organization.”（世卫组织估计，全球约六分之一的人经历孤独。）\n紧接的句子：“That figure places a concern raised by the survey in a much wider setting.”（这个数字使调查所提出的担忧进入更广阔的背景。）\n这个数字统计的是“孤独的人”，不是“观看有问题的人”，所以它证明的是孤独问题之普遍，选 A。\n排错：B、C 都把“孤独”偷换成“观看问题”或“健康代价”；D 不成立——要验证相关性，必须同时观察孤独程度和观看情况，一个全球比例做不到。","src":""},{"type":"推理判断","q":"Which conclusion follows from the survey as described?","zh":"按照文中的描述，可以得出哪个结论？","options":["It establishes that loneliness causes the habit.","Its results cover all ways of using screens.","It finds no distinction between frequent and problematic viewing.","Loneliness was useful in predicting the severity of problematic viewing."],"optzh":["它证实了孤独导致了这种习惯。","它的结论涵盖所有形式的屏幕使用。","它认为频繁观看与有问题的观看没有区别。","孤独程度有助于预测观看问题的严重程度。"],"answer":3,"exp":"第 5 段明确说调查无法说明孤独是否先出现，但在样本中孤独有助于预测观看问题有多严重。“预测”不等于“造成”，这正是 D 的严谨之处。","detail":"定位第 5 段：“The survey cannot tell us whether loneliness came first.”（调查无法说明是不是孤独先出现。）\n同一段：“Still, within the group it studied, loneliness helped predict how serious the viewing problems were.”（不过，在研究的群体中，孤独程度有助于预测观看问题有多严重。）\n“有助于预测”只是统计上的关联强度，不是因果，所以 D 成立而 A 过头。\n排错：A 需要“先出现且导致”，原文明确否认；B 原文说“It looked at television series rather than every kind of screen use”，恰好否定了 B；C 与第 2、3 段“频繁 ≠ 有问题”的区分相反。","src":""},{"type":"主旨要义","q":"Which title describes the main focus most accurately?","zh":"哪个标题最准确地概括了文章重点？","options":["When Are Long Viewing Sessions Harmless?","Can Television Solve Social Isolation?","How Is Loneliness Linked to Problematic Series Viewing?","Why Do Heavy Viewers Prefer Some Genres?"],"optzh":["长时间追剧什么时候是无害的？","电视能解决社交孤立吗？","孤独与有问题的追剧之间有什么关联？","重度观众为什么偏爱某些类型？"],"answer":2,"exp":"全文主线是：如何区分普通追剧与成问题的追剧，以及孤独在其中扮演的角色。C 同时覆盖了“孤独”和“有问题的观看”两个核心。","detail":"看结构与关键词：\n第 1 段提出问题——普通习惯与“妨碍生活的观看”差在哪里；\n第 2 段给方法——怎样界定问题观看；\n第 3 段给核心发现——问题观看者中，孤独程度与问题严重程度相关；\n第 4 段给背景——WHO 的孤独数据；\n第 5 段给限度与结论——不能证明因果，但能预测严重程度。\n首尾都围绕“孤独”与“有问题的追剧”的关系，选 C。\n排错：A 只覆盖“是否有害”的判断标准，丢掉了孤独这条主线；B 把“相关”说成“解决”，方向反了；D 原文完全没谈类型偏好。","src":""}]},{"id":27,"title":"The Number That Stays in Your Head","level":"高考 · 说明议论","tags":["真题","心理","消费"],"words":251,"min":8,"targets":["anchor","quantity","figure","percentage","irrelevant","reference","substantial","criteria","evidence","perspective","punishment","sensible","deliberate"],"paras":["First impressions are not limited to people. When making a judgment about a quantity, we may start from the first figure made available and move away from it too little. This is called anchoring. A suggested prison sentence, for example, may pull a group's final recommendation closer to that starting figure.","In one experiment, a wheel stopped at either 10 or 65 before volunteers estimated what percentage of United Nations members were African countries. The figure on the wheel had no bearing on the answer. Even so, typical estimates were about 25 percent among those given 10 and about 45 percent among those given 65. The irrelevant number had evidently entered the estimate.","A discount label uses the same tendency. When the previous price appears beside the current one, the earlier number becomes a reference. It may make a small discount look substantial. Someone who compares prices at other shops is less likely to let the displayed original price do all the work.","One explanation concerns both the prefrontal cortex, which helps with deliberate evaluation, and the amygdala, which is involved in processing emotional importance. The involvement of these two systems could help explain why an anchor affects what seems sensible as well as what feels right.","The stakes go beyond buying things. An early figure can influence punishment or the amount a buyer thinks a home is worth. Setting independent criteria before hearing an offer or considering a wider range of evidence can help keep the starting figure in perspective."],"tr":["第一印象并不只限于对人。当我们对一个数量作出判断时，往往会从最先看到的那个数字出发，而往回调得太少。这被称为“锚定”。比如，一个被提出的刑期，可能把一群人的最终建议拉近那个起始数字。","在一项实验中，转盘停在 10 或 65 上，随后志愿者估计联合国成员中非洲国家占百分之几。转盘上的数字与答案毫无关系。即便如此，看到 10 的人给出的估计多在 25% 左右，看到 65 的人多在 45% 左右。这个毫不相关的数字显然进入了估计结果。","打折标签利用的正是同一种倾向。当原价出现在现价旁边时，前面那个数字就成了一种参照，它可能让不大的折扣看上去很可观。会去别的店比价的人，就不那么容易被标出来的原价牵着走。","一种解释同时涉及前额叶皮层与杏仁核：前者参与有意识的评估，后者参与处理情绪上的重要性。这两套系统都参与其中，正好可以解释为什么锚点既影响“什么看起来合理”，也影响“什么感觉对”。","这种影响不只发生在买东西上。一个先出现的数字可以影响量刑，也可以影响买家对一套房子的估价。在听到报价之前先定下自己的独立标准，或者去考虑更广范围的证据，都能帮你把那个起始数字放回它该有的位置。"],"ctx":{"anchor":"The involvement of these two systems could help explain why an anchor affects what seems sensible as well as what feels right.","quantity":"When making a judgment about a quantity, we may start from the first figure made available and move away from it too little.","figure":"A suggested prison sentence, for example, may pull a group's final recommendation closer to that starting figure.","percentage":"In one experiment, a wheel stopped at either 10 or 65 before volunteers estimated what percentage of United Nations members were African countries.","irrelevant":"The irrelevant number had evidently entered the estimate.","reference":"When the previous price appears beside the current one, the earlier number becomes a reference.","substantial":"It may make a small discount look substantial.","criteria":"Setting independent criteria before hearing an offer or considering a wider range of evidence can help keep the starting figure in perspective.","evidence":"Setting independent criteria before hearing an offer or considering a wider range of evidence can help keep the starting figure in perspective.","perspective":"Setting independent criteria before hearing an offer or considering a wider range of evidence can help keep the starting figure in perspective.","punishment":"An early figure can influence punishment or the amount a buyer thinks a home is worth.","sensible":"The involvement of these two systems could help explain why an anchor affects what seems sensible as well as what feels right.","deliberate":"One explanation concerns both the prefrontal cortex, which helps with deliberate evaluation, and the amygdala, which is involved in processing emotional importance."},"ctxzh":{"anchor":"这两套系统都参与其中，可以解释为什么锚点既影响“什么看起来合理”，也影响“什么感觉对”。","quantity":"当我们对一个数量作出判断时，会从最先看到的数字出发，而往回调得太少。","figure":"一个被提出的刑期，可能把一群人的最终建议拉近那个起始数字。","percentage":"在一项实验中，转盘停在 10 或 65 上，随后志愿者估计联合国成员中非洲国家占百分之几。","irrelevant":"这个毫不相关的数字显然进入了估计结果。","reference":"当原价出现在现价旁边时，前面那个数字就成了一种参照。","substantial":"它可能让不大的折扣看上去很可观。","criteria":"在听到报价前先定下自己的独立标准，能帮你把起始数字放回该有的位置。","evidence":"去考虑更广范围的证据，能帮你把起始数字放回该有的位置。","perspective":"把起始数字放回它该有的位置，才不至于被它带偏。","punishment":"一个先出现的数字可以影响量刑。","sensible":"锚点影响“什么看起来合理”。","deliberate":"前额叶皮层参与有意识的评估。"},"questions":[{"type":"例证判断","q":"Which example best illustrates the kind of influence discussed?","zh":"哪个例子最能说明文中讨论的这种影响？","options":["A film fan rates every film by a favourite actor highly.","Seeing an asking price of 800, a buyer offers 600, although similar bags elsewhere led him to expect a much lower price.","A student chooses the book with the cover she likes most.","A shopper buys a coat because it fits better than the one tried on before."],"optzh":["一个影迷因为喜欢某个演员，就把他的每部电影都打高分。","看到卖家开价 800，买家还价 600，尽管他在别处见过的同类包让他本预期远低于此。","一个学生因为喜欢封面而挑了一本书。","一个顾客因为一件外套比之前试的那件更合身而买下它。"],"answer":1,"exp":"锚定＝从一个先出现的数字出发、往回调得太少。B 里的 800 就是这个数，600 虽然低于 800，却比买家自己心里的预期高得多，正好是“被先报的数字拉高”。","detail":"先抓住定义（第 1 段）：“we may start from the first figure made available and move away from it too little”（从最先看到的数字出发，往回调得太少）。\nB 的三个要素齐全：先出现一个数字（开价 800）→ 它成了起点 → 最终出价 600 虽然低于 800，却明显高于买家根据别处同类商品形成的预期。这是“调整不足”的典型。\n排错：A 是对演员的喜爱，属于态度偏好，没有数字起点；C 是封面偏好，也没有数字；D 依据的是“合身”这一实际标准，不是先出现的数字。三者的共同问题都是缺少“数字锚点＋调整不足”。","src":""},{"type":"细节理解","q":"Why does the passage say shops show an earlier price?","zh":"文章为什么说商店要标出先前价格？","options":["To prove that the earlier price was fair.","To show how quickly a product has sold.","To demonstrate the quality of the product.","To make the apparent saving look larger."],"optzh":["为了证明先前那个价格是公道的。","为了显示商品卖得有多快。","为了证明商品的质量。","为了让看起来省下的钱显得更多。"],"answer":3,"exp":"第 3 段说原价成为 reference，会让不大的折扣 look substantial——改变的是顾客“感觉便宜了多少”。","detail":"定位第 3 段：“When the previous price appears beside the current one, the earlier number becomes a reference. It may make a small discount look substantial.”（原价出现在现价旁边时，前面那个数字成了参照，它可能让不大的折扣看起来很可观。）\n注意关键动词 make...look：它改变的是“看起来”的感受，不是价格本身，也不是商品本身，所以选 D。\n排错：A 原文从未讨论定价公平；B 销量在文中没有出现；C 原价与质量无关——这是典型的“偷换对象”干扰项。","src":""},{"type":"写作意图","q":"Why are both brain areas mentioned?","zh":"文中为什么同时提到两个脑区？","options":["To prove that people are born with the tendency.","To suggest that adjusting brain activity can eliminate the bias.","To account for effects on evaluation and on feelings.","To argue that neuroscience is more useful than observation."],"optzh":["为了证明人天生就有这种倾向。","为了说明调节大脑活动可以消除这种偏差。","为了解释它对“评估”与“感受”两方面的影响。","为了论证神经科学比观察更有用。"],"answer":2,"exp":"第 4 段说这两套系统参与，正好解释锚点为什么同时影响 what seems sensible（评估）和 what feels right（感受）。","detail":"定位第 4 段：“The involvement of these two systems could help explain why an anchor affects what seems sensible as well as what feels right.”（这两套系统都参与其中，可以解释为什么锚点既影响“什么看起来合理”，也影响“什么感觉对”。）\n前额叶皮层负责 deliberate evaluation（有意识的评估）↔ what seems sensible；杏仁核负责 emotional importance（情绪重要性）↔ what feels right。两条线一一对应，所以提到两个脑区是为了解释“双通道”，选 C。\n排错：A 原文没有说天生；B 没有提任何干预手段；D 完全没比较神经科学与观察的优劣——这三项都是把“解释机制”读成“主张”。","src":""},{"type":"主旨要义","q":"What is the text mainly intended to do?","zh":"这篇文章的主要写作目的是什么？","options":["Describe one numerical experiment in detail.","Warn consumers about a particular selling method.","Give a moral verdict on a single decision.","Explain a bias in judgment through examples."],"optzh":["详细描述一个数字实验。","提醒消费者警惕某种销售手法。","对某个决定作出道德评判。","通过多个例子解释一种判断偏差。"],"answer":3,"exp":"全篇结构：首段下定义（anchoring），中间用转盘、打折、量刑、房价等例子，末段说怎样减少影响——是“用例子解释一种偏差”。","detail":"看全篇骨架：\n第 1 段定义 anchoring（判断数量时被先出现的数字拉住、调整不足）；\n第 2 段用转盘实验证明；第 3 段用打折标签说明；\n第 4 段给机制（两个脑区）；\n第 5 段说影响范围（量刑、房价）并给出应对（先定标准、看更广证据）。\n“定义 → 多个例子 → 机制 → 应对”正是 D 说的“通过例子解释一种判断偏差”。\n排错：A 只覆盖第 2 段一个实验；B 只覆盖第 3 段打折；C 只覆盖第 5 段量刑。三者都只取局部，无法解释其他段落为何存在。","src":""}]},{"id":28,"type":"cloze","title":"The Moon My Grandfather Lost","level":"高考 · 完形","tags":["真题","完形","家庭"],"words":327,"min":9,"targets":["account","otherwise","angle","reasoning","remarkable","extraordinary","expect","predict","guide","admire","improvement","pleasure","loss"],"paras":["It takes practice to listen to people whose experiences differ from our own. When we get used to our own account of events, we may {{16}} that anyone sees them otherwise. No single person sees everything from every angle; there is {{17}} another point of view to consider. I learned that from my grandfather, who often found a {{18}} way of looking at things I took for granted.","His mind was still {{19}} in old age: he spotted weaknesses in my reasoning that I had missed. He took pleasure in learning things that were {{20}} to him. Even so, he did not regard every change as an improvement. One evening, as we watched the moon, a {{21}} came to me. I told him how extraordinary it was that people had travelled there and made it safely home.","Grandfather said he would never {{22}} that the journey was a remarkable achievement. What he remembered, though, was a {{23}} day. The very event that filled me with excitement had left him with a feeling of loss. This {{24}} me; I had expected him to be as pleased as I was.","He told me that before they had the {{25}} to light fields at night or predict the weather, people had to watch the sky. They used moonlight to find their way and watched how the moon changed to decide when to work the land. It seemed to offer {{26}} to problems they faced in their daily work. Part of it also seemed {{27}}, as if the moon held powers they could never fully explain. After the landing he found it hard to look at the sky in the same way. The guide he had {{28}} for years seemed to have become just a bare rock.","I still cannot {{29}} the image of his face as he said that. I did not stop admiring the landing, but I became more {{30}} to views I had not thought to ask about."],"tr":["要学会倾听那些经历与我们不同的人，是需要练习的。当我们习惯了自己对事情的那套说法，就可能{{16}}还有人会换个角度看这些事。没有人能从所有角度看清一切，{{17}}还有另一个角度值得考虑。这一点我是从祖父那里学到的，他常能找到{{18}}的方式，去看待我视为理所当然的事。","到了晚年，他的头脑依然{{19}}：他能发现我推理中的漏洞，而我自己没看出来。他乐于学习对他而言{{20}}的事物。即便如此，他并不把每一种变化都当成进步。有一天傍晚，我们一起看着月亮，我脑中冒出一个{{21}}。我跟他说，人居然能到那里去、又平安回来，这是多么了不起的事。","祖父说，他绝不会{{22}}那次旅程是一项非凡的成就。但他记住的，是一个{{23}}的日子。那件让我兴奋不已的事，却给他留下了失落感。这让我很{{24}}；我本以为他会和我一样高兴。","他告诉我，在人们拥有夜间照亮田地、预报天气的{{25}}之前，人只能看天。他们靠月光辨路，靠观察月亮的变化决定什么时候下地干活。月亮似乎能为他们日常劳作中的问题提供{{26}}。它的一部分似乎还是{{27}}的，仿佛月亮握有他们永远说不清的力量。登月之后，他发现自己很难再用同样的眼光看天空了。他多年来{{28}}的那个向导，似乎只剩下一块光秃的石头。","他这样说时的神情，我至今仍无法{{29}}。我没有停止敬佩那次登月，但我对那些自己没想到要去了解的观点，变得更为{{30}}。"],"blanks":[{"n":16,"options":["doubt","expect","explain","forget"],"answer":3,"zh":"忘了","exp":"前一句说跨阅历倾听需要练习，本句接着说原因：太习惯自己那套说法，就忘了别人可能另有看法。“忘了”才解释得了“需要练习”。","detail":"考查句间逻辑。“When we get used to our own account of events, we may ___ that anyone sees them otherwise.”（习惯了自己对事情的说法，我们可能___还有人会换个角度看。）\n前一句是“倾听需要练习”，本句给出原因——为什么难：太习惯自己的解释。forget 正好表示这种“忽略、没想到”。\ndoubt 是主动怀疑“是否有人持不同意见”，与“习惯自己的看法”不是同一动作；expect、explain 都不能说明“忽略他人视角”。"},{"n":17,"options":["always","seldom","barely","previously"],"answer":0,"zh":"总是","exp":"分号前说“没有人能看清一切”，分号后自然推出：总还有别的角度。always 表示这种角度的“始终存在”。","detail":"考查前后分句的对应关系。“No single person sees everything from every angle; there is ___ another point of view to consider.”\n前半句承认个人视角有边界，后半句因此推出“始终还有别的角度”。always 与“另有一个角度”构成顺承。\nseldom、barely 都是否定方向，等于说“几乎没有别的角度”，与前半句的让步逻辑相反；previously 只谈过去，与这里的一般道理不符。"},{"n":18,"options":["pleasant","traditional","different","simpler"],"answer":2,"zh":"不同的","exp":"前文一直在说“别人会有不同看法”，祖父提供的正是“另一个角度”，所以是 different way。","detail":"考查代词回指与语义一致。“I learned that from my grandfather, who often found a ___ way of looking at things I took for granted.”\nthat 回指的是前两句的“总还有另一个角度可考虑”，祖父给的正是另一种视角，所以 different。\npleasant（令人愉快的）与后文“失落感”冲突；traditional、simpler 只是可能的特点，都没有表达“与我的想法不同”这一关键。"},{"n":19,"options":["restless","calm","sharp","absent"],"answer":2,"zh":"敏锐的","exp":"冒号后举例：他能发现我漏掉的推理漏洞。这正说明头脑 sharp（敏锐）。","detail":"考查冒号后的例证关系。“His mind was still ___ in old age: he spotted weaknesses in my reasoning that I had missed.”\n冒号后是解释：能察觉别人漏掉的逻辑漏洞，说明思维敏锐 → sharp。\nrestless 指坐立不安，calm 指镇定，absent 指心不在焉（absent-minded），三者都无法概括“看出推理漏洞”这一能力。"},{"n":20,"options":["familiar","new","unnecessary","private"],"answer":1,"zh":"新的","exp":"后句用 Even so 转折：他不把每种变化都当进步。转折前应是“他乐意接触新事物”。","detail":"考查 Even so 的转折结构。“He took pleasure in learning things that were ___ to him. Even so, he did not regard every change as an improvement.”\nEven so（即便如此）表明：前句说他愿意接触新东西，后句再限定“但也不是什么都接受”。所以填 new。\nfamiliar 与“乐于学习”的开放性相反；unnecessary、private 与“对变化的态度”无关。"},{"n":21,"options":["thought","gesture","sigh","warning"],"answer":0,"zh":"念头","exp":"“a ___ came to me”后面紧接我说出口的那段感想，说明冒出来的是一个想法。","detail":"考查固定表达与下文照应。“One evening, as we watched the moon, a ___ came to me. I told him how extraordinary it was that people had travelled there...”\na thought came to me（我忽然想到）是固定搭配；下一句正是这个想法的内容（登月多么了不起）。\ngesture（手势）、sigh（叹息）、warning（警告）都无法接“came to me 后引出感想”这一语境，且后文是赞叹而非警告。"},{"n":22,"options":["repeat","deny","measure","predict"],"answer":1,"zh":"否认","exp":"后文说“但他记住的是一个难过的日子”，说明他承认成就、只是感受不同。never deny＝绝不否认。","detail":"考查让步关系。“Grandfather said he would never ___ that the journey was a remarkable achievement. What he remembered, though, was a sad day.”\n后半句的 though 表明：他承认这是成就，只是自己的感受不同。never deny（绝不否认）正好承担“承认”这一层。\nrepeat 只是重复说，measure、predict 无法与 that 从句构成“承认”之意。"},{"n":23,"options":["sad","typical","lucky","ordinary"],"answer":0,"zh":"令人难过的","exp":"下一句直说“那件事给他留下了失落感（a feeling of loss）”，所以那天对他是“难过的”。","detail":"考查同义复现。“What he remembered, though, was a ___ day. The very event that filled me with excitement had left him with a feeling of loss.”\n下一句的 a feeling of loss 是对该空最直接的解释 → sad。\ntypical、ordinary 抹掉了这一天对祖父的特殊意义；lucky 是正面评价，与“失落”相反。"},{"n":24,"options":["amused","shocked","comforted","embarrassed"],"answer":1,"zh":"震惊","exp":"我本以为他会和我一样高兴，结果听到的是失落——预期与结果冲突，所以是“震惊”。","detail":"考查预期与结果的落差。“This ___ me; I had expected him to be as pleased as I was.”\n分号后给出原因：我原以为他会高兴，实际却是失落。预期被打破 → shocked。\namused（觉得好笑）、comforted（感到安慰）、embarrassed（窘迫）都缺少“预期落差”这一触发条件。"},{"n":25,"options":["permission","information","technology","patience"],"answer":2,"zh":"技术","exp":"夜间照明和预报天气都是靠技术实现的，所以是“在拥有这种技术之前”。","detail":"考查并列成分的概括。“before they had the ___ to light fields at night or predict the weather”\nto light fields（夜间照明）与 predict the weather（预报天气）都是技术手段才能做到的事，故填 technology。\npermission（许可）给不了照明；patience（耐心）与手段无关；information 本身不能照亮田地——这是本题最强的排除点。"},{"n":26,"options":["harvests","memories","solutions","excuses"],"answer":2,"zh":"解决办法","exp":"前文说月亮帮他们辨路、安排农时，都是解决实际问题的办法，且 solutions to problems 是固定搭配。","detail":"考查搭配与语义。“It seemed to offer ___ to problems they faced in their daily work.”\n照路、定农时都是解决日常实际问题的办法；solutions to problems 是固定搭配，语义与搭配双对。\nharvests（收成）不是“提供给问题的”；memories、excuses 都不能“解决”劳作中的问题。"},{"n":27,"options":["reliable","scientific","familiar","magical"],"answer":3,"zh":"神奇的","exp":"as if 后说“月亮握有他们永远无法完全解释的力量”，无法解释的力量＝magical。","detail":"考查 as if 从句对词义的解释。“Part of it also seemed ___, as if the moon held powers they could never fully explain.”\nas if 后面就是解释：有他们永远说不清的力量 → magical（神奇的）。\nreliable（可靠的）、scientific（科学的）、familiar（熟悉的）都与“无法解释的力量”这一神秘感相反。"},{"n":28,"options":["left behind","lived by","argued against","stood apart from"],"answer":1,"zh":"依循；据以生活","exp":"guide 回指的是他们“靠月亮安排生活”，所以是他多年“依循”的向导。","detail":"考查短语动词与上下文回指。“The guide he had ___ for years seemed to have become just a bare rock.”\nguide 回指上文的月亮——人们靠月光辨路、看月相定农时，也就是“依它而生活”。live by 正是“以……为生活依据”。\nleave behind（抛下）、argue against（反对）、stand apart from（与……保持距离）都不能体现“长年遵循”这层含义。"},{"n":29,"options":["record","identify","restore","shake"],"answer":3,"zh":"挥去；摆脱","exp":"still 与 cannot 表明这个画面至今留在脑中、无法“摆脱”。shake the image＝把画面甩掉。","detail":"考查 still 与 cannot 的语气。“I still cannot ___ the image of his face as he said that.”\nstill 说明印象至今留存，cannot 与之配合，表示“怎么都甩不掉”。shake 有“摆脱（想法、印象）”之义，cannot shake the image＝挥之不去。\nrecord（记录）、identify（辨认）、restore（复原）都不能表达“深刻印象挥不去”。"},{"n":30,"options":["open","indifferent","opposed","immune"],"answer":0,"zh":"愿意接受的","exp":"but 后说的是这次对话带来的改变：对以前没想到去了解的观点，我变得更愿意听取。","detail":"考查 but 的转折与全文呼应。“I did not stop admiring the landing, but I became more ___ to views I had not thought to ask about.”\nbut 后写变化：从没想过去问 → 现在更愿意听。open to views＝愿意接受不同观点，也呼应开头“倾听经历不同的人”。\nindifferent（不在乎）、opposed（反对）、immune（不受影响）都不是“更愿意听”，方向全错。"}],"questions":[]}],"dict":{"was":"v. 是（原形）,其人称和时态形式有(am, is, are, was, were, being, been)；成为","a":"art. 一（个、件……）","quiet":"a. 安静的；寂静的","boy":"n. 男孩","in":"prep. 在…里(内)；在…；以… ad. 在家，在内，向内","class":"n. （学校的）班；年级；课","when":"conj. 当…的时候 ad. 什么时候，何时","asked":"v. 问；请求，要求；邀请","what":"pron. 什么,怎么样 a. 多么，何等；什么","he":"pron. 他","wanted":"vt. 想,想要,需要,必要","to":"prep. （动词不定式符号，无词义）；（表示接受动作的人或物）给；对，向，到；在…之前","do":"v. 做 aux. （构成疑问/否定）","after":"prep. 在…之后","high":"a. 高的;高度的 ad. 高地","school":"n. 学校","always":"ad. 总是；一直；永远","said":"vt. 说，讲","build":"v. 建筑；造","bridges":"n. 桥","his":"pron. 他的","classmates":"n. 同班同学","laughed":"n.& v. 笑，大笑；嘲笑","because":"conj. 因为","english":"a. 英国的，英国人的，英语的 n. 英语","the":"art. 这（那）个,这（那）些（用于特定人或物，序数词，最高级，专有名词，世上独一 无二事物前）","worst":"a. (bad的最高级)最坏的","could":"modal can 的过去式；可能","rea function wp(w){if(!S.words[w])S.words[w]={lv:0,next:shift(-1),seen:0,ok:0,bad:0,last:'',lastDate:'',first:today()};return S.words[w]}
function rate(w,level){
  var st=wp(w),lv;
  if(level==='y')lv=1;else if(level==='v')lv=Math.max(1,st.lv);else lv=Math.min(IV.length-1,st.lv+1);
  st.lv=lv;st.seen=(st.seen||0)+1;
  if(level==='g')st.ok=(st.ok||0)+1;else st.bad=(st.bad||0)+1;
  st.last=level==='y'?'bad':level==='v'?'vague':'good';
  st.lastDate=today();
  st.next=shift(IV[Math.min(lv,IV.length-1)]);
  if(!S.stats)S.stats={days:{}};
  if(!S.stats.days)S.stats.days={};
  var dd=S.stats.days[today()]||(S.stats.days[today()]={r:0,ok:0,bad:0});
  dd.r=(dd.r||0)+1;
  if(level==='g')dd.ok=(dd.ok||0)+1;else dd.bad=(dd.bad||0)+1;

}
function due(w){var st=S.words[w];return !!st&&(st.next||'2000-01-01')<=today()}

  var total=DATA.words.length,seen=0,duec=0;
  for(var i=0;i<DATA.words.length;i++){var w=DATA.words[i].word;if(S.words[w]){seen++;if(due(w))duec++}}
  return {total:total,seen:seen,due:duec,passages:DATA.passages.length};
}

  var out=[];
  DATA.words.forEach(function(x){var st=S.words[x.word];if(st&&due(x.word))out.push({w:x.word,p:st.last==='bad'?0:st.last==='vague'?1:2})});
  out.sort(function(a,b){return a.p-b.p});
  return out.map(function(x){return x.w});
}
function pickBatch(n){
  var out=dueList();
  DATA.words.forEach(function(x){if(out.length<n&&isNew(x.word))out.push(x.word)});

}

var DOLLAR=String.fromCharCode(36);
function escRe(w){w=String(w).replace(/[^A-Za-z]+/g,'');return w.replace(/[.*+?^$()|[\]\\]/g,'\\' + DOLLAR + '&')}

var IRR={find:['found'],keep:['kept'],lose:['lost'],spend:['spent'],tell:['told'],make:['made'],take:['took','taken'],get:['got'],begin:['began','begun'],grow:['grew','grown'],know:['knew','known'],say:['said'],pay:['paid'],feel:['felt'],leave:['left'],mean:['meant'],meet:['met'],run:['ran'],see:['saw','seen'],think:['thought'],write:['wrote','written'],bring:['brought'],buy:['bought'],catch:['caught'],teach:['taught'],hold:['held'],stand:['stood'],understand:['understood'],win:['won'],sit:['sat'],sleep:['slept'],speak:['spoke','spoken'],break:['broke','broken'],choose:['chose','chosen'],drive:['drove','driven'],eat:['ate','eaten'],fall:['fell','fallen'],give:['gave','given'],hear:['heard'],send:['sent'],sell:['sold'],show:['shown'],wake:['woke','woken'],wear:['wore','worn'],become:['became'],come:['came'],child:['children'],man:['men'],woman:['women'],person:['people'],foot:['feet'],go:['went','gone'],do:['did','done','does'],have:['had','has'],be:['is','are','was','were','been','being']};
var SUF=['s','es','ed','d','ing','er','est','ly','ies','ied','ier','iest','ily','ness','ful','less','ally'];
function isForm(m,w){
  var M=m.toLowerCase(),W=w.toLowerCase();
  if(M===W)return true;
  var irr=IRR[W];if(irr&&irr.indexOf(M)>=0)return true;
  var bases=[W];
  if(/e$/.test(W))bases.push(W.slice(0,-1));
  if(/y$/.test(W))bases.push(W.slice(0,-1));
  for(var i=0;i<bases.length;i++){
    var b=bases[i];
    if(M.indexOf(b)!==0)continue;
    var rest=M.slice(b.length);
    if(SUF.indexOf(rest)>=0)return true;
    if(/^([a-z])(ed|ing|er|est)$/.test(rest))return true;
  }
  return false;
}
function stemOf(w){var n=w.length;if(n<=3)return w;return w.slice(0,n>=8?n-3:n-2)}
function hitTarget(word,targets){
  for(var i=0;i<targets.length;i++){if(isForm(word,targets[i]))return targets[i]}
  return '';
}
/* 每个单词都包成 span：重点词 .tw（可点开词卡），其余 .wd（长按查中文） */
function renderWithTargets(para,targets){
  var re=/[A-Za-z]+(?:['’-][A-Za-z]+)*/g,m,out='',last=0;
  while((m=re.exec(para))){
    out+=esc(para.slice(last,m.index));
    var w=m[0],t=hitTarget(w,targets);
    out+=t?'<span class="tw" data-w="'+esc(t)+'">'+esc(w)+'</span>'
          :'<span class="wd">'+esc(w)+'</span>';
    last=m.index+w.length;
  }
  return out+esc(para.slice(last));
}

function dictOf(word){
  var w=String(word||'').toLowerCase().replace(/^['’-]+|['’-]+$/g,'');
  if(!w)return null;
  var d=DATA.dict||{};
  if(d[w])return {w:w,zh:d[w]};
  var cands=[w];
  if(/ies$/.test(w))cands.push(w.slice(0,-3)+'y');
  if(/(es|s)$/.test(w))cands.push(w.replace(/(es|s)$/,''));
  if(/ied$/.test(w))cands.push(w.slice(0,-3)+'y');
  if(/ed$/.test(w))cands.push(w.slice(0,-2),w.slice(0,-1));
  if(/ing$/.test(w))cands.push(w.slice(0,-3),w.slice(0,-3)+'e');
  if(/(er|est)$/.test(w))cands.push(w.replace(/(er|est)$/,''),w.replace(/(er|est)$/,'')+'e');
  if(/([b-df-hj-np-tv-z])\1(ed|ing|er|est)$/.test(w))cands.push(w.replace(/([b-df-hj-np-tv-z])\1(ed|ing|er|est)$/,'$1'));
  for(var i=0;i<cands.length;i++){if(d[cands[i]])return {w:cands[i],zh:d[cands[i]]}}
  return null;
}

function wordAt(node){
  while(node&&node!==document.body){
    if(node.dataset&&node.dataset.w)return node;

function bindLongPress(){
  var art=document.querySelector('.article');if(!art)return;
  var start=function(x,y,el){
    LP.x=x;LP.y=y;clearTimeout(LP.timer);
    LP.timer=setTimeout(function(){
      if(!el)return;
      LP.fired=Date.now();
      try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}
      showLookup(el);
    },420);
  };
  art.addEventListener('touchstart',function(e){
    var t=e.touches&&e.touches[0];if(!t)return;
    var el=wordAt(e.target);if(!el)return;
    start(t.clientX,t.clientY,el);
  },{passive:true});
  art.addEventListener('touchmove',function(e){
    var t=e.touches&&e.touches[0];if(!t)return;
    if(Math.abs(t.clientX-LP.x)>10||Math.abs(t.clientY-LP.y)>10){clearTimeout(LP.timer);tipHide()}
  },{passive:true});
  art.addEventListener('touchend',function(){clearTimeout(LP.timer)},{passive:true});
  art.addEventListener('mousedown',function(e){

  });
  art.addEventListener('mouseup',function(){clearTimeout(LP.timer)});
  art.addEventListener('mouseleave',function(){clearTimeout(LP.timer)});
  document.addEventListener('touchstart',function(e){if(!wordAt(e.target))tipHide()},{passive:true});

}

}

    closeSheet();
    if(isCl){
      for(var j=0;j<n;j++)clozeSet((p.blanks[j]||{}).n,s.charCodeAt(j)-65);
      toast('已判分，右边看解析');
    }else{
      for(var i=0;i<n;i++)answer(i,s.charCodeAt(i)-65);
      toast('已判分');
    }
  };
}
function newerRec(a,b){
  var x=(a&&a.lastDate)||'',y=(b&&b.lastDate)||'';
  if(x!==y)return x>y;
  return ((a&&a.seen)||0)>((b&&b.seen)||0);
}
function mergeProgress(base,inc){
  var out=merge({words:Object.assign({},base.words||{}),passages:Object.assign({},base.passages||{}),settings:base.settings});
  var k,st,cur;
  for(k in (inc.words||{})){
    st=inc.words[k];cur=out.words[k];
    if(!cur||newerRec(st,cur))out.words[k]=st;
  }
  for(k in (inc.passages||{})){
    st=inc.passages[k]||{};cur=out.passages[k]||{date:'',ans:{}};
    out.passages[k]={date:(st.date||'')>(cur.date||'')?st.date:cur.date,ans:Object.assign({},cur.ans||{},st.ans||{})};
  }
  return out;
}
/* ===== 手机 ↔ 平板 自动同步：进度存进一个私有 Gist ===== */
var SK='cijing.sync.v1';
var SK_OLD='cjbao.sync.v1';
var SYNC=(function(){
  try{
    if(!localStorage.getItem(SK)){
      var ov=localStorage.getItem(SK_OLD);
      if(ov){localStorage.setItem(SK,ov);localStorage.removeItem(SK_OLD)}
    }
  }catch(e){}
  try{var r=JSON.parse(localStorage.getItem(SK)||'null');
    if(r&&r.token)return {token:r.token,gist:r.gist||'',last:r.last||0,on:!!r.on};
  }catch(e){}
  return {token:'',gist:'',last:0,on:false};
})();
function syncSave(){try{localStorage.setItem(SK,JSON.stringify(SYNC))}catch(e){}}
function syncReady(){return !!(SYNC.on&&SYNC.token&&SYNC.gist)}
function hasNet(){return typeof fetch==='function'}
function ghApi(method,path,body){
  var h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+SYNC.token};
  if(body)h['Content-Type']='application/json';
  return fetch('https://api.github.com'+path,{method:method,headers:h,body:body?JSON.stringify(body):null}).then(function(r){
    if(r.status===401)throw new Error('令牌无效，重新生成一个');
    if(r.status===403)throw new Error('权限不够：要用 Classic 令牌并勾上 gist');
    if(r.status===404)throw new Error('同步码不对，或者令牌看不到它');
    if(!r.ok)throw new Error('GitHub 返回 '+r.status);
    return r.json();
  });
}
function syncBody(){return {v:1,at:new Date().toISOString(),S:S}}
function softRefresh(){
  // 同步带回来的改动只在首页重绘。做题、复习、或弹层开着时重绘会把页面打回开头，
  // 题目状态全丢——所以这些时候只存不画，等你自己回到首页自然会刷新。
  if(!state||state.screen!=='home')return;
  if(state.reading||state.review)return;
  if(sheetOn())return;
  render();
}
function syncNow(manual,after){
  if(!hasNet()){if(manual)toast('这个浏览器不支持同步');return Promise.resolve(false)}
  if(!syncReady()){if(manual)toast(SYNC.token?'先新建一个同步码':'先把令牌粘进来');return Promise.resolve(false)}
  return ghApi('GET','/gists/'+SYNC.gist).then(function(j){
    var f=(j.files||{})['cijing.json'];
    if(!f)return null;
    if(f.truncated&&f.raw_url)return fetch(f.raw_url).then(function(r){return r.text()}).then(function(t){return JSON.parse(t)});
    return JSON.parse(f.content||'null');
  }).then(function(remote){
    if(remote&&remote.S&&remote.S.words){
      var b=JSON.stringify(S);
      S=mergeProgress(S,remote.S);
      if(JSON.stringify(S)!==b){save();softRefresh()}
    }
    return ghApi('PATCH','/gists/'+SYNC.gist,{files:{'cijing.json':{content:JSON.stringify(syncBody())}}});
  }).then(function(){
    SYNC.last=Date.now();syncSave();
    if(manual)toast('已同步');
    if(after)after();
    return true;
  }).catch(function(e){
    if(manual)toast(String((e&&e.message)||e));
    return false;
  });
}
function syncCreate(){
  if(!hasNet())return;
  if(!SYNC.token){toast('先把令牌粘进来');return}
  toast('正在新建…');
  ghApi('POST','/gists',{description:'词境进度（手机 ↔ 平板同步用）',public:false,files:{'cijing.json':{content:JSON.stringify(syncBody())}}})
    .then(function(j){SYNC.gist=j.id;SYNC.on=true;SYNC.last=Date.now();syncSave();openBackup();toast('同步码好了，填到另一台')})
    .catch(function(e){toast(String((e&&e.message)||e))});
}
function syncAgo(t){
  var m=Math.round((Date.now()-t)/60000);
  if(m<1)return '刚刚';
  if(m<60)return m+' 分钟前';
  var h=Math.round(m/60);
  if(h<48)return h+' 小时前';
  return Math.round(h/24)+' 天前';
}
function syncState(){
  if(!SYNC.token)return '还没连。连上以后，这边学的词会自动跑到另一台，哪边都不用手动传文件。';
  if(!SYNC.gist)return '令牌有了，再点「新建同步码」。';
  return (SYNC.on?'已连接':'已断开')+' · 同步码 <b style="font-family:ui-monospace,monospace">'+esc(SYNC.gist)+'</b><br>'+(SYNC.last?'上次同步：'+syncAgo(SYNC.last):'还没同步过');
}
var syncT=null;
function queueSync(){
  if(!syncReady())return;
  if(syncT)clearTimeout(syncT);
  syncT=setTimeout(function(){syncNow(false)},9000);
}
/* 背完就锁屏/切走：别等 9 秒的定时器，立刻推一次 */
try{
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'&&syncReady()){
      if(syncT){clearTimeout(syncT);syncT=null;syncNow(false)}
    }
  });
}catch(e){}
function storeLabel(){return STORE==='local'?'本机永久保存，关掉页面也还在':STORE==='session'?'只在这一次打开期间有效，关掉就没了':'这个浏览器不保存，关掉就没了'}
function openBackup(){
  var txt=JSON.stringify(S);
  var sy='<div class="hr"></div><h3 style="margin-top:0">手机 ↔ 平板 自动同步</h3><p class="muted" id="sy-state">'+syncState()+'</p><label>GitHub 令牌（只勾 gist）</label><input id="sy-token" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ghp_ 开头的那一串" value="'+esc(String(SYNC.token||""))+'"><label>同步码</label><input id="sy-code" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="另一台设备上显示的同步码" value="'+esc(String(SYNC.gist||""))+'"><div class="row" style="margin-top:12px"><button class="btn" id="sy-go" style="flex:1">连接并同步</button><button class="btn soft" id="sy-new" style="flex:1">新建同步码</button></div><p class="muted" style="font-size:12px;line-height:1.65">怎么拿令牌：电脑开 github.com → 头像 → Settings → Developer settings → Personal access tokens → <b>Tokens (classic)</b> → Generate new token (classic) → 只勾 <b>gist</b> → 点最下面 Generate token → 复制那一串（只显示一次）。手机、平板各粘一次就通，令牌只留在你这台设备里。</p>';
  openSheet('<h3>进度备份 / 设备同步</h3><p class="muted">当前存储：<b>'+storeLabel()+'</b>。</p>'+sy+'<div class="hr"></div><p class="muted">没网的时候还能手动传：A 机导出 → 微信传给 B 机 → B 机点「从文件恢复」，合并只补不删。</p><div class="row" style="margin-top:10px"><button class="btn" id="bk-dl" style="flex:1">导出文件</button><button class="btn soft" id="bk-imp" style="flex:1">从文件恢复</button></div><input type="file" id="bk-file" accept=".json,application/json" style="display:none"><label style="margin-top:14px">或者复制下面这段文字</label><textarea id="bk" style="min-height:110px;font-size:12px">'+esc(txt)+'</textarea><div class="row" style="margin-top:12px"><button class="btn soft" id="bk-copy" style="flex:1">复制</button><button class="btn" id="bk-restore" style="flex:1">恢复</button></div><button class="btn grey block" id="bk-close" style="margin-top:8px">关闭</button>');
  document.getElementById('bk-dl').onclick=function(){
    var name='词境进度-'+today()+'.json';
    try{
      var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);if(a.parentNode)a.parentNode.removeChild(a)},3000);
      toast('已存到手机的“下载”文件夹');
    }catch(e){toast('这个浏览器不能下载，请用下面的文字复制')}
  };
  document.getElementById('bk-imp').onclick=function(){document.getElementById('bk-file').click()};
  document.getElementById('bk-file').onchange=function(ev){
    var f=ev.target.files&&ev.target.files[0];if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){try{var r=JSON.parse(String(fr.result));if(!r.words)throw 0;S=mergeProgress(S,r);save();closeSheet();render();toast('已合并，两边都学到了')}catch(e){toast('这个文件不对，请选“词境进度-日期.json”')}};
    fr.onerror=function(){toast('读不了这个文件')};
    fr.readAsText(f);
  };
  document.getElementById('bk-copy').onclick=function(){
    var t=document.getElementById('bk'),txt=String(t.value||'');
    var ok=function(){toast('已复制')};
    var bad=function(){try{t.focus();t.select();document.execCommand('copy');ok()}catch(e){toast('请长按手动复制')}};
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,bad);return}
    }catch(e){}
    bad();
  };
  document.getElementById('bk-restore').onclick=function(){try{var r=JSON.parse(document.getElementById('bk').value);if(!r.words)throw 0;S=mergeProgress(S,r);save();closeSheet();render();toast('已合并')}catch(e){toast('格式不对，检查是否复制完整')}};
  document.getElementById('sy-token').onchange=function(){SYNC.token=String(this.value||'').trim();syncSave()};
  document.getElementById('sy-code').onchange=function(){SYNC.gist=String(this.value||'').trim();syncSave()};
  document.getElementById('sy-new').onclick=function(){
    SYNC.token=String(document.getElementById('sy-token').value||'').trim();syncSave();syncCreate();
  };
  document.getElementById('sy-go').onclick=function(){
    SYNC.token=String(document.getElementById('sy-token').value||'').trim();
    var code=String(document.getElementById('sy-code').value||'').trim();
    if(!SYNC.token){toast('先把令牌粘进来');return}
    if(!code){toast('没有同步码就点右边「新建同步码」');return}
    SYNC.gist=code;SYNC.on=true;syncSave();
    syncNow(true,function(){openBackup()});
  };
  document.getElementById('bk-close').onclick=closeSheet;
}
function openSettings(){
  openSheet('<h3>设置</h3><label>每天新词</label><select id="st-daily"><option value="8">8 个（很轻松）</option><option value="12">12 个（默认）</option><option value="20">20 个（加量）</option><option value="30">30 个（冲刺）</option></select><label>每次复习最多几个</label><select id="st-rev"><option value="10">10 个</option><option value="20">20 个（默认）</option><option value="30">30 个</option><option value="50">50 个</option><option value="0">全部到期词</option></select><p class="muted" style="margin:0">复习规则：“认识”按 1→2→4→7→15→30 天递增；“模糊”保持同一间隔；“不认识”降到 1 天后再来。</p><div class="hr"></div><button class="btn" id="st-save">保存</button>');
  document.getElementById('st-daily').value=String(S.settings.dailyNew||12);
  document.getElementById('st-rev').value=String(S.settings.revMax==null?20:S.settings.revMax);
  document.getElementById('st-save').onclick=function(){
    S.settings.dailyNew=Number(document.getElementById('st-daily').value)||12;
    S.settings.revMax=Number(document.getElementById('st-rev').value);
    if(isNaN(S.settings.revMax))S.settings.revMax=20;
    save();closeSheet();render();toast('已保存，首页数字已经跟着变了');
  };
}
var ROT='portrait';
var ROTMODE='';   /* '' 竖屏 | 'native' 系统转屏 | 'css' 兜底旋转 */
function detectOri(){
  try{var a=screen.orientation&&screen.orientation.angle;
    if(typeof a==='number'){ROT=(a===90||a===270||a===-90)?'landscape':'portrait';return}}catch(e){}
  try{ROT=window.matchMedia('(orientation:portrait)').matches?'portrait':'landscape'}
  catch(e){ROT=(window.innerHeight||0)>(window.innerWidth||0)?'portrait':'landscape'}
}
function isRot(){return ROTMODE!==''}
function toTop(){try{window.scrollTo(0,0)}catch(e){}
  var w=document.getElementById('rotwrap');if(w&&w.scrollTop)w.scrollTop=0;
  var m=document.getElementById('app');if(m&&m.scrollTop)m.scrollTop=0}
function drawerOn(){return ROTMODE==='drawer'}
function mountQuizHandle(){
  if(!drawerOn())return;
  var q=document.querySelector('.col-quiz');if(!q||q.querySelector('.quiz-handle'))return;
  var b=document.createElement('button');b.type='button';b.className='quiz-handle';
  b.innerHTML='<span id="qh-txt">题目 · 点这里展开</span>';
  q.insertBefore(b,q.firstChild);
  b.onclick=function(){
    var on=q.classList.toggle('open');
    var t=document.getElementById('qh-txt');
    if(t)t.textContent=on?'收起题目':'题目 · 点这里展开';
  };
}
function enterDrawer(){ROTMODE='drawer';syncRot();mountQuizHandle()}
function rotLabel(){
  var b=document.getElementById('btn-rot');if(!b)return;
  b.textContent=isRot()?'⟲':'⟳';
  b.title=ROTMODE==='native'?'转回竖屏':ROTMODE==='drawer'?'收起题目栏':'横屏 / 边看边做';
  b.setAttribute('aria-label',b.title);
}
function syncRot(){
  try{var h=document.documentElement;
    if(ROTMODE==='drawer')h.classList.add('drawer');else h.classList.remove('drawer')}catch(e){}
  rotLabel();toTop();
}
function exitAll(){
  ROTMODE='';
  try{if(screen&&screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
  try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}
  syncRot();
}
function nativeLandscape(){
  var el=document.documentElement;
  var req=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen;
  if(!req)return false;
  try{if(!(screen&&screen.orientation&&screen.orientation.lock))return false}catch(e){return false}
  try{var pr=req.call(el);if(pr&&pr.catch)pr.catch(function(){})}catch(e){return false}
  try{var lk=screen.orientation.lock('landscape');if(lk&&lk.catch)lk.catch(function(){})}catch(e){return false}
  return true;
}
function toggleRot(){
  if(ROTMODE){var was=ROTMODE;exitAll();toast(was==='drawer'?'已收起题目栏':'已转回竖屏');return}
  if(!nativeLandscape()){
    enterDrawer();
    toast('这个浏览器不能强制横屏，已把题目钉在屏幕下方，边看边做');
    return;
  }
  setTimeout(function(){
    var a=-1;try{a=screen.orientation.angle}catch(e){}
    if(a===90||a===270||a===-90){ROTMODE='native';syncRot();toast('已横屏')}
    else{
      try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}
      try{if(screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
      enterDrawer();
      toast('没转成功，已把题目钉在屏幕下方');
    }
  },800);
}
function boot(){
  detectOri();ROTMODE='';syncRot();bindBackdrop();render();
  if(syncReady())setTimeout(function(){syncNow(false)},1500);
  if(ROT==='portrait'&&!S.settings.rotHint){
    S.settings.rotHint=1;save();
    setTimeout(function(){toast('想左右分栏？点右上角 ⟳ 转成横屏')},900);
  }
  var onResize=function(){detectOri();rotLabel()};
  try{window.addEventListener('resize',onResize)}catch(e){}
  try{window.addEventListener('orientationchange',onResize)}catch(e){}
  try{document.addEventListener('fullscreenchange',function(){
    if(ROTMODE==='native'&&!document.fullscreenElement){ROTMODE='';syncRot()}
  })}catch(e){}
}
/* 从 http(s) 打开时注册离线缓存；本地文件打开自动跳过 */
try{
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.protocol==='http:')){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
}catch(e){}
boot();
})();
