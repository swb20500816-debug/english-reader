<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>词境 · 高三英语词汇阅读</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-title" content="词境">
<style>
:root{--bg:#f7f4ee;--card:#fffdf8;--ink:#1f2433;--ink2:#5b6172;--ink3:#8b90a0;--line:#e7e1d4;--accent:#b4552d;--accent-soft:#f2e3da;--good:#2f7d5c;--good-soft:#e3f0e9;--bad:#b23b3b;--bad-soft:#f7e6e3;--warn:#b07d18;--warn-soft:#f7edd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6}
body[data-font="serif"]{--read-font:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif}
.hidden{display:none!important}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.topbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(247,244,238,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:4px;min-width:0}
#btn-back{display:none;font-size:20px;line-height:1}
.brand{font-weight:800;font-size:17px;letter-spacing:.02em}
.brand span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
.tb-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);font-size:16px}
.icon-btn:active{background:var(--accent-soft)}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(48px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(31,36,51,.04)}
.hero{background:linear-gradient(150deg,#fffdf8 0%,#fbf3ea 100%)}
.h1{font-size:19px;font-weight:800;letter-spacing:.01em;margin:0 0 4px}
.sub{color:var(--ink2);font-size:13px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;transition:transform .06s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.grey{background:#efece4;color:var(--ink2)}
.btn.block{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--accent-soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat small{color:var(--ink2);font-size:11px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em}
.readlink{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.readlink:active{background:#faf6ee}
.readlink .t{font-weight:700;font-size:15px;margin-bottom:2px}
.readlink .m{font-size:12px;color:var(--ink3)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.grey{background:#efece4;color:var(--ink3)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#efece4;color:var(--ink2)}
.reader-head{margin-bottom:12px}
.reader-title{font-size:21px;font-weight:800;line-height:1.35;margin:2px 0 6px}
.reader-meta{font-size:12px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap}
.article{font-size:17.5px;line-height:1.95;color:var(--ink);letter-spacing:.01em}
body[data-font="serif"] .article{font-family:var(--read-font);font-size:18px}
.article p{margin:0 0 14px}
.article .para-num{display:inline-block;min-width:20px;font-size:11px;color:var(--ink3);vertical-align:2px;font-family:ui-monospace,monospace}
.tw{color:#a8401b;font-weight:700;background:linear-gradient(transparent 60%,rgba(230,190,160,.45) 60%);border-bottom:2px solid rgba(168,64,27,.5);padding:0 1px;border-radius:2px;cursor:pointer}
.tw:active{background:rgba(230,190,160,.75)}
.tw.looked{background:rgba(240,214,196,.9);border-bottom-color:#a8401b}
.hintbar{display:flex;gap:8px;margin:12px 0}
.gloss{background:#fbf7ef;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;margin:12px 0}
.gloss div{padding:3px 0}
.gloss b{color:var(--accent)}
.gloss .zh{color:var(--ink2)}
.q-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.q-text{font-size:16px;font-weight:700;line-height:1.6;margin:0 0 4px}
.q-type{font-size:11px;color:var(--ink3);letter-spacing:.04em}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;line-height:1.55}
.opt .k{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#efece4;font-weight:700;font-size:13px;color:var(--ink2)}
.opt:active{background:#faf6ee}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .mark{margin-left:auto;font-weight:800;font-size:15px}
.exp{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:#f8f5ee;font-size:14px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--accent)}
.exp.show{display:block}
.exp .src{color:var(--ink);font-style:italic}
.q-detail{display:inline-block;margin-top:10px;min-height:32px;padding:0 12px;font-size:13px}
.expfull{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:#fff;border:1px dashed var(--line);font-size:13.5px;line-height:1.8;color:var(--ink2)}
.expfull.show{display:block}
.expfull p{margin:0 0 9px}
.expfull p:last-child{margin-bottom:0}
.expfull b{color:var(--ink)}
.clb{display:inline-block;min-width:36px;height:26px;padding:0 8px;margin:0 2px;border:1.5px dashed var(--accent);border-radius:8px;background:#fff;color:var(--accent);font-weight:700;font-size:13px;line-height:23px;vertical-align:baseline;cursor:pointer}
.clb.ok{background:#eef6f0;border-style:solid;border-color:var(--good);color:var(--good)}
.clb.bad{background:#fdecea;border-style:solid;border-color:var(--bad);color:var(--bad)}
.clzh{color:var(--ink2)}
.clitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.7}
.clitem:last-child{border-bottom:0}
.clitem b.n{color:var(--accent);margin-right:4px}
.ocl{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px;color:var(--ink);line-height:1.5}
.ocl .k{width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:#f1ece1;color:var(--ink2);font-size:12px;font-weight:700;flex:none}
.ocl.ok{border-color:var(--good);background:#eef6f0}
.ocl.bad{border-color:var(--bad);background:#fdecea}
.ocl.dim{opacity:.5}
.flash{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 6px 24px rgba(31,36,51,.06)}
.flash-word{font-size:38px;font-weight:800;letter-spacing:.01em;word-break:break-word}
.flash-phon{color:var(--ink3);font-size:14px;margin-top:2px;font-family:ui-monospace,monospace}
.flash-back{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);text-align:left;font-size:15px;line-height:1.7;display:none}
.flash-back.show{display:block}
.sense{margin-bottom:8px}
.sense .pos{color:var(--accent);font-weight:700;font-size:13px;margin-right:4px}
.sense .zh{font-weight:700}
.sense .ex{color:var(--ink2);font-size:13.5px;margin-top:2px}
.sense .exhint{color:var(--ink3);font-size:12.5px}
.fopts{display:grid;gap:10px;margin-top:18px;text-align:left}
.fopt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:15.5px;line-height:1.5;color:var(--ink);font-weight:600}
.fopt:active{transform:scale(.995)}
.fopt .k{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:7px;background:#efece4;font-size:12px;margin-right:9px;color:var(--ink3);font-weight:700}
.fopt.ok{border-color:#2f8f5b;background:#eef8f1}
.fopt.ok .k{background:#cfe9d9;color:#1f6b43}
.fopt.bad{border-color:#c0392b;background:#fdeeec}
.fopt.bad .k{background:#f6d5d1;color:#90251a}
.fopt.dim{opacity:.5}
.fmeta{font-size:12px;color:var(--ink3);margin-bottom:14px;display:flex;justify-content:space-between}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rate{min-height:48px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff}
.rate.y{background:var(--bad-soft);color:var(--bad);border-color:#f0d5d0}
.rate.v{background:var(--warn-soft);color:var(--warn);border-color:#eeddb5}
.rate.g{background:var(--good-soft);color:var(--good);border-color:#cfe4d8}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(31,36,51,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:100;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:30px 10px;color:var(--ink3);font-size:14px}
.hr{height:1px;background:var(--line);margin:16px 0}
.muted{color:var(--ink3);font-size:12.5px}
select,input,textarea{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:90px}
.settings label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px;font-weight:600}
.backdrop{position:fixed;inset:0;background:rgba(20,22,30,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.backdrop.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.wh{padding-bottom:12px;border-bottom:1px solid var(--line)}
.ww{font-size:30px;font-weight:800;letter-spacing:.01em;word-break:break-word}
.wp{color:var(--ink3);font-family:ui-monospace,monospace;font-size:13px;margin-top:3px}
.wsec{margin-top:14px}
.wl{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--ink3);margin-bottom:7px}
.wnote{background:#fbf3e8;border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.7}
.wctx{margin-bottom:10px}
.wctx-src{font-size:11px;color:var(--ink3);margin-bottom:2px}
.wctx .en{font-size:14.5px;line-height:1.6}
.wctx .zh{font-size:13px;color:var(--ink2);margin-top:2px}
.wstat{font-size:13.5px;color:var(--ink2);line-height:1.7}
.sense .sh{margin-bottom:2px}
.sense .col{color:var(--ink2);font-size:13px;margin-top:2px}
.sense .exzh{color:var(--ink3);font-size:12.5px;margin-top:1px}
.sense .ex{color:var(--ink);font-size:14px;margin-top:3px}
.sheet .phon{color:var(--ink3);font-family:ui-monospace,monospace;font-size:13px}
progress{width:100%;height:6px;border-radius:99px;appearance:none}
progress::-webkit-progress-bar{background:#efece4;border-radius:99px}
progress::-webkit-progress-value{background:var(--accent);border-radius:99px}
@media(max-width:420px){.article{font-size:17px}.stats{gap:8px}.stat b{font-size:18px}}
/* 题目抽屉：给不能强制横屏的浏览器（iOS 上的各种浏览器都是 WebKit）用 */
html.drawer body{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
html.drawer .reader-grid{display:block}
html.drawer .col-quiz{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:66vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(20,22,30,.14);padding:0 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(calc(100% - 46px));transition:transform .22s ease}
html.drawer .col-quiz.open{transform:translateY(0)}
html.drawer .col-quiz:not(.open){overflow:hidden}
html.drawer .quiz-handle{position:sticky;top:0;z-index:2;margin:0 -14px;width:calc(100% + 28px);height:46px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);font:inherit;font-size:14px;font-weight:700;color:var(--accent)}
html.drawer .col-quiz.open .sec-title:first-of-type{padding-top:12px}
.reader-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.tool{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 15px;border-radius:11px;background:#efece4;color:var(--ink2);font-size:13px;font-weight:700}
.tool:active{background:#e4dfd2}
@media(max-height:520px){.article{font-size:16px;line-height:1.75}.reader-title{font-size:19px}}
@media(min-width:780px){
  main{max-width:1200px}
  .reader-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);gap:26px;align-items:start}
  .reader-grid .col-quiz{position:sticky;top:64px;max-height:calc(100vh - 82px);max-height:calc(100dvh - 82px);overflow:auto;overscroll-behavior:contain;padding-bottom:40px}
  .reader-grid .col-quiz::-webkit-scrollbar{width:0}
  .reader-grid .col-read{min-width:0}
.wd{cursor:default}
.wguess .wex{font-size:16.5px;line-height:1.85;background:#fbf7f0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 10px}
.wguess .wex .tw{font-size:17px}
.article span.wd,.article span.tw{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tip{position:fixed;z-index:90;max-width:min(78vw,320px);background:#2c2f3a;color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;box-shadow:0 8px 26px rgba(0,0,0,.28);opacity:0;transform:translateY(6px);transition:opacity .14s,transform .14s;pointer-events:none}
#tip.show{opacity:1;transform:translateY(0)}
#tip b{display:block;font-size:15px;margin-bottom:2px;color:#fff}
#tip span{color:#e6e1d8}
.ptr{display:none}
.q-zh{display:none}
.col-zh{display:none}
body.zh .ptr{display:block;font-size:15px;line-height:1.85;color:var(--ink2);background:#fbf7f0;border-left:3px solid #e3cbb6;padding:10px 12px;margin:-4px 0 16px;border-radius:0 10px 10px 0}
body.zh .q-zh{display:block;margin:6px 0 10px;padding:8px 10px;background:#fbf7f0;border-radius:10px;font-size:13.5px;line-height:1.7;color:var(--ink2)}
.q-zh .qzt{margin-bottom:2px}
.q-zh .qzo b{display:inline-block;min-width:18px;color:var(--accent)}
.zp{font-size:15.5px;line-height:1.9;color:var(--ink2);margin-bottom:12px}
.zp .para-num{display:inline-block;min-width:20px;font-size:11px;color:var(--ink3);vertical-align:2px;font-family:ui-monospace,monospace}
.zq{margin-bottom:12px}
.zq .zqt{font-weight:700;font-size:14.5px;margin-bottom:4px;color:var(--ink)}
.zq .qzo{font-size:14px;color:var(--ink2);line-height:1.7}
.zq .qzo b{display:inline-block;min-width:18px;color:var(--accent)}
.today{margin-top:10px;font-size:13px;color:var(--ink2);background:#f6f2e9;border-radius:10px;padding:8px 10px}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px;text-align:center}
.rstats b{display:block;font-size:20px;color:var(--accent)}
.rstats small{font-size:11.5px;color:var(--ink3)}
.rline{font-size:13.5px;color:var(--ink2);margin-top:8px;line-height:1.7}
.btn[disabled]{opacity:.45}
.zhtabs{position:sticky;top:0;z-index:3;display:flex;gap:8px;background:var(--card);padding:2px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.zhtab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;color:var(--ink2);font-family:inherit}
.zhtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.zqwrap{display:none}
body.zhq .zqwrap{display:block}
body.zhq .zpwrap{display:none}
@media(min-width:780px){
  body.zh .reader-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  body.zh .col-zh{display:block;position:sticky;top:64px;max-height:calc(100vh - 82px);max-height:calc(100dvh - 82px);overflow:auto}
  body.zh .col-quiz{display:none}
  body.zh .ptr{display:none}
}
@media(min-width:960px){
  body.zh .reader-grid{grid-template-columns:minmax(0,1.05fr) minmax(270px,.72fr) minmax(0,.95fr)}
  body.zh .col-quiz{display:block}
}
@media(max-width:779px){
  .zhtabs{display:none}
  body.zhq .zqwrap{display:block}
  body.zhq .zpwrap{display:block}
}
html.drawer body.zh .col-zh{display:none}
@media print{
  body{background:#fff}
  .topbar,.reader-tools,.hintbar,.gloss,#btn-home,.btn,.tool{display:none!important}
  main{max-width:none;padding:0}
  .reader-grid{display:block}
  .col-quiz{position:static;max-height:none;overflow:visible}
  .card,.q-block{break-inside:avoid;box-shadow:none}
  .article{font-size:11.5pt;line-height:1.75}
  .opt{border-color:#ddd}
  html.drawer .col-quiz{position:static;transform:none;max-height:none;overflow:visible;box-shadow:none;border:0;padding:0}
  .quiz-handle{display:none!important}
}
</style>
</head>
<body>
<div id="rotwrap">
<header class="topbar">
  <div class="tb-left">
    <button class="icon-btn" id="btn-back" title="返回">←</button>
    <div class="brand"><span></span>词境</div>
  </div>
  <div class="tb-actions">
    <button class="icon-btn" id="btn-rot" title="转屏">⟳</button>
    <button class="icon-btn" id="btn-font" title="切换字体">Aa</button>
    <button class="icon-btn" id="btn-settings" title="设置">⚙</button>
  </div>
</header>
<main id="app"></main>
<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">{"DATA":{"words":[{"word":"admire","phon":"/ədˈmaɪə/","senses":[{"pos":"v.","zh":"钦佩；羡慕","ex":"I admire people who never give up.","exhint":"admire sb for sth 因某事钦佩某人","exzh":"我佩服那些从不放弃的人。"}],"note":"固定搭配 admire sb for sth（因某事佩服某人）；名词 admiration。作文里夸人很好用。"},{"word":"apology","phon":"/əˈpɒlədʒi/","senses":[{"pos":"n.","zh":"道歉","ex":"He made a short apology and left.","exhint":"make/accept an apology 道歉/接受道歉","exzh":"他简短地道了个歉就走了。"}],"note":"动词是 apologize（apologize to sb for sth）。make / accept an apology = 道歉 / 接受道歉。拼写别掉 letters：apology 中间是 o。"},{"word":"approach","phon":"/əˈprəʊtʃ/","senses":[{"pos":"v.","zh":"走近；着手处理","ex":"As winter approached, the days grew shorter.","exhint":"approach 作名词也常考：“方法、途径”","exzh":"冬天临近，白天变短了。"},{"pos":"n.","zh":"方法；途径","ex":"a different approach to the problem","exzh":"解决这个问题的另一种方法。"}],"note":"名词用法极常考：an approach to (doing) sth，to 是介词，后面接 doing 不接 do；“做某事的方法”别写成 approach to do。"},{"word":"argue","phon":"/ˈɑːɡjuː/","senses":[{"pos":"v.","zh":"争论；主张","ex":"They argued about the plan for an hour.","exhint":"argue that... 主张……；argue with sb 与某人争论","exzh":"他们就这个计划争论了一个小时。"}],"note":"argue with sb about / over sth（与某人争论某事）；argue that...（主张、认为）。名词 argument，形容词 arguable。"},{"word":"attach","phon":"/əˈtætʃ/","senses":[{"pos":"v.","zh":"系上；附上；把……固定","ex":"Please attach a photo to your form.","exhint":"attach A to B；be attached to 依恋","exzh":"请在表格上附一张照片。"}],"note":"attach A to B（把 A 附在 B 上）；be attached to（依恋；附属于）。阅读里 “Attached to the note was a small card” 是倒装，正常语序是 A small card was attached to the note。"},{"word":"benefit","phon":"/ˈbenɪfɪt/","senses":[{"pos":"n.","zh":"好处；益处","ex":"Reading brings real benefits.","exhint":"benefit from 从……中受益；for the benefit of 为了……的利益","exzh":"阅读能带来实实在在的好处。"}],"note":"动词用法 benefit from sth（从……中受益）、benefit sb（对某人有好处）；形容词 beneficial；for the benefit of sb（为了某人）。"},{"word":"charming","phon":"/ˈtʃɑːmɪŋ/","senses":[{"pos":"adj.","zh":"迷人的；有魅力的","ex":"a charming little town","exhint":"charm n. 魅力 v. 吸引","exzh":"一个迷人的小镇。"}],"note":"charm 是名词“魅力”、动词“吸引”；charming 在阅读里常用来正面描写人物或地方。"},{"word":"concern","phon":"/kənˈsɜːn/","senses":[{"pos":"n.","zh":"担心；关心的事","ex":"His biggest concern is time.","exhint":"be concerned about 担心；as far as I'm concerned 就我而言","exzh":"他最大的顾虑是时间。"},{"pos":"v.","zh":"使担心；涉及","ex":"The news concerned us all.","exzh":"这个消息让我们都担心。"}],"note":"as far as I'm concerned（就我而言）；be concerned about（担心）/ be concerned with（与……有关）；concerning 作介词 = 关于。"},{"word":"confident","phon":"/ˈkɒnfɪdənt/","senses":[{"pos":"adj.","zh":"自信的；有把握的","ex":"She felt confident before the exam.","exhint":"be confident of/about sth 对……有信心","exzh":"考试前她很有信心。"}],"note":"be confident of / about sth；名词 confidence，副词 confidently。别和 confidential（机密的）混。"},{"word":"contain","phon":"/kənˈteɪn/","senses":[{"pos":"v.","zh":"包含；容纳","ex":"This box contains old letters.","exhint":"注意：contain 不是“控制”，那是 control","exzh":"这个盒子里装着一些旧信。"}],"note":"contain 强调“里面装着”（容器、成分），include 强调“作为一部分列入”。重音在后 conTAIN。派生 container（容器）。"},{"word":"convince","phon":"/kənˈvɪns/","senses":[{"pos":"v.","zh":"使确信；说服","ex":"He convinced me to try again.","exhint":"convince sb of sth / convince sb to do sth","exzh":"他说服我再试一次。"}],"note":"convince sb of sth / convince sb that...；convince sb to do sth（更偏美式）。形容词 convincing（有说服力的）、convinced（确信的）。"},{"word":"deserve","phon":"/dɪˈzɜːv/","senses":[{"pos":"v.","zh":"值得；应得","ex":"You deserve a rest.","exhint":"deserve to do sth 值得做某事","exzh":"你该休息一下。"}],"note":"deserve to do sth；deserve doing = deserve to be done（值得被……）。口语 You deserve it = 这是你应得的。"},{"word":"choice","phon":"/tʃɔɪs/","senses":[{"pos":"n.","zh":"选择；抉择","col":"make a choice / have no choice but to do","ex":"She had no choice but to stay.","exzh":"她别无选择，只能留下。"},{"pos":"n.","zh":"选项；可选的东西","col":"a wide choice of","ex":"The menu offers a wide choice of fish.","exzh":"菜单上有多种鱼可以选。"}],"note":"高考里常与 have no choice but to do（不得不）搭配；choice 与 chance 拼写只差两个字母，别混。"},{"word":"balance","phon":"/ˈbæləns/","senses":[{"pos":"v.","zh":"使平衡；权衡","col":"balance A and B","ex":"It is hard to balance study and rest.","exzh":"很难在学习和休息之间取得平衡。"},{"pos":"n.","zh":"平衡","col":"keep a balance between","ex":"Keep a balance between work and life.","exzh":"在工作和生活之间保持平衡。"}],"note":"抽象搭配极常考：strike a balance between A and B（在两者间取得平衡）。"},{"word":"guilty","phon":"/ˈɡɪlti/","senses":[{"pos":"adj.","zh":"内疚的；有罪的","col":"feel guilty about (doing) sth.","ex":"I felt guilty about forgetting her birthday.","exzh":"我因为忘了她的生日而感到内疚。"}],"note":"guilty 与 blame、regret 是一组“心理负担”词，阅读里常用来表现人物矛盾。"},{"word":"willing","phon":"/ˈwɪlɪŋ/","senses":[{"pos":"adj.","zh":"乐意的；愿意的","col":"be willing to do","ex":"Are you willing to help?","exzh":"你愿意帮忙吗？"}],"note":"反义是 unwilling（不乐意）；注意 willing 不是“将要”，别和 will 混。"},{"word":"unwilling","phon":"/ʌnˈwɪlɪŋ/","senses":[{"pos":"adj.","zh":"不乐意的；不愿意的","col":"be unwilling to do","ex":"He was unwilling to admit his mistake.","exzh":"他不愿意承认自己的错误。"}],"note":"un- + willing；阅读题问态度时，unwilling 常是“消极、抵触”的信号词。"},{"word":"confidence","phon":"/ˈkɒnfɪdəns/","senses":[{"pos":"n.","zh":"自信；信心","col":"build / lose confidence","ex":"Practice builds confidence.","exzh":"练习能建立信心。"}],"note":"形近词 confident（adj. 自信的）。作文里常用 confidence 写心理变化。"},{"word":"accept","phon":"/əkˈsept/","senses":[{"pos":"v.","zh":"接受；认可","col":"accept the fact that / accept an offer","ex":"She slowly accepted the fact.","exzh":"她慢慢接受了这个事实。"}],"note":"与 receive 不同：receive 是“收到”（客观），accept 是“接受”（主观，要点头）。"},{"word":"adapt","phon":"/əˈdæpt/","senses":[{"pos":"v.","zh":"适应；调整","col":"adapt (oneself) to","ex":"He quickly adapted to the new class.","exzh":"他很快适应了新班级。"},{"pos":"v.","zh":"改编","col":"be adapted from","ex":"The film is adapted from a true story.","exzh":"这部电影改编自一个真实故事。"}],"note":"adapt to（适应）vs adopt（采纳、收养），只差一个字母，高考常拿来设陷阱。"},{"word":"panic","phon":"/ˈpænɪk/","senses":[{"pos":"n.","zh":"恐慌","col":"in panic","ex":"The crowd ran in panic.","exzh":"人群惊慌地跑开。"},{"pos":"v.","zh":"惊慌失措","col":"panic about sth.","ex":"Don't panic about the exam.","exzh":"别为考试惊慌。"}],"note":"过去式 panicked（加 k 再 ed），作文里写“慌了”很常用。"},{"word":"grateful","phon":"/ˈɡreɪtfl/","senses":[{"pos":"adj.","zh":"感激的","col":"be grateful to sb. for sth.","ex":"I am grateful to you for your help.","exzh":"我很感激你的帮助。"}],"note":"grateful 是“对人感激”，thankful 更偏“对处境庆幸”；注意介词 for。"},{"word":"afford","phon":"/əˈfɔːd/","senses":[{"pos":"v.","zh":"负担得起（钱/时间）","col":"can / could afford to do","ex":"We can't afford to waste time.","exzh":"我们浪费不起时间。"}],"note":"常与 can't / can hardly 连用；afford 后接 to do，不接 doing。"},{"word":"relief","phon":"/rɪˈliːf/","senses":[{"pos":"n.","zh":"宽慰；减轻","col":"to one's relief / bring relief","ex":"To my relief, the door opened.","exzh":"让我松一口气的是，门开了。"}],"note":"to one's relief（令某人宽慰的是）是读后续写的万能情绪句；动词是 relieve。"},{"word":"quality","phon":"/ˈkwɒləti/","senses":[{"pos":"n.","zh":"质量；品质","col":"the quality of life / water quality","ex":"The quality of the water has improved.","exzh":"水质已经好转了。"},{"pos":"n.","zh":"（人的）品性，素质","col":"personal qualities","ex":"Honesty is his best quality.","exzh":"诚实是他最好的品质。"}],"note":"water / air / life 后面都爱接 quality，环保类阅读高频；复数是 qualities。"},{"word":"protect","phon":"/prəˈtekt/","senses":[{"pos":"v.","zh":"保护","col":"protect sb./sth. from","ex":"Trees protect the soil from wind.","exzh":"树木保护土壤不被风刮走。"}],"note":"protect from 强调“挡住伤害”，名词 protection，形容词 protective。"},{"word":"reduce","phon":"/rɪˈdjuːs/","senses":[{"pos":"v.","zh":"减少；降低","col":"reduce ... by / to","ex":"They reduced the price by 20%.","exzh":"他们把价格降了 20%。"}],"note":"reduce by 是“减少了多少”，reduce to 是“减少到多少”，阅读细节题常设这个坑。"},{"word":"recycle","phon":"/ˌriːˈsaɪkl/","senses":[{"pos":"v.","zh":"回收利用","col":"recycle paper and plastic","ex":"We recycle bottles at home.","exzh":"我们在家里回收利用玻璃瓶。"}],"note":"re-（再）+ cycle（循环）；同族词 recycling（n.）。"},{"word":"ordinary","phon":"/ˈɔːdnri/","senses":[{"pos":"adj.","zh":"普通的；平常的","col":"an ordinary day / out of the ordinary","ex":"It was an ordinary morning.","exzh":"那是一个平平常常的早晨。"}],"note":"与 common（常见）、normal（正常）近义；反义 unusual, extraordinary。"},{"word":"realize","phon":"/ˈriːəlaɪz/","senses":[{"pos":"v.","zh":"意识到；认识到","col":"realize that / come to realize","ex":"I didn't realize how late it was.","exzh":"我没意识到已经这么晚了。"},{"pos":"v.","zh":"实现（目标、梦想）","col":"realize a dream","ex":"She realized her dream at last.","exzh":"她最终实现了自己的梦想。"}],"note":"两个义项都常考：意识到（跟从句）+ 实现（跟名词）。"},{"word":"doubt","phon":"/daʊt/","senses":[{"pos":"v.","zh":"怀疑；不相信","col":"doubt whether / there is no doubt that","ex":"I doubt whether he will come.","exzh":"我怀疑他会不会来。"},{"pos":"n.","zh":"怀疑","col":"without doubt / no doubt","ex":"Without doubt, she is the best.","exzh":"毫无疑问，她是最棒的。"}],"note":"doubt 后面接 whether/if，不接 that（疑问）；no doubt 意为“毫无疑问”。b 不发音。"},{"word":"survive","phon":"/səˈvaɪv/","senses":[{"pos":"v.","zh":"幸存；挺过","col":"survive the winter / survive on","ex":"Few plants survive the cold.","exzh":"很少有植物能熬过这样的严寒。"}],"note":"survive 后直接跟宾语，不加 from；名词 survival，幸存者 survivor。"},{"word":"prevent","phon":"/prɪˈvent/","senses":[{"pos":"v.","zh":"阻止；预防","col":"prevent sb. from doing / prevent sth.","ex":"Rain prevented us from going out.","exzh":"下雨使我们没法出门。"}],"note":"prevent ... from doing 里的 from 在被动中不能省：be prevented from doing。"},{"word":"community","phon":"/kəˈmjuːnəti/","senses":[{"pos":"n.","zh":"社区；群体","col":"the local community / a sense of community","ex":"The whole community helped.","exzh":"整个社区的人都来帮忙了。"}],"note":"指“人”不指“地方”；社区里的人、群体、共同体都用它。"},{"word":"chemical","phon":"/ˈkemɪkl/","senses":[{"pos":"n.","zh":"化学品","col":"harmful chemicals","ex":"The factory poured chemicals into the river.","exzh":"这家工厂把化学品排进了河里。"},{"pos":"adj.","zh":"化学的","col":"chemical waste","ex":"Chemical waste is a serious problem.","exzh":"化学废料是个严重问题。"}],"note":"环保类文章里 chemical(s) 几乎等于“污染源”，看到要有警觉。"},{"word":"effort","phon":"/ˈefət/","senses":[{"pos":"n.","zh":"努力；力气","col":"make an effort to do / spare no effort","ex":"She made an effort to smile.","exzh":"她努力挤出一个微笑。"}],"note":"make an effort（可数，要加 an）；spare no effort（不遗余力）是写作亮点。"},{"word":"technology","phon":"/tekˈnɒlədʒi/","senses":[{"pos":"n.","zh":"技术；科技","col":"modern technology / information technology","ex":"Technology has changed the way we learn.","exzh":"科技改变了我们学习的方式。"}],"note":"不可数，一般不加 a；复数 technologies 指“多种技术”。"},{"word":"device","phon":"/dɪˈvaɪs/","senses":[{"pos":"n.","zh":"装置；设备","col":"a mobile device / electronic devices","ex":"Please turn off all devices.","exzh":"请把所有电子设备都关掉。"}],"note":"与 advice（建议）拼写接近，注意 -ice 是名词后缀；device 是“装置”。"},{"word":"distract","phon":"/dɪˈstrækt/","senses":[{"pos":"v.","zh":"分散（注意力）；使分心","col":"distract sb. from sth.","ex":"The noise distracted me from my work.","exzh":"噪音让我没法专心工作。"}],"note":"名词 distraction；被动 be distracted by（被……吸引走神）。"},{"word":"concentrate","phon":"/ˈkɒnsntreɪt/","senses":[{"pos":"v.","zh":"集中（注意力）","col":"concentrate on","ex":"I can't concentrate on my homework.","exzh":"我没法专心写作业。"}],"note":"名词 concentration；concentrate on = focus on，同义替换常考。"},{"word":"screen","phon":"/skriːn/","senses":[{"pos":"n.","zh":"屏幕","col":"on the screen / screen time","ex":"Too much screen time hurts your eyes.","exzh":"看屏幕时间太长伤眼睛。"},{"pos":"v.","zh":"筛查；放映","col":"screen passengers","ex":"All bags are screened at the gate.","exzh":"所有包在入口处都要过检。"}],"note":"screen time（屏幕使用时间）是近年阅读热词。"},{"word":"independent","phon":"/ˌɪndɪˈpendənt/","senses":[{"pos":"adj.","zh":"独立的；自主的","col":"be independent of / independent thinking","ex":"She is independent of her parents now.","exzh":"她现在不依赖父母了。"}],"note":"be independent of（不依赖），别写成 from；名词 independence。"},{"word":"constantly","phon":"/ˈkɒnstəntli/","senses":[{"pos":"adv.","zh":"不断地；经常地","col":"constantly checking / constantly changing","ex":"He is constantly checking his phone.","exzh":"他不停地看手机。"}],"note":"形容词 constant；写作里替换 always 更高级。"},{"word":"require","phon":"/rɪˈkwaɪə/","senses":[{"pos":"v.","zh":"需要；要求","col":"require sb. to do / be required to do","ex":"The job requires patience.","exzh":"这份工作需要耐心。"}],"note":"require doing = require to be done（需要被做），主动表被动是语法填空常见考点。"},{"word":"responsible","phon":"/rɪˈspɒnsəbl/","senses":[{"pos":"adj.","zh":"负责的；有责任的","col":"be responsible for","ex":"Who is responsible for this?","exzh":"这件事谁负责？"}],"note":"be responsible for 后接名词或 doing；名词 responsibility。"},{"word":"active","phon":"/ˈæktɪv/","senses":[{"pos":"adj.","zh":"积极的；活跃的","col":"take an active part in","ex":"She takes an active part in class.","exzh":"她在课堂上积极参与。"}],"note":"take an active part in（积极参加）是写作高频短语，比 join 更地道。"},{"word":"allow","phon":"/əˈlaʊ/","senses":[{"pos":"v.","zh":"允许；让","col":"allow sb. to do / allow doing","ex":"My parents allow me to stay up late on Friday.","exzh":"我父母允许我周五晚上熬夜。"}],"note":"allow doing（允许做）与 allow sb. to do（允许某人做）都要会。"},{"word":"recover","phon":"/rɪˈkʌvə/","senses":[{"pos":"v.","zh":"恢复；康复","col":"recover from","ex":"It took him a month to recover from the flu.","exzh":"他花了一个月才从流感中恢复过来。"}],"note":"recover from illness 是“病后康复”；名词 recovery。"},{"word":"ignore","phon":"/ɪɡˈnɔː/","senses":[{"pos":"v.","zh":"忽视；不理会","col":"ignore the warning signs","ex":"He ignored the pain and kept running.","exzh":"他没有理会疼痛，继续跑。"}],"note":"ignore 是“故意不理”，don't know 是“不知道”，阅读题区分这两种态度。"},{"word":"habit","phon":"/ˈhæbɪt/","senses":[{"pos":"n.","zh":"习惯","col":"form/develop a habit of doing / break the habit","ex":"Reading before bed is a good habit.","exzh":"睡前读书是个好习惯。"}],"note":"form a habit of doing 中 of 后要接 doing；break the habit 是“改掉习惯”。"},{"word":"regular","phon":"/ˈreɡjələ/","senses":[{"pos":"adj.","zh":"规律的；定期的","col":"regular exercise / on a regular basis","ex":"Regular exercise keeps you healthy.","exzh":"规律的锻炼让你保持健康。"}],"note":"副词 regularly；on a regular basis（定期地）是阅读里的高频短语。"},{"word":"stress","phon":"/stres/","senses":[{"pos":"n.","zh":"压力；紧张","col":"under stress / relieve stress","ex":"Exams put students under great stress.","exzh":"考试让学生压力很大。"},{"pos":"v.","zh":"强调","col":"stress the importance of","ex":"She stressed the importance of sleep.","exzh":"她强调了睡眠的重要性。"}],"note":"stress 既考“压力”也考“强调”，看到 stress that... 就是“强调说”。"},{"word":"pressure","phon":"/ˈpreʃə/","senses":[{"pos":"n.","zh":"压力","col":"under pressure / put pressure on","ex":"He works well under pressure.","exzh":"他在压力下工作得很好。"}],"note":"stress 偏“紧张感”，pressure 偏“外来的压迫”，两者常一起搭配出现。"},{"word":"improve","phon":"/ɪmˈpruːv/","senses":[{"pos":"v.","zh":"改善；提高","col":"improve your English / improve on","ex":"Reading every day will improve your writing.","exzh":"每天阅读会提高你的写作水平。"}],"note":"名词 improvement；improve on 是“在……基础上做得更好”。"},{"word":"avoid","phon":"/əˈvɔɪd/","senses":[{"pos":"v.","zh":"避免；避开","col":"avoid doing sth.","ex":"Try to avoid eating late at night.","exzh":"尽量不要在深夜吃东西。"}],"note":"avoid 后接 doing，不能接 to do，这是语法填空必考点。"},{"word":"consistent","phon":"/kənˈsɪstənt/","senses":[{"pos":"adj.","zh":"一贯的；持续的","col":"be consistent with / consistent effort","ex":"Her work is always consistent.","exzh":"她的工作状态一直很稳定。"}],"note":"consistent effort（持续的努力）比 hard work 更强调“不间断”。"},{"word":"last","phon":"/lɑːst/","senses":[{"pos":"v.","zh":"持续；维持","col":"last for + 时间","ex":"The meeting lasted two hours.","exzh":"会开了两个小时。"},{"pos":"adj.","zh":"最后的；上一个的","col":"last week","ex":"I saw her last week.","exzh":"我上周见过她。"}],"note":"作动词是“持续”，作形容词是“最后的”，阅读题常拿“last”设词义题。"},{"word":"invite","phon":"/ɪnˈvaɪt/","senses":[{"pos":"v.","zh":"邀请；招致","col":"invite sb. to do / be invited to","ex":"He invited me to join the run.","exzh":"他邀请我参加这次跑步。"}],"note":"invite sb. to do（邀请某人做），不是 invite sb. doing；名词 invitation（注意 t 变）。"},{"word":"volunteer","phon":"/ˌvɒlənˈtɪə/","senses":[{"pos":"n.","zh":"志愿者","col":"a volunteer for","ex":"She is a volunteer at the hospital.","exzh":"她是医院的志愿者。"},{"pos":"v.","zh":"自愿做","col":"volunteer to do","ex":"He volunteered to clean the room.","exzh":"他自愿去打扫房间。"}],"note":"动词用法 volunteer to do 是语法填空常考点；形容词 voluntary（自愿的）。"},{"word":"offer","phon":"/ˈɒfə/","senses":[{"pos":"v.","zh":"提供；主动提出","col":"offer sb. sth. / offer to do","ex":"She offered me a seat.","exzh":"她给我让了个座。"},{"pos":"n.","zh":"提议；报价","col":"make an offer","ex":"They made me an offer I could not refuse.","exzh":"他们开出的条件我无法拒绝。"}],"note":"offer to do（主动提出做）≠ provide sb. with（提供），后者更中性。"},{"word":"treasure","phon":"/ˈtreʒə/","senses":[{"pos":"v.","zh":"珍视；珍惜","col":"treasure the memory","ex":"I treasure the time we spent together.","exzh":"我珍惜我们一起度过的时间。"},{"pos":"n.","zh":"珍宝","col":"a national treasure","ex":"The old bridge is a local treasure.","exzh":"这座老桥是当地的珍宝。"}],"note":"作动词“珍惜”比 value 更有感情色彩，读后续写很好用。"},{"word":"expect","phon":"/ɪkˈspekt/","senses":[{"pos":"v.","zh":"预料；期待","col":"expect to do / expect sb. to do / as expected","ex":"We expect to finish by Friday.","exzh":"我们预计周五前完成。"}],"note":"expect sb. to do（指望某人做）；be expected to（应该）也很常考。"},{"word":"share","phon":"/ʃeə/","senses":[{"pos":"v.","zh":"分享；分担","col":"share sth. with sb.","ex":"She shared her lunch with me.","exzh":"她把午饭分给我吃。"},{"pos":"n.","zh":"份额；股份","col":"a share of","ex":"Everyone did a share of the work.","exzh":"每个人都分担了一份工作。"}],"note":"share with（与……分享）和 share in（共享）介词不同。"},{"word":"promise","phon":"/ˈprɒmɪs/","senses":[{"pos":"v.","zh":"承诺；答应","col":"promise to do / promise that","ex":"He promised to come back.","exzh":"他答应会回来。"},{"pos":"n.","zh":"诺言；希望","col":"keep/break a promise","ex":"She kept her promise.","exzh":"她信守了自己的诺言。"}],"note":"keep a promise（守诺）vs break a promise（食言），写作对比句常用。"},{"word":"situation","phon":"/ˌsɪtʃuˈeɪʃn/","senses":[{"pos":"n.","zh":"情况；处境","col":"in this situation / deal with the situation","ex":"In this situation, silence was the best answer.","exzh":"在这种情况下，沉默是最好的回答。"}],"note":"可数名词，前面要加 a/the；比 condition 更强调“处境的整体”。"},{"word":"convenient","phon":"/kənˈviːniənt/","senses":[{"pos":"adj.","zh":"方便的","col":"it is convenient for sb. to do","ex":"Is it convenient for you to meet at six?","exzh":"六点见面对你方便吗？"}],"note":"主语不能是人：不说 I am convenient，要说 It is convenient for me to..."},{"word":"although","phon":"/ɔːlˈðəʊ/","senses":[{"pos":"conj.","zh":"虽然；尽管","col":"although + 从句","ex":"Although it was raining, we went out.","exzh":"虽然下着雨，我们还是出门了。"}],"note":"although 不能和 but 连用，这是高考改错/语填的经典考点。"},{"word":"manage","phon":"/ˈmænɪdʒ/","senses":[{"pos":"v.","zh":"设法做到；管理","col":"manage to do / manage a company","ex":"She managed to finish on time.","exzh":"她设法按时完成了。"}],"note":"manage to do（设法做成，含“不容易”），与 try to do（尝试，未必成功）不同。"},{"word":"absorb","phon":"/əbˈzɔːb/","senses":[{"pos":"v.","zh":"吸收；吸引（注意力）；使全神贯注","col":"absorb heat 吸热 · be absorbed in 专心于","ex":"Plants absorb water through their roots.","exzh":"植物通过根吸收水分。"}],"note":"拼写易错：ab + sorb，双写 b 不对。高考常考 be absorbed in（沉浸在）。名词 absorption。"},{"word":"intensity","phon":"/ɪnˈtensəti/","senses":[{"pos":"n.","zh":"强度；强烈程度","col":"the intensity of the heat/light 热/光的强度","ex":"The intensity of the storm surprised everyone.","exzh":"暴风雨的强度让所有人都吃了一惊。"}],"note":"形容词 intense（强烈的），副词 intensely；intensity of + 名词，作文写环境、情绪都能用。"},{"word":"dense","phon":"/dens/","senses":[{"pos":"adj.","zh":"密集的；稠密的；（雾）浓的","col":"a dense population 密集的人口 · dense fog 浓雾","ex":"The city is dense with tall buildings and narrow streets.","exzh":"这座城市高楼密集、街道狭窄。"}],"note":"名词 density（密度）。dense 与 dense fog 常一起考；不要和 tense（紧张的）混。"},{"word":"capacity","phon":"/kəˈpæsəti/","senses":[{"pos":"n.","zh":"容量；能力；生产力","col":"the capacity to do sth 做某事的能力 · at full capacity 满负荷","ex":"The hall has a capacity of two thousand people.","exzh":"这个大厅能容纳两千人。"}],"note":"两个意思都考：容量（房间、电池）和能力（the capacity to do sth）。别写成 capasity。"},{"word":"efficient","phon":"/ɪˈfɪʃnt/","senses":[{"pos":"adj.","zh":"效率高的；有能力的","col":"an efficient way to do sth 做某事的高效方式","ex":"Cycling is a more efficient way to cross a small city.","exzh":"在小城市里穿行，骑车是更高效的方式。"}],"note":"反义 inefficient；名词 efficiency（效率）。注意与 effective（有效的，能起作用的）区别：efficient 讲省力省时，effective 讲起作用。"},{"word":"adequate","phon":"/ˈædɪkwət/","senses":[{"pos":"adj.","zh":"足够的；合格的","col":"adequate for sth 对某事足够 · adequate sleep 充足的睡眠","ex":"The room was small but adequate for one person.","exzh":"房间不大，但一个人住够了。"}],"note":"否定 inadequate（不足的）常考。adequate 强调“够用”，不是“多”。副词 adequately。"},{"word":"alternative","phon":"/ɔːlˈtɜːnətɪv/","senses":[{"pos":"n.","zh":"替代方案；选择","col":"an alternative to sth 某事的替代方案 · have no alternative but to do 别无选择只能做","ex":"There is no alternative to hard work.","exzh":"除了努力，别无选择。"},{"pos":"adj.","zh":"可供替代的","col":"alternative energy 替代能源","ex":"We took an alternative route to avoid the traffic.","exzh":"我们走了另一条路避开拥堵。"}],"note":"高频句式 have no alternative but to do sth（只能做某事）。注意重音在第二音节。"},{"word":"generate","phon":"/ˈdʒenəreɪt/","senses":[{"pos":"v.","zh":"产生；生成（电、热、兴趣、收入）","col":"generate electricity/income/interest 发电/创收/引起兴趣","ex":"Solar panels generate electricity from sunlight.","exzh":"太阳能板利用阳光发电。"}],"note":"比 make 高级，作文里 generate income / generate interest 很实用。名词 generation。"},{"word":"mitigate","phon":"/ˈmɪtɪɡeɪt/","senses":[{"pos":"v.","zh":"减轻；缓解（不良影响）","col":"mitigate the effects of sth 减轻某事的后果","ex":"Trees help mitigate the heat in city streets.","exzh":"树木有助于缓解城市街道的高温。"}],"note":"主语通常是措施、政策；宾语是 damage/effect/risk 这类坏事。拼写 mit-i-gate，中间是 i。"},{"word":"region","phon":"/ˈriːdʒən/","senses":[{"pos":"n.","zh":"地区；区域","col":"in this region 在这个地区 · regional 地区的","ex":"Tea grows well in the southern regions of the country.","exzh":"茶在该国南方地区长得很好。"}],"note":"regional（地区的）是形容词。region 比 area 正式，常与 in/different 搭配。"},{"word":"exposure","phon":"/ɪkˈspəʊʒə/","senses":[{"pos":"n.","zh":"暴露；接触到（有害事物）；曝光","col":"exposure to sth 接触/暴露于某物 · the risk of exposure 暴露的风险","ex":"Long exposure to the sun can damage your skin.","exzh":"长时间暴露在阳光下会伤害皮肤。"}],"note":"动词 expose sb to sth（让某人接触某事）；名词后接 to。高考环保、健康类文章高频。"},{"word":"decline","phon":"/dɪˈklaɪn/","senses":[{"pos":"n.","zh":"下降；减少","col":"a decline in sth 某方面的下降 · on the decline 在衰退","ex":"There has been a decline in the number of readers.","exzh":"读者人数有所下降。"},{"pos":"v.","zh":"下降；婉拒","col":"decline an invitation 婉拒邀请","ex":"He declined the offer politely.","exzh":"他礼貌地拒绝了那个提议。"}],"note":"作“婉拒”时比 refuse 客气，是高考礼貌用语题的高频词。反义 rise / increase。"},{"word":"crucial","phon":"/ˈkruːʃl/","senses":[{"pos":"adj.","zh":"至关重要的；关键的","col":"be crucial to/for sth 对某事至关重要 · play a crucial role 起关键作用","ex":"Sleep is crucial to memory.","exzh":"睡眠对记忆至关重要。"}],"note":"同义 important / vital，但语气更强。搭配 be crucial to doing sth。别写成 cruical。"},{"word":"trigger","phon":"/ˈtrɪɡə/","senses":[{"pos":"v.","zh":"引发；触发","col":"trigger a reaction 引发反应","ex":"The news triggered a wave of anger.","exzh":"这条消息引发了一阵愤怒。"},{"pos":"n.","zh":"诱因；扳机","col":"a trigger for sth 某事的诱因","ex":"Stress is a common trigger for headaches.","exzh":"压力是头痛的常见诱因。"}],"note":"作动词比 cause 更强调“一按就发生”。名词义“扳机”也常出现在阅读里。"},{"word":"interrupt","phon":"/ˌɪntəˈrʌpt/","senses":[{"pos":"v.","zh":"打断；中断","col":"interrupt sb 打断某人 · be interrupted by 被…打断","ex":"Sorry to interrupt, but the taxi is here.","exzh":"不好意思打断一下，出租车到了。"}],"note":"双写 r：inter+rupt。名词 interruption。别和 interpret（解释）混。"},{"word":"attention","phon":"/əˈtenʃn/","senses":[{"pos":"n.","zh":"注意力；关注","col":"pay attention to 注意 · attract/draw attention 吸引注意 · attention span 注意力持续时间","ex":"The noise made it hard to keep my attention on the book.","exzh":"噪音让我很难把注意力放在书上。"}],"note":"pay attention to 的 to 是介词，后接名词或 doing。形容词 attentive（专心的）。"},{"word":"algorithm","phon":"/ˈælɡərɪðəm/","senses":[{"pos":"n.","zh":"算法","col":"a search algorithm 搜索算法","ex":"The algorithm decides which videos you see next.","exzh":"算法决定你接下来看到哪些视频。"}],"note":"科技文高频。发音重音在第一音节，th 读 /ð/。"},{"word":"engage","phon":"/ɪnˈɡeɪdʒ/","senses":[{"pos":"v.","zh":"吸引（注意力）；参与；从事","col":"engage sb 吸引某人 · engage in sth 参与某事 · be engaged in 忙于","ex":"The teacher found a way to engage every student.","exzh":"老师找到了让每个学生都投入的办法。"}],"note":"be engaged to sb 是“和某人订婚”，一词多义常考。名词 engagement。"},{"word":"voluntary","phon":"/ˈvɒləntri/","senses":[{"pos":"adj.","zh":"自愿的；志愿的","col":"voluntary work 志愿工作 · on a voluntary basis 自愿地","ex":"Attendance at the lecture is voluntary.","exzh":"这个讲座自愿参加。"}],"note":"名词 volunteer（志愿者），动词 volunteer to do sth。反义 compulsory（强制的）。"},{"word":"persist","phon":"/pəˈsɪst/","senses":[{"pos":"v.","zh":"持续；坚持","col":"persist in doing sth 坚持做某事 · persist for years 持续多年","ex":"The pain persisted for weeks.","exzh":"疼痛持续了好几周。"}],"note":"persist in doing 与 insist on doing 区分：persist 偏“不改”，insist 偏“坚持主张”。名词 persistence。"},{"word":"resist","phon":"/rɪˈzɪst/","senses":[{"pos":"v.","zh":"抵抗；忍住","col":"resist the temptation 抵制诱惑 · can't resist doing 忍不住做","ex":"She could not resist laughing.","exzh":"她忍不住笑了。"}],"note":"can't resist doing sth 是高考常见搭配。名词 resistance（抵抗）。"},{"word":"reward","phon":"/rɪˈwɔːd/","senses":[{"pos":"n.","zh":"奖励；回报","col":"as a reward for 作为对…的奖励","ex":"He received a reward for returning the wallet.","exzh":"他因归还钱包而得到酬谢。"},{"pos":"v.","zh":"奖励；报答","col":"reward sb for sth 因某事奖励某人","ex":"Good behaviour should be rewarded.","exzh":"良好的行为应该受到奖励。"}],"note":"与 award（颁发、奖品，正式）区别：reward 强调“回报”。"},{"word":"sustain","phon":"/səˈsteɪn/","senses":[{"pos":"v.","zh":"维持；支撑；遭受","col":"sustain attention/growth 维持注意力/增长 · sustain an injury 受伤","ex":"The economy cannot sustain such rapid growth.","exzh":"经济无法维持如此快的增长。"}],"note":"形容词 sustainable（可持续的）是环保话题核心词，作文必背。"},{"word":"deliberate","phon":"/dɪˈlɪbərət/","senses":[{"pos":"adj.","zh":"故意的；从容的","col":"a deliberate attempt 有意的尝试","ex":"It was a deliberate attempt to mislead us.","exzh":"那是故意误导我们的。"},{"pos":"v.","zh":"仔细考虑（/dɪˈlɪbəreɪt/，读音不同）","col":"deliberate on sth 仔细考虑某事","ex":"The judges deliberated for two hours.","exzh":"评委们仔细商议了两个小时。"}],"note":"故意义用形容词，读 /-rət/；动词“商议”读 /-reɪt/。副词 deliberately 常考。"},{"word":"prioritize","phon":"/praɪˈɒrətaɪz/","senses":[{"pos":"v.","zh":"优先考虑；按重要性排序","col":"prioritize A over B 把 A 排在 B 之前","ex":"Schools should prioritize safety over speed.","exzh":"学校应把安全放在速度之前。"}],"note":"名词 priority（优先事项），固定搭配 take priority over。拼写 pri-or-i-tize。"},{"word":"prompt","phon":"/prɒmpt/","senses":[{"pos":"v.","zh":"促使；提示","col":"prompt sb to do sth 促使某人做某事","ex":"The report prompted the government to act.","exzh":"这份报告促使政府采取行动。"},{"pos":"adj.","zh":"迅速的；准时的","col":"a prompt reply 及时的回复","ex":"Thank you for your prompt reply.","exzh":"感谢您的及时回复。"}],"note":"prompt sb to do sth 是写作高分句型；作形容词表“及时”，商务信件常用。"},{"word":"undermine","phon":"/ˌʌndəˈmaɪn/","senses":[{"pos":"v.","zh":"逐渐削弱；破坏（信心、权威）","col":"undermine confidence 削弱信心","ex":"Constant criticism undermines a child's confidence.","exzh":"不断的批评会削弱孩子的信心。"}],"note":"under + mine（挖）——从下面挖空。宾语多为 confidence/trust/authority 这类抽象词。"},{"word":"perceive","phon":"/pəˈsiːv/","senses":[{"pos":"v.","zh":"察觉；把…看作","col":"perceive sth as sth 把某物视为 …","ex":"Many people perceive the change as a threat.","exzh":"很多人把这一变化视为威胁。"}],"note":"名词 perception（看法、感知）。be perceived as 是阅读里常见的被动结构。"},{"word":"outcome","phon":"/ˈaʊtkʌm/","senses":[{"pos":"n.","zh":"结果；后果","col":"the outcome of sth 某事的结果","ex":"Nobody could predict the outcome of the election.","exzh":"没人能预测选举的结果。"}],"note":"可数名词。比 result 更强调“经过一段过程后的最终结果”。"},{"word":"praise","phon":"/preɪz/","senses":[{"pos":"n.","zh":"赞扬；表扬","col":"win praise for sth 因某事赢得赞扬","ex":"Her book received high praise from critics.","exzh":"她的书得到评论家的高度赞扬。"},{"pos":"v.","zh":"赞扬","col":"praise sb for sth 因某事表扬某人","ex":"The coach praised the team for its patience.","exzh":"教练表扬了球队的耐心。"}],"note":"praise sb for (doing) sth。别和 price（价格）拼混；praise 中的 ai 读 /eɪ/。"},{"word":"competence","phon":"/ˈkɒmpɪtəns/","senses":[{"pos":"n.","zh":"能力；胜任","col":"professional competence 专业能力","ex":"The job requires a high level of competence.","exzh":"这份工作需要很高的专业能力。"}],"note":"形容词 competent（能胜任的）。与 competition（竞争）同源但意思不同，别混。"},{"word":"reluctant","phon":"/rɪˈlʌktənt/","senses":[{"pos":"adj.","zh":"不情愿的；勉强的","col":"be reluctant to do sth 不愿做某事","ex":"He was reluctant to admit his mistake.","exzh":"他不愿承认自己的错误。"}],"note":"固定句型 be reluctant to do sth。名词 reluctance。反义 willing（existing 词表里有 willing）。"},{"word":"accomplish","phon":"/əˈkʌmplɪʃ/","senses":[{"pos":"v.","zh":"完成；实现（目标、任务）","col":"accomplish a task/goal 完成任务/目标","ex":"She accomplished more in a year than most do in five.","exzh":"她一年做成的事比多数人五年做的还多。"}],"note":"双写 c：a-cco-mplish。名词 accomplishment。比 finish 正式。"},{"word":"autonomy","phon":"/ɔːˈtɒnəmi/","senses":[{"pos":"n.","zh":"自主；自治","col":"greater autonomy 更大的自主权","ex":"Teachers were given more autonomy in the classroom.","exzh":"教师在课堂上获得了更大的自主权。"}],"note":"auto（自己）+ nomy（规则）。形容词 autonomous（自主的，如 autonomous driving 自动驾驶）。"},{"word":"incentive","phon":"/ɪnˈsentɪv/","senses":[{"pos":"n.","zh":"激励；刺激；奖励措施","col":"an incentive to do sth 做某事的动力 · tax incentives 税收优惠","ex":"Bonuses are an incentive to work harder.","exzh":"奖金是更努力工作的激励。"}],"note":"后接 to do sth，不是 to doing。经济、政策类文章高频。"},{"word":"motivate","phon":"/ˈməʊtɪveɪt/","senses":[{"pos":"v.","zh":"激发；成为…的动机","col":"motivate sb to do sth 激励某人做某事","ex":"Good teachers motivate students to ask questions.","exzh":"好老师会激励学生提问。"}],"note":"名词 motivation（动力）；形容词 motivated（有积极性的）。"},{"word":"acknowledge","phon":"/əkˈnɒlɪdʒ/","senses":[{"pos":"v.","zh":"承认；对…表示认可/感谢","col":"acknowledge that… 承认… · acknowledge sb's help 感谢某人帮助","ex":"He acknowledged that he had been wrong.","exzh":"他承认自己错了。"}],"note":"k 不发音。名词 acknowledgement。作文里 acknowledge the importance of 很实用。"},{"word":"assess","phon":"/əˈses/","senses":[{"pos":"v.","zh":"评估；评定","col":"assess the impact of sth 评估某事的影响","ex":"It is too early to assess the damage.","exzh":"现在评估损失还为时过早。"}],"note":"双写 s。名词 assessment（评估）。比 judge 更强调“依据标准衡量”。"},{"word":"tension","phon":"/ˈtenʃn/","senses":[{"pos":"n.","zh":"紧张（关系）；张力；矛盾","col":"tension between A and B A 与 B 之间的紧张关系","ex":"There is tension between the two neighbours.","exzh":"这两个邻国关系紧张。"}],"note":"形容词 tense（紧张的）。写社会话题时 tension between X and Y 很好用。"},{"word":"anxiety","phon":"/æŋˈzaɪəti/","senses":[{"pos":"n.","zh":"焦虑；担心；渴望","col":"with anxiety 焦虑地 · anxiety about sth 对某事的担心","ex":"Exam anxiety can stop students from thinking clearly.","exzh":"考试焦虑会让学生无法清晰思考。"}],"note":"形容词 anxious（be anxious about 担心 / be anxious to do 急于做）。"},{"word":"consolidate","phon":"/kənˈsɒlɪdeɪt/","senses":[{"pos":"v.","zh":"巩固；加强；合并","col":"consolidate one's position 巩固地位","ex":"Reviewing the same material helps consolidate memory.","exzh":"复习同样的材料有助于巩固记忆。"}],"note":"con + solid（坚固）——使变牢固。学习类文章里常与 memory/skills 搭配。"},{"word":"deprive","phon":"/dɪˈpraɪv/","senses":[{"pos":"v.","zh":"剥夺；使丧失","col":"deprive sb of sth 剥夺某人某物","ex":"The new rules deprived many families of clean water.","exzh":"新规定让许多家庭失去了干净的水。"}],"note":"固定搭配 deprive sb of sth（of 不能换成 from）。名词 deprivation。"},{"word":"restore","phon":"/rɪˈstɔː(r)/","senses":[{"pos":"v.","zh":"恢复；修复；归还","col":"restore order 恢复秩序 · restore sth to sth 把某物恢复到…","ex":"Power was restored three hours after the storm.","exzh":"暴风雨过后三小时恢复供电。"}],"note":"re + store（储存）。restore 强调“回到原来的状态”，与 recover（自己康复）不同。"},{"word":"immune","phon":"/ɪˈmjuːn/","senses":[{"pos":"adj.","zh":"免疫的；不受影响的","col":"immune system 免疫系统 · be immune to sth 对某事免疫/不受影响","ex":"No country is immune to the effects of a global slowdown.","exzh":"没有哪个国家能不受全球放缓的影响。"}],"note":"be immune to（to 不能换 for）。名词 immunity。"},{"word":"nap","phon":"/næp/","senses":[{"pos":"n.","zh":"小睡；打盹","col":"take a nap 小睡一会儿","ex":"A short nap after lunch helped her focus.","exzh":"午饭后小睡一会儿让她更能集中。"}],"note":"可数。动词 take/have a nap 比 nap 单用更常见。"},{"word":"rhythm","phon":"/ˈrɪðəm/","senses":[{"pos":"n.","zh":"节律；节奏；规律","col":"the rhythm of daily life 日常生活的节奏","ex":"Working night shifts disturbs the body's rhythm.","exzh":"上夜班会打乱身体的节律。"}],"note":"拼写易错：rh 开头、th 结尾、中间没有 y。形容词 rhythmic。"},{"word":"symptom","phon":"/ˈsɪmptəm/","senses":[{"pos":"n.","zh":"症状；征兆","col":"show symptoms of sth 表现出某病的症状","ex":"Fever is a common symptom of the flu.","exzh":"发烧是流感的常见症状。"}],"note":"p 不发音。可用于比喻：a symptom of a deeper problem（更深层问题的征兆）。"},{"word":"therapy","phon":"/ˈθerəpi/","senses":[{"pos":"n.","zh":"治疗；疗法","col":"physical therapy 理疗 · undergo therapy 接受治疗","ex":"Talking therapy helped him deal with stress.","exzh":"谈话疗法帮他应对压力。"}],"note":"指治疗过程/方法；treatment 更泛。therapist 治疗师。"},{"word":"vital","phon":"/ˈvaɪtl/","senses":[{"pos":"adj.","zh":"至关重要的；生命的","col":"be vital to/for sth 对某事至关重要 · vital signs 生命体征","ex":"Sleep is vital to memory.","exzh":"睡眠对记忆至关重要。"}],"note":"比 important 强。句型 It is vital that sb (should) do。"},{"word":"alert","phon":"/əˈlɜːt/","senses":[{"pos":"adj.","zh":"警觉的；机敏的","col":"stay alert 保持警觉 · be alert to sth 对…保持警惕","ex":"Coffee kept him alert during the night drive.","exzh":"咖啡让他在夜间行车时保持清醒。"},{"pos":"n.","zh":"警报","col":"a fire alert 火警","ex":"The app sends an alert when prices fall.","exzh":"降价时这个应用会发出提醒。"}],"note":"形容词与名词同形。alert sb to sth（提醒某人注意某事）。"},{"word":"chronic","phon":"/ˈkrɒnɪk/","senses":[{"pos":"adj.","zh":"慢性的；长期的；积习难改的","col":"chronic disease 慢性病 · chronic shortage 长期短缺","ex":"Chronic stress damages both body and mind.","exzh":"长期压力会损害身心。"}],"note":"与 acute（急性的）相对。常搭配 shortage/problem/disease 类词。"},{"word":"impair","phon":"/ɪmˈpeə(r)/","senses":[{"pos":"v.","zh":"损害；削弱（能力、功能）","col":"impair one's ability to do sth 削弱某人做某事的能力","ex":"Loud music can impair hearing over time.","exzh":"长期听大声的音乐会损害听力。"}],"note":"名词 impairment。多用于能力、视力、听力、判断力。"},{"word":"abstract","phon":"/ˈæbstrækt/","senses":[{"pos":"adj.","zh":"抽象的","col":"abstract ideas 抽象概念","ex":"Children learn abstract ideas through concrete examples.","exzh":"孩子通过具体例子学习抽象概念。"}],"note":"与 concrete（具体的）相对。注意重音在前；动词 abstract 重音在后。"},{"word":"concept","phon":"/ˈkɒnsept/","senses":[{"pos":"n.","zh":"概念；观念","col":"the concept of sth 某事物的概念","ex":"The concept of fairness differs across cultures.","exzh":"“公平”这个概念在不同文化中不一样。"}],"note":"比 idea 更正式、更学术。形容词 conceptual。"},{"word":"convey","phon":"/kənˈveɪ/","senses":[{"pos":"v.","zh":"传达（意思、感情）；运送","col":"convey a message 传达信息","ex":"Music can convey feelings that words cannot.","exzh":"音乐能传达语言无法传达的情感。"}],"note":"拼写 con-vey，不是 conveigh。名词 conveyance。"},{"word":"distinguish","phon":"/dɪˈstɪŋɡwɪʃ/","senses":[{"pos":"v.","zh":"区分；辨别","col":"distinguish A from B 把 A 与 B 区分开","ex":"It is hard to distinguish the twins.","exzh":"很难分辨这对双胞胎。"}],"note":"名词 distinction。distinguish between A and B 也很常用。"},{"word":"gesture","phon":"/ˈdʒestʃə(r)/","senses":[{"pos":"n.","zh":"手势；姿态；（表示友好的）举动","col":"make a gesture 做个手势","ex":"He made a gesture for us to sit down.","exzh":"他做了个手势让我们坐下。"}],"note":"t 读 /tʃ/。也可指“表示”：a gesture of goodwill（善意的表示）。"},{"word":"interpret","phon":"/ɪnˈtɜːprɪt/","senses":[{"pos":"v.","zh":"理解；解释；口译","col":"interpret sth as sth 把某事理解为…","ex":"She interpreted his silence as agreement.","exzh":"她把他的沉默理解为同意。"}],"note":"名词 interpretation；口译员 interpreter。阅读题里常见“如何理解某句”。"},{"word":"literal","phon":"/ˈlɪtərəl/","senses":[{"pos":"adj.","zh":"字面的；逐字的","col":"the literal meaning 字面意思","ex":"A literal translation can change the meaning.","exzh":"逐字翻译可能改变意思。"}],"note":"副词 literally 常被口语化使用（“简直”），但本义是“字面上”。"},{"word":"metaphor","phon":"/ˈmetəfə(r)/","senses":[{"pos":"n.","zh":"隐喻；比喻","col":"use a metaphor 使用隐喻","ex":"'Time is money' is a common metaphor.","exzh":"“时间就是金钱”是个常见的隐喻。"}],"note":"与 simile（明喻，带 like/as）区分。形容词 metaphorical。"},{"word":"nuance","phon":"/ˈnjuːɑːns/","senses":[{"pos":"n.","zh":"细微差别；微妙之处","col":"the nuances of sth 某事物的细微差别","ex":"A good translator catches every nuance.","exzh":"好的译者能抓住每一处细微差别。"}],"note":"常用复数 nuances。抽象、正式，写作高分词。"},{"word":"subtle","phon":"/ˈsʌtl/","senses":[{"pos":"adj.","zh":"微妙的；不易察觉的","col":"a subtle difference 微妙的差别","ex":"There is a subtle difference between the two words.","exzh":"这两个词之间有微妙的差别。"}],"note":"b 不发音，读 /ˈsʌtl/。副词 subtly。"},{"word":"retain","phon":"/rɪˈteɪn/","senses":[{"pos":"v.","zh":"保留；保持；记住","col":"retain information 记住信息","ex":"The town retains much of its old charm.","exzh":"这座小镇保留了许多旧日的魅力。"}],"note":"re + tain（握）。名词 retention。与 remain（留下，不及物）区分。"},{"word":"translate","phon":"/trænzˈleɪt/","senses":[{"pos":"v.","zh":"翻译；转化","col":"translate sth into sth 把…译成…","ex":"The novel has been translated into thirty languages.","exzh":"这本小说已被译成三十种语言。"}],"note":"名词 translation；译者 translator。translate into 也可表示“转化为”（成果）。"},{"word":"universal","phon":"/ˌjuːnɪˈvɜːsl/","senses":[{"pos":"adj.","zh":"普遍的；全体的；通用的","col":"a universal truth 普遍的真理","ex":"Laughter is a universal language.","exzh":"笑是一种通用的语言。"}],"note":"universe（宇宙）→ universal。副词 universally（普遍地）。"},{"word":"advocate","phon":"/ˈædvəkeɪt/","senses":[{"pos":"v.","zh":"主张；提倡；拥护","col":"advocate doing sth 主张做某事","ex":"She advocates a shorter working week.","exzh":"她主张缩短每周工作时间。"}],"note":"动词读 /-keɪt/，名词“拥护者”读 /-kət/。后接动名词，不接 to do。"},{"word":"contract","phon":"/ˈkɒntrækt/","senses":[{"pos":"n.","zh":"合同；契约","col":"sign a contract 签合同","ex":"He signed a two-year contract with the club.","exzh":"他和俱乐部签了两年合同。"}],"note":"名词重音在前；动词 contract（收缩）重音在后。breach of contract 违约。"},{"word":"flexible","phon":"/ˈfleksəbl/","senses":[{"pos":"adj.","zh":"灵活的；可弯曲的","col":"flexible working hours 弹性工作时间","ex":"The school offers flexible hours for working parents.","exzh":"学校为在职父母提供弹性时间。"}],"note":"名词 flexibility。反义 rigid（僵硬的）。"},{"word":"income","phon":"/ˈɪnkʌm/","senses":[{"pos":"n.","zh":"收入","col":"a monthly income 月收入 · source of income 收入来源","ex":"Rents take up half of their income.","exzh":"房租占了他们收入的一半。"}],"note":"不可数。与 outcome 拼写区分：income 是“进来”的，outcome 是“出来”的结果。"},{"word":"insecure","phon":"/ˌɪnsɪˈkjʊə(r)/","senses":[{"pos":"adj.","zh":"不安全的；不稳定的；缺乏自信的","col":"an insecure job 不稳定的工作","ex":"Many young people feel insecure about the future.","exzh":"许多年轻人对未来感到不安。"}],"note":"反义 secure（安全的、稳定的）。名词 insecurity。"},{"word":"labour","phon":"/ˈleɪbə(r)/","senses":[{"pos":"n.","zh":"劳动；劳动力；劳工","col":"manual labour 体力劳动 · cheap labour 廉价劳动力","ex":"The factory depends on cheap labour.","exzh":"这家工厂依赖廉价劳动力。"}],"note":"美式拼写 labor。Labour Day 劳动节；the Labour Party（英国）工党。"},{"word":"regulation","phon":"/ˌreɡjuˈleɪʃn/","senses":[{"pos":"n.","zh":"规定；规章；监管","col":"strict regulations 严格的规定 · government regulation 政府监管","ex":"New regulations limit the use of plastic bags.","exzh":"新规定限制塑料袋的使用。"}],"note":"动词 regulate（管理、调节）；形容词 regulatory。"},{"word":"rely","phon":"/rɪˈlaɪ/","senses":[{"pos":"v.","zh":"依靠；依赖","col":"rely on sb/sth 依靠某人/某物","ex":"Farmers rely on rain in this region.","exzh":"这个地区的农民靠天吃饭。"}],"note":"固定搭配 rely on/upon。名词 reliance；形容词 reliable（可靠的）。"},{"word":"stability","phon":"/stəˈbɪləti/","senses":[{"pos":"n.","zh":"稳定；稳定性","col":"economic stability 经济稳定","ex":"The country needs political stability to grow.","exzh":"国家要发展就需要政治稳定。"}],"note":"形容词 stable。反义 instability。"},{"word":"temporary","phon":"/ˈtemprəri/","senses":[{"pos":"adj.","zh":"临时的；暂时的","col":"a temporary job 临时工作","ex":"The road closure is temporary.","exzh":"道路封闭是暂时的。"}],"note":"反义 permanent（永久的）。副词 temporarily。常考区分 temporary / contemporary（当代的）。"},{"word":"union","phon":"/ˈjuːniən/","senses":[{"pos":"n.","zh":"工会；联盟；联合","col":"join a union 加入工会 · the students' union 学生会","ex":"The union asked for higher pay.","exzh":"工会要求提高工资。"}],"note":"动词 unite；形容词 united。the European Union 欧盟。"},{"word":"vulnerable","phon":"/ˈvʌlnərəbl/","senses":[{"pos":"adj.","zh":"易受伤害的；脆弱的","col":"be vulnerable to sth 易受…伤害","ex":"Young children are vulnerable to infection.","exzh":"幼儿容易受感染。"}],"note":"be vulnerable to。名词 vulnerability。社会类文章常用以指弱势群体。"},{"word":"wage","phon":"/weɪdʒ/","senses":[{"pos":"n.","zh":"工资（多指按小时/周计的）","col":"the minimum wage 最低工资","ex":"He earns a low wage for long hours.","exzh":"他工时长、工资低。"}],"note":"wage 多指体力劳动者按小时/周计的工资；salary 指白领月薪/年薪。"},{"word":"aesthetic","phon":"/iːsˈθetɪk/","senses":[{"pos":"adj.","zh":"审美的；美学的","col":"aesthetic value 审美价值","ex":"The building has little aesthetic value.","exzh":"这栋楼没什么审美价值。"}],"note":"名词 aesthetics（美学）。拼写 ae- 开头，常考拼写。"},{"word":"craft","phon":"/krɑːft/","senses":[{"pos":"n.","zh":"手艺；工艺；技巧","col":"the craft of sth …的技艺","ex":"Weaving is a craft passed down through families.","exzh":"织布是家族相传的手艺。"}],"note":"可指具体行业（the potter's craft）也可指写作技巧（literary craft）。"},{"word":"compose","phon":"/kəmˈpəʊz/","senses":[{"pos":"v.","zh":"作曲；创作；构成","col":"be composed of 由…组成","ex":"The piece was composed in 1805.","exzh":"这首曲子创作于 1805 年。"}],"note":"be composed of = consist of = be made up of。名词 composer（作曲家）、composition（作文、作品）。"},{"word":"inspiration","phon":"/ˌɪnspəˈreɪʃn/","senses":[{"pos":"n.","zh":"灵感；鼓舞人心的人/事","col":"draw inspiration from sth 从…中汲取灵感","ex":"She drew inspiration from her grandmother's letters.","exzh":"她从祖母的信里汲取灵感。"}],"note":"动词 inspire（激励、启发）；形容词 inspiring（鼓舞人心的）。"},{"word":"original","phon":"/əˈrɪdʒənl/","senses":[{"pos":"adj.","zh":"原创的；最初的","col":"an original idea 原创的想法","ex":"The design is original and simple.","exzh":"这个设计原创而简洁。"}],"note":"名词 origin（起源）、originality（原创性）。the original 指“原件”。"},{"word":"portrait","phon":"/ˈpɔːtreɪt/","senses":[{"pos":"n.","zh":"肖像；画像；描写","col":"paint a portrait 画肖像","ex":"The gallery holds portraits of three centuries.","exzh":"这家美术馆藏有三个世纪的肖像画。"}],"note":"portrait 指人像；landscape 指风景画。也可比喻“描写”。"},{"word":"reveal","phon":"/rɪˈviːl/","senses":[{"pos":"v.","zh":"揭示；显露；透露","col":"reveal that… 揭示…","ex":"The study revealed a surprising pattern.","exzh":"这项研究揭示了一个意外的规律。"}],"note":"名词 revelation。阅读题常问 What does the study reveal?"},{"word":"sketch","phon":"/sketʃ/","senses":[{"pos":"n.","zh":"素描；草图；简述","col":"make a sketch 画草图","ex":"He made a quick sketch of the harbour.","exzh":"他给港口画了张速写。"}],"note":"动词 sketch out（概述）。"},{"word":"studio","phon":"/ˈstjuːdiəʊ/","senses":[{"pos":"n.","zh":"工作室；录音室；演播室","col":"a recording studio 录音棚","ex":"The band spent a month in the studio.","exzh":"乐队在录音棚待了一个月。"}],"note":"复数 studios。film studio 电影制片厂。"},{"word":"talent","phon":"/ˈtælənt/","senses":[{"pos":"n.","zh":"天赋；人才","col":"have a talent for sth 有某方面的天赋","ex":"She has a talent for explaining difficult ideas.","exzh":"她有把难懂的想法讲清楚的天赋。"}],"note":"可数（a talent）也可不可数。talented 有天赋的。"},{"word":"tradition","phon":"/trəˈdɪʃn/","senses":[{"pos":"n.","zh":"传统；惯例","col":"by tradition 按照传统 · a family tradition 家族传统","ex":"It is a tradition to eat dumplings at New Year.","exzh":"过年吃饺子是一项传统。"}],"note":"形容词 traditional。注意与 translation（翻译）拼写区分。"},{"word":"appreciate","phon":"/əˈpriːʃieɪt/","senses":[{"pos":"v.","zh":"欣赏；感激；理解","col":"appreciate the value of sth 认识到某物的价值","ex":"I appreciate your help.","exzh":"我很感激你的帮助。"}],"note":"后接动名词（appreciate doing），不接 to do。名词 appreciation。"},{"word":"vivid","phon":"/ˈvɪvɪd/","senses":[{"pos":"adj.","zh":"生动的；鲜明的（记忆）","col":"a vivid description 生动的描写","ex":"She gave a vivid account of the journey.","exzh":"她把那段旅程讲得很生动。"}],"note":"vivid memory 记忆犹新。副词 vividly。写作里替换 clear 的高分词。"},{"word":"bias","phon":"/ˈbaɪəs/","senses":[{"pos":"n.","zh":"偏见；偏差","col":"racial bias 种族偏见 · selection bias 选择偏差","ex":"The report was criticized for its bias.","exzh":"这份报告因偏见受到批评。"}],"note":"可数/不可数均可。形容词 biased（有偏见的）。统计里的 bias 指系统性偏差。"},{"word":"cite","phon":"/saɪt/","senses":[{"pos":"v.","zh":"引用；引证；举例","col":"cite an example 举例","ex":"The author cites three studies to support her point.","exzh":"作者引用了三项研究来支持她的观点。"}],"note":"与 site（地点）、sight（视力）同音。名词 citation（引文）。"},{"word":"credibility","phon":"/ˌkredəˈbɪləti/","senses":[{"pos":"n.","zh":"可信度；信誉","col":"lose credibility 失去信誉","ex":"The scandal damaged the paper's credibility.","exzh":"这起丑闻损害了该报的可信度。"}],"note":"形容词 credible（可信的）；credulous 意为“轻信的”，别混。"},{"word":"evidence","phon":"/ˈevɪdəns/","senses":[{"pos":"n.","zh":"证据；迹象","col":"evidence for/of sth 某事的证据","ex":"There is little evidence that the method works.","exzh":"几乎没有证据表明这个方法有效。"}],"note":"不可数名词，不能说 an evidence，要用 a piece of evidence。"},{"word":"peer","phon":"/pɪə(r)/","senses":[{"pos":"n.","zh":"同龄人；同辈；同行","col":"peer pressure 同辈压力 · peer review 同行评审","ex":"Teenagers are strongly influenced by their peers.","exzh":"青少年深受同龄人影响。"}],"note":"高考高频：peer pressure。作动词 peer at 意为“盯着看”。"},{"word":"reproduce","phon":"/ˌriːprəˈdjuːs/","senses":[{"pos":"v.","zh":"复制；再现；繁殖","col":"reproduce the result 复现结果","ex":"No one has been able to reproduce the experiment.","exzh":"没有人能复现这个实验。"}],"note":"re + produce。名词 reproduction。"},{"word":"sample","phon":"/ˈsɑːmpl/","senses":[{"pos":"n.","zh":"样本；样品","col":"a random sample 随机样本","ex":"The sample was too small to be reliable.","exzh":"样本太小，不可靠。"}],"note":"动词 sample 意为“抽样、品尝”。"},{"word":"significant","phon":"/sɪɡˈnɪfɪkənt/","senses":[{"pos":"adj.","zh":"重要的；显著的；有统计学意义的","col":"a significant difference 显著差异","ex":"The study found a significant improvement.","exzh":"研究发现有显著改善。"}],"note":"名词 significance。统计语境中 significant 专指“不是偶然造成的”。"},{"word":"statistics","phon":"/stəˈtɪstɪks/","senses":[{"pos":"n.","zh":"统计数字；统计学","col":"official statistics 官方统计","ex":"The statistics tell a different story.","exzh":"统计数字讲的是另一个故事。"}],"note":"作“统计数字”时复数；作“统计学”时单数（Statistics is...）。"},{"word":"transparent","phon":"/trænsˈpærənt/","senses":[{"pos":"adj.","zh":"透明的；公开的；易懂的","col":"a transparent process 公开透明的流程","ex":"The public wants a more transparent government.","exzh":"公众希望政府更透明。"}],"note":"名词 transparency。比喻义在议论文中很常用（公开、不遮掩）。"},{"word":"verify","phon":"/ˈverɪfaɪ/","senses":[{"pos":"v.","zh":"核实；证实","col":"verify the facts 核实事实","ex":"We called the office to verify the information.","exzh":"我们打电话给办公室核实这条信息。"}],"note":"名词 verification。比 check 正式。"},{"word":"funding","phon":"/ˈfʌndɪŋ/","senses":[{"pos":"n.","zh":"资金；拨款","col":"research funding 科研经费","ex":"The project lost its funding last year.","exzh":"这个项目去年失去了经费。"}],"note":"不可数。动词 fund（资助）；fund 也可作名词（基金）。"},{"word":"publication","phon":"/ˌpʌblɪˈkeɪʃn/","senses":[{"pos":"n.","zh":"出版；发表；出版物","col":"date of publication 出版日期","ex":"The study is ready for publication.","exzh":"这项研究已可以发表。"}],"note":"动词 publish；形容词 published。与 public（公共的）同源但意思不同。"},{"word":"collapse","phon":"/kəˈlæps/","senses":[{"pos":"n.","zh":"倒塌；崩溃","col":"the collapse of a building 建筑倒塌","ex":"The collapse of the old bridge forced the road to close.","exzh":"旧桥垮塌迫使这条路封闭。","exhint":"作名词是“倒塌、崩溃”；动词 collapse 还可指人晕倒、价格暴跌。"},{"pos":"v.","zh":"倒塌；崩溃","col":"collapse under pressure 在压力下垮掉","ex":"Support for the plan collapsed after the report was published.","exzh":"报告发表后，对这项计划的支持迅速瓦解。"}],"note":"高考阅读常见：建筑 collapse（倒塌）、系统/计划 collapse（崩溃）。比 fall down 正式，作文里可直接用。"},{"word":"construction","phon":"/kənˈstrʌkʃn/","senses":[{"pos":"n.","zh":"建造；施工；建筑物","col":"under construction 在施工中","ex":"The new library is still under construction.","exzh":"新图书馆仍在建设中。","exhint":"词根 construct（建造）＋-ion；“建筑业”是 the construction industry。"}],"note":"under construction 是高频短语；抽象义 the construction of sth 指“某物的建设、构建”。"},{"word":"contrast","phon":"/ˈkɒntrɑːst/","senses":[{"pos":"n.","zh":"对比；反差","col":"a striking contrast 鲜明的反差","ex":"There is a sharp contrast between the two halves of the film.","exzh":"影片的前后两半形成鲜明反差。","exhint":"名词重音在前，动词（kənˈtrɑːst）重音在后。"},{"pos":"v.","zh":"对比；形成对照","col":"contrast A with B 把 A 与 B 对比","ex":"The writer contrasts city life with village life.","exzh":"作者把城市生活与乡村生活作了对比。"}],"note":"by contrast（相比之下）、in contrast to/with 是完形和写作高频；阅读里 the contrast was striking 常引出转折考点。"},{"word":"demonstrate","phon":"/ˈdemənstreɪt/","senses":[{"pos":"v.","zh":"证明；表明","col":"demonstrate that… 表明……","ex":"The experiment demonstrates that plants grow faster in warm light.","exzh":"这个实验表明植物在暖光下长得更快。","exhint":"比 show、prove 正式，作文里替换它们很好用。"},{"pos":"v.","zh":"演示；示范","col":"demonstrate how to do sth 演示怎样做某事","ex":"She demonstrated how the machine works.","exzh":"她演示了这台机器如何运转。"}],"note":"后接 that 从句或名词；名词 demonstration（示范、游行）。"},{"word":"luxury","phon":"/ˈlʌkʃəri/","senses":[{"pos":"n.","zh":"奢侈；奢侈品","col":"live in luxury 过奢华生活","ex":"For many families, a car is a luxury rather than a necessity.","exzh":"对许多家庭来说，汽车是奢侈品而非必需品。","exhint":"不可数时是“奢华”，可数时是“一件奢侈品”。"},{"pos":"adj.","zh":"豪华的","col":"a luxury hotel 豪华酒店","ex":"They spent the weekend in a luxury hotel by the sea.","exzh":"他们在海边的豪华酒店过了周末。"}],"note":"luxury goods 奢侈品；private luxury address 私人豪华住宅（本篇）。"},{"word":"resident","phon":"/ˈrezɪdənt/","senses":[{"pos":"n.","zh":"居民；住户","col":"local residents 当地居民","ex":"Residents complained about the noise from the building site.","exzh":"居民们抱怨工地的噪音。","exhint":"动词 reside（居住），名词 residence（住所）。"}],"note":"指“某地的居民”，写作里描述社区、城市时常用；形容词 resident 也有“常驻的”义。"},{"word":"shortage","phon":"/ˈʃɔːtɪdʒ/","senses":[{"pos":"n.","zh":"短缺；不足","col":"a shortage of sth 缺少某物","ex":"A shortage of nurses has forced the hospital to close two wards.","exzh":"护士短缺迫使医院关闭了两个病房。","exhint":"short（缺）＋-age 构成名词。"}],"note":"housing shortage 住房短缺、water shortage 缺水、labour shortage 人手不足；注意别和 shortcoming（缺点）混。"},{"word":"standard","phon":"/ˈstændəd/","senses":[{"pos":"n.","zh":"标准；水准","col":"set a standard 树立标准","ex":"The school sets high standards for its students.","exzh":"这所学校对学生要求很高。","exhint":"meet/reach a standard 达到标准；standard of living 生活水平。"},{"pos":"adj.","zh":"标准的；普通的","col":"standard practice 常规做法","ex":"This is standard practice in most hospitals.","exzh":"这是多数医院的常规做法。"}],"note":"set a standard for sth 为某物树立标准（本篇原句）；standard 与 criterion 都可译“标准”，后者更偏“评判依据”。"},{"word":"wealth","phon":"/welθ/","senses":[{"pos":"n.","zh":"财富","col":"a mark of wealth 财富的标志","ex":"The family's wealth came from trade.","exzh":"这家的财富来自贸易。","exhint":"形容词 wealthy（富有的）。"},{"pos":"n.","zh":"大量；丰富","col":"a wealth of 大量的（信息、经验等）","ex":"The region has a wealth of wildlife.","exzh":"这个地区有大量野生动物。"}],"note":"熟词生义考点：a wealth of + 不可数名词或复数＝“大量的”，阅读里常被误读成“财富”。"},{"word":"shelter","phon":"/ˈʃeltə/","senses":[{"pos":"n.","zh":"住所；庇护（所）","col":"basic shelter 基本的栖身之所","ex":"Many families are still without food or shelter.","exzh":"许多家庭仍然没有食物和住所。","exhint":"不可数时是“庇护”，可数时是“避难所”。"},{"pos":"v.","zh":"躲避；庇护","col":"take shelter from the rain 躲雨","ex":"They took shelter from the rain under a bridge.","exzh":"他们在桥下躲雨。"}],"note":"seek/take shelter from 躲避……；本篇 basic shelter 指“基本居住条件”。"},{"word":"insult","phon":"/ˈɪnsʌlt/","senses":[{"pos":"n.","zh":"侮辱；冒犯","col":"an insult to sb 对某人的侮辱","ex":"The remark was meant as an insult.","exzh":"那句话本意是侮辱。","exhint":"名词重音在前，动词（ɪnˈsʌlt）重音在后。"},{"pos":"v.","zh":"侮辱；冒犯","col":"feel insulted 感到受侮辱","ex":"He felt insulted when nobody listened to his idea.","exzh":"没人听他的想法，他觉得受了侮辱。"}],"note":"be heard as an insult＝听起来像侮辱（本篇）；insulting language 侮辱性语言。"},{"word":"classification","phon":"/ˌklæsɪfɪˈkeɪʃn/","senses":[{"pos":"n.","zh":"分类；类别","col":"a classification system 分类系统","ex":"The library uses a simple classification system for its books.","exzh":"图书馆用一套简单的分类法管理图书。","exhint":"动词 classify（把……分类）。"}],"note":"学术类文章高频；medical classification 医学分类（本篇），指把人按病症归类的那套说法。"},{"word":"consultation","phon":"/ˌkɒnsʌlˈteɪʃn/","senses":[{"pos":"n.","zh":"就诊；咨询；协商","col":"in consultation with 与……协商","ex":"The doctor spent twenty minutes in consultation with the patient.","exzh":"医生和病人谈了二十分钟。","exhint":"动词 consult（咨询；查阅）。"}],"note":"in a consultation＝在就诊时（本篇）；consult a dictionary＝查词典，是熟词生义考点。"},{"word":"individual","phon":"/ˌɪndɪˈvɪdʒuəl/","senses":[{"pos":"n.","zh":"个人；个体","col":"each individual 每个人","ex":"The course is designed for the individual learner.","exzh":"这门课是为单个学习者设计的。","exhint":"与 personal 不同，individual 强调“单个的人”，常与 society 对举。"},{"pos":"adj.","zh":"个别的；独特的","col":"individual needs 个别需求","ex":"Teachers should pay attention to individual differences.","exzh":"教师应关注个体差异。"}],"note":"本篇“the individual is more than a description”＝人不只是一个（医学）标签。"},{"word":"manners","phon":"/ˈmænəz/","senses":[{"pos":"n.","zh":"礼貌；礼仪","col":"good manners 有礼貌","ex":"It is bad manners to talk with your mouth full.","exzh":"满嘴食物说话是不礼貌的。","exhint":"单数 manner＝方式（in this manner 以这种方式）；复数才表示“礼貌”。"}],"note":"a matter of manners 礼貌问题（本篇）；table manners 餐桌礼仪。"},{"word":"prescribe","phon":"/prɪˈskraɪb/","senses":[{"pos":"v.","zh":"开（药）；处方","col":"prescribe medicine 开药","ex":"The doctor prescribed a week of rest.","exzh":"医生开了休息一周的处方。","exhint":"名词 prescription（处方）。"},{"pos":"v.","zh":"规定；指定","col":"prescribed rules 规定的规则","ex":"The law prescribes how the waste must be stored.","exzh":"法律规定了这些废物必须怎样存放。"}],"note":"本篇“need not be prescribed for every other conversation”＝不必被规定成其他所有谈话的用法。"},{"word":"respectful","phon":"/rɪˈspektfl/","senses":[{"pos":"adj.","zh":"恭敬的；尊重的","col":"be respectful of/to 尊重……","ex":"She was respectful of her grandparents' opinions.","exzh":"她尊重祖父母的意见。","exhint":"respect＋-ful＝“充满敬意的”。"}],"note":"三个易混形容词：respectful 尊重的 / respectable 体面的 / respective 各自的，高考常考辨析。"},{"word":"routine","phon":"/ruːˈtiːn/","senses":[{"pos":"n.","zh":"常规；日常安排","col":"a daily routine 日常安排","ex":"Exercise is part of my morning routine.","exzh":"锻炼是我早上的固定安排。"},{"pos":"adj.","zh":"例行的；平常的","col":"a routine check 例行检查","ex":"The same joke sounds routine after the tenth time.","exzh":"同一个笑话听第十遍就显得平常了。"}],"note":"形容词义是熟词考点：sounds routine in one setting＝在某个场合听起来很平常（本篇）。"},{"word":"tissue","phon":"/ˈtɪʃuː/","senses":[{"pos":"n.","zh":"（生物的）组织","col":"muscle tissue 肌肉组织","ex":"The scan showed damage to the soft tissue around the knee.","exzh":"扫描显示膝盖周围的软组织受损。","exhint":"生物文章里几乎都是“组织”，不是“纸巾”。"},{"pos":"n.","zh":"纸巾","col":"a box of tissues 一盒纸巾","ex":"She wiped her hands with a tissue.","exzh":"她用纸巾擦了手。"}],"note":"熟词生义：本篇“the technical name for a kind of tissue”＝某类组织的技术名称。"},{"word":"trust","phon":"/trʌst/","senses":[{"pos":"v.","zh":"信任；相信","col":"trust sb to do sth 相信某人会做某事","ex":"Patients trust nurses who explain things clearly.","exzh":"病人信任把事情讲清楚的护士。","exhint":"名词 trust 不可数；trust in sb/sth 对……的信任。"},{"pos":"n.","zh":"信任；信托","col":"win sb's trust 赢得某人的信任","ex":"It takes years to win the trust of a community.","exzh":"赢得一个社区的信任需要多年。"}],"note":"本篇“trust a healthcare provider enough to return”＝信任到愿意再来，考的是“信任的程度影响行为”。"},{"word":"campaign","phon":"/kæmˈpeɪn/","senses":[{"pos":"n.","zh":"运动；战役","col":"an advertising campaign 广告宣传活动","ex":"The city ran a campaign to cut food waste.","exzh":"这座城市开展了一场减少食物浪费的活动。"},{"pos":"v.","zh":"参加运动；奔走","col":"campaign for/against 为/反对……而奔走","ex":"Students campaigned for a later start to the school day.","exzh":"学生们为推迟上学时间而奔走。"}],"note":"本篇“groups that campaign for acceptance”＝为争取被接纳而发声的群体。"},{"word":"setting","phon":"/ˈsetɪŋ/","senses":[{"pos":"n.","zh":"环境；场合","col":"in a rural setting 在乡村环境中","ex":"The same joke can be funny in one setting and rude in another.","exzh":"同一个笑话在一个场合好笑，在另一个场合就失礼。","exhint":"与 situation、context 近义，但更强调“所处的场景”。"},{"pos":"n.","zh":"（小说的）背景","col":"the setting of the novel 小说的背景","ex":"The novel's setting is a small town in the 1930s.","exzh":"这部小说的背景是 1930 年代的一个小镇。"}],"note":"本篇反复出现“in one setting / in another”，是理解全文的关键词。"},{"word":"obesity","phon":"/əʊˈbiːsəti/","senses":[{"pos":"n.","zh":"肥胖（症）","col":"childhood obesity 儿童肥胖","ex":"The report links obesity to cheap, sugary food.","exzh":"报告把肥胖与廉价含糖食品联系起来。","exhint":"形容词 obese（肥胖的）。"}],"note":"本篇的讨论对象：“a person with obesity”＝一个肥胖的人，这种“人先说”的说法正是文中讨论的用词方式。"},{"word":"threshold","phon":"/ˈθreʃhəʊld/","senses":[{"pos":"n.","zh":"门槛；临界值","col":"meet a threshold 达到门槛","ex":"Only people who met a viewing threshold could take part in the survey.","exzh":"只有达到观看门槛的人才能参加这项调查。","exhint":"本义是“门槛”，研究中引申为“判定标准、临界值”。"}],"note":"a viewing threshold 观看门槛；reach/cross a threshold 达到临界值。学术文章高频。"},{"word":"criteria","phon":"/kraɪˈtɪəriə/","senses":[{"pos":"n.","zh":"标准（criterion 的复数）","col":"meet the criteria 符合标准","ex":"Some frequent viewers did not meet the criteria for problematic viewing.","exzh":"一些频繁观看者并不符合“观看有问题”的标准。","exhint":"单数 criterion，复数 criteria，别写 criterias。"}],"note":"高考语法填空常考单复数：a criterion / these criteria。同义 standard。"},{"word":"measure","phon":"/ˈmeʒə/","senses":[{"pos":"n.","zh":"（衡量的）指标；措施","col":"a separate measure 另一套衡量指标","ex":"The researchers used a separate measure to identify problematic viewing.","exzh":"研究者用另一套指标来识别“有问题的观看”。","exhint":"take measures to do sth＝采取措施做某事，是熟词考点。"},{"pos":"v.","zh":"测量；衡量","col":"measure how serious sth is 衡量某事有多严重","ex":"It is hard to measure how much the habit affects sleep.","exzh":"很难衡量这个习惯对睡眠影响有多大。"}],"note":"名词两义：指标 / 措施；动词“衡量”。完形里 measures of viewing problems 指“量表”。"},{"word":"problematic","phon":"/ˌprɒbləˈmætɪk/","senses":[{"pos":"adj.","zh":"成问题的；有麻烦的","col":"problematic viewing 有问题的观看行为","ex":"The study separated ordinary viewing from problematic viewing.","exzh":"这项研究把普通观看与有问题的观看区分开。","exhint":"problem＋-atic；比 bad 更学术，指“引起了问题的”。"}],"note":"problematic 不等于“有问题的题目”。它形容“引起麻烦的、令人担忧的”行为或情况。"},{"word":"frequent","phon":"/ˈfriːkwənt/","senses":[{"pos":"adj.","zh":"频繁的","col":"frequent viewers 频繁观看者","ex":"Frequent viewing is not the same as problematic viewing.","exzh":"频繁观看并不等于有问题的观看。","exhint":"动词重音在后：freˈquent（常去）。"}],"note":"本篇核心区分：frequent（次数多）vs problematic（已经造成问题）。"},{"word":"loneliness","phon":"/ˈləʊnlinəs/","senses":[{"pos":"n.","zh":"孤独；寂寞","col":"report more loneliness 报告更孤独","ex":"About one person in six experiences loneliness, according to the WHO.","exzh":"据世界卫生组织估计，全球约六分之一的人经历孤独。","exhint":"形容词 lonely（孤独的），名词是 loneliness，注意只有一个 n。"}],"note":"lonely（孤独的）→ loneliness；alone 只表示“独自”。"},{"word":"rewarding","phon":"/rɪˈwɔːdɪŋ/","senses":[{"pos":"adj.","zh":"有回报的；令人满足的","col":"a rewarding experience 令人满足的体验","ex":"Some viewers look for an experience that feels rewarding.","exzh":"有些观众想要一种让人满足的体验。","exhint":"reward（回报）＋-ing 作形容词，修饰事物，不修饰人。"}],"note":"注意 -ing 形容词修饰事物（a rewarding job），-ed 修饰人的感受（I felt rewarded）。"},{"word":"estimate","phon":"/ˈestɪmət/","senses":[{"pos":"n.","zh":"估计；估算","col":"according to an estimate 据估计","ex":"According to one estimate, a sixth of the world feels lonely.","exzh":"据一项估计，全球六分之一的人感到孤独。"},{"pos":"v.","zh":"估计","col":"estimate that… 估计……","ex":"Volunteers estimated the percentage, not the number.","exzh":"志愿者估计的是百分比，不是人数。"}],"note":"名词重音在前（ˈestɪmət），动词重音在后（ˈestɪmeɪt）——高考语音题常考。"},{"word":"predict","phon":"/prɪˈdɪkt/","senses":[{"pos":"v.","zh":"预测；预言","col":"help predict sth 有助于预测某事","ex":"Loneliness helped predict how serious the viewing problems were.","exzh":"孤独程度有助于预测观看问题有多严重。","exhint":"pre-（前）＋dict（说）＝预先说出。"}],"note":"高分表达：X helps predict Y ≠ X causes Y。本篇正是靠这点设题（预测不等于造成）。"},{"word":"severity","phon":"/sɪˈverəti/","senses":[{"pos":"n.","zh":"严重程度","col":"the severity of the problem 问题的严重程度","ex":"The result says nothing about the severity of other habits.","exzh":"这个结果并没有说明其他习惯的严重程度。","exhint":"形容词 severe（严重的）。"}],"note":"the severity of ＋名词，学术写作常用；形容词 severe 还可指“严厉的”。"},{"word":"questionnaire","phon":"/ˌkwestʃəˈneə/","senses":[{"pos":"n.","zh":"问卷","col":"fill in a questionnaire 填问卷","ex":"Their study used questionnaires from 551 adults.","exzh":"他们的研究用了 551 位成年人的问卷。","exhint":"question＋-naire，注意双 n、结尾 -naire。"}],"note":"研究方法类文章四件套：sample（样本）、questionnaire（问卷）、measure（测量）、result（结果）。"},{"word":"link","phon":"/lɪŋk/","senses":[{"pos":"n.","zh":"联系；关联","col":"a link between A and B A 与 B 的关联","ex":"The link did not appear among viewers without problems.","exzh":"在没有出现问题的观看者中，这种关联没有出现。","exhint":"动词 link A to B＝把 A 与 B 联系起来。"}],"note":"注意 link 只表示“有关联”，不表示“因果”，这是阅读题最爱设的陷阱。"},{"word":"quantity","phon":"/ˈkwɒntəti/","senses":[{"pos":"n.","zh":"数量","col":"a quantity of 一定数量的","ex":"When judging a quantity, we start from the first figure we see.","exzh":"判断一个数量时，我们从看到的第一个数字出发。","exhint":"与 quality（质量）成对，别混。"}],"note":"quantity 数量 / quality 质量；a large quantity of ＋不可数或复数。"},{"word":"figure","phon":"/ˈfɪɡə/","senses":[{"pos":"n.","zh":"数字","col":"the first figure 第一个数字","ex":"The figure on the wheel had no bearing on the answer.","exzh":"转盘上的数字与答案毫无关系。","exhint":"figure 还有“人物、身材、图形”等义，是典型的多义词。"},{"pos":"n.","zh":"人物","col":"a public figure 公众人物","ex":"She became a public figure after the book came out.","exzh":"书出版后她成了公众人物。"}],"note":"熟词多义：数字 / 人物 / 身材 / 图形。阅读里先看搭配判断。"},{"word":"anchor","phon":"/ˈæŋkə/","senses":[{"pos":"n.","zh":"锚；参照点","col":"an anchoring effect 锚定效应","ex":"An anchor affects what seems sensible as well as what feels right.","exzh":"锚点既影响什么看起来合理，也影响什么感觉对。","exhint":"本义“锚”，心理学术语指“先给出的参照数字”。"},{"pos":"v.","zh":"使固定；抛锚","col":"anchor the boat 把船固定住","ex":"They anchored the boat near the shore.","exzh":"他们把船停在岸边。"}],"note":"anchoring（锚定）＝先出现的数字把人往它那边拉；本篇核心概念。"},{"word":"percentage","phon":"/pəˈsentɪdʒ/","senses":[{"pos":"n.","zh":"百分比","col":"what percentage of… 百分之几的……","ex":"Volunteers estimated what percentage of UN members were African countries.","exzh":"志愿者估计联合国成员中非洲国家占百分之几。","exhint":"percent 后面不加 of 时是副词/名词；percentage of ＋名词。
