<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>词境 · 高三英语词汇阅读</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-title" content="词境">
<style>
:root{--bg:#f7f4ee;--card:#fffdf8;--ink:#1f2433;--ink2:#5b6172;--ink3:#8b90a0;--line:#e7e1d4;--accent:#b4552d;--accent-soft:#f2e3da;--good:#2f7d5c;--good-soft:#e3f0e9;--bad:#b23b3b;--bad-soft:#f7e6e3;--warn:#b07d18;--warn-soft:#f7edd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6}
body[data-font="serif"]{--read-font:"Noto Serif SC",Georgia,"Songti SC","SimSun",serif}
.hidden{display:none!important}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.topbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(247,244,238,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:4px;min-width:0}
#btn-back{display:none;font-size:20px;line-height:1}
.brand{font-weight:800;font-size:17px;letter-spacing:.02em}
.brand span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
.tb-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);font-size:16px}
.icon-btn:active{background:var(--accent-soft)}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(48px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(31,36,51,.04)}
.hero{background:linear-gradient(150deg,#fffdf8 0%,#fbf3ea 100%)}
.h1{font-size:19px;font-weight:800;letter-spacing:.01em;margin:0 0 4px}
.sub{color:var(--ink2);font-size:13px;margin:0}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;transition:transform .06s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.grey{background:#efece4;color:var(--ink2)}
.btn.block{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--accent-soft);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat small{color:var(--ink2);font-size:11px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em}
.readlink{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.readlink:active{background:#faf6ee}
.readlink .t{font-weight:700;font-size:15px;margin-bottom:2px}
.readlink .m{font-size:12px;color:var(--ink3)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.grey{background:#efece4;color:var(--ink3)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#efece4;color:var(--ink2)}
.reader-head{margin-bottom:12px}
.reader-title{font-size:21px;font-weight:800;line-height:1.35;margin:2px 0 6px}
.reader-meta{font-size:12px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap}
.article{font-size:17.5px;line-height:1.95;color:var(--ink);letter-spacing:.01em}
body[data-font="serif"] .article{font-family:var(--read-font);font-size:18px}
.article p{margin:0 0 14px}
.article .para-num{display:inline-block;min-width:20px;font-size:11px;color:var(--ink3);vertical-align:2px;font-family:ui-monospace,monospace}
.tw{color:#a8401b;font-weight:700;background:linear-gradient(transparent 60%,rgba(230,190,160,.45) 60%);border-bottom:2px solid rgba(168,64,27,.5);padding:0 1px;border-radius:2px;cursor:pointer}
.tw:active{background:rgba(230,190,160,.75)}
.tw.looked{background:rgba(240,214,196,.9);border-bottom-color:#a8401b}
.hintbar{display:flex;gap:8px;margin:12px 0}
.gloss{background:#fbf7ef;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;margin:12px 0}
.gloss div{padding:3px 0}
.gloss b{color:var(--accent)}
.gloss .zh{color:var(--ink2)}
.q-block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.q-text{font-size:16px;font-weight:700;line-height:1.6;margin:0 0 4px}
.q-type{font-size:11px;color:var(--ink3);letter-spacing:.04em}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;line-height:1.55}
.opt .k{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#efece4;font-weight:700;font-size:13px;color:var(--ink2)}
.opt:active{background:#faf6ee}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .mark{margin-left:auto;font-weight:800;font-size:15px}
.exp{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:#f8f5ee;font-size:14px;line-height:1.7;color:var(--ink2);border-left:3px solid var(--accent)}
.exp.show{display:block}
.exp .src{color:var(--ink);font-style:italic}
.flash{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 6px 24px rgba(31,36,51,.06)}
.flash-word{font-size:38px;font-weight:800;letter-spacing:.01em;word-break:break-word}
.flash-phon{color:var(--ink3);font-size:14px;margin-top:2px;font-family:ui-monospace,monospace}
.flash-back{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);text-align:left;font-size:15px;line-height:1.7;display:none}
.flash-back.show{display:block}
.sense{margin-bottom:8px}
.sense .pos{color:var(--accent);font-weight:700;font-size:13px;margin-right:4px}
.sense .zh{font-weight:700}
.sense .ex{color:var(--ink2);font-size:13.5px;margin-top:2px}
.sense .exhint{color:var(--ink3);font-size:12.5px}
.fmeta{font-size:12px;color:var(--ink3);margin-bottom:14px;display:flex;justify-content:space-between}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rate{min-height:48px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:#fff}
.rate.y{background:var(--bad-soft);color:var(--bad);border-color:#f0d5d0}
.rate.v{background:var(--warn-soft);color:var(--warn);border-color:#eeddb5}
.rate.g{background:var(--good-soft);color:var(--good);border-color:#cfe4d8}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(31,36,51,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:100;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:30px 10px;color:var(--ink3);font-size:14px}
.hr{height:1px;background:var(--line);margin:16px 0}
.muted{color:var(--ink3);font-size:12.5px}
select,input,textarea{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:90px}
.settings label{display:block;font-size:13px;color:var(--ink2);margin:14px 0 6px;font-weight:600}
.backdrop{position:fixed;inset:0;background:rgba(20,22,30,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.backdrop.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.wh{padding-bottom:12px;border-bottom:1px solid var(--line)}
.ww{font-size:30px;font-weight:800;letter-spacing:.01em;word-break:break-word}
.wp{color:var(--ink3);font-family:ui-monospace,monospace;font-size:13px;margin-top:3px}
.wsec{margin-top:14px}
.wl{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--ink3);margin-bottom:7px}
.wnote{background:#fbf3e8;border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.7}
.wctx{margin-bottom:10px}
.wctx-src{font-size:11px;color:var(--ink3);margin-bottom:2px}
.wctx .en{font-size:14.5px;line-height:1.6}
.wctx .zh{font-size:13px;color:var(--ink2);margin-top:2px}
.wstat{font-size:13.5px;color:var(--ink2);line-height:1.7}
.sense .sh{margin-bottom:2px}
.sense .col{color:var(--ink2);font-size:13px;margin-top:2px}
.sense .exzh{color:var(--ink3);font-size:12.5px;margin-top:1px}
.sense .ex{color:var(--ink);font-size:14px;margin-top:3px}
.sheet .phon{color:var(--ink3);font-family:ui-monospace,monospace;font-size:13px}
progress{width:100%;height:6px;border-radius:99px;appearance:none}
progress::-webkit-progress-bar{background:#efece4;border-radius:99px}
progress::-webkit-progress-value{background:var(--accent);border-radius:99px}
@media(max-width:420px){.article{font-size:17px}.stats{gap:8px}.stat b{font-size:18px}}
/* 题目抽屉：给不能强制横屏的浏览器（iOS 上的各种浏览器都是 WebKit）用 */
html.drawer body{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
html.drawer .reader-grid{display:block}
html.drawer .col-quiz{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:66vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(20,22,30,.14);padding:0 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(calc(100% - 46px));transition:transform .22s ease}
html.drawer .col-quiz.open{transform:translateY(0)}
html.drawer .col-quiz:not(.open){overflow:hidden}
html.drawer .quiz-handle{position:sticky;top:0;z-index:2;margin:0 -14px;width:calc(100% + 28px);height:46px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);font:inherit;font-size:14px;font-weight:700;color:var(--accent)}
html.drawer .col-quiz.open .sec-title:first-of-type{padding-top:12px}
.reader-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.tool{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 15px;border-radius:11px;background:#efece4;color:var(--ink2);font-size:13px;font-weight:700}
.tool:active{background:#e4dfd2}
@media(max-height:520px){.article{font-size:16px;line-height:1.75}.reader-title{font-size:19px}}
@media(min-width:780px){
  main{max-width:1200px}
  .reader-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);gap:26px;align-items:start}
  .reader-grid .col-quiz{position:sticky;top:64px;max-height:calc(100vh - 82px);max-height:calc(100dvh - 82px);overflow:auto;overscroll-behavior:contain;padding-bottom:40px}
  .reader-grid .col-quiz::-webkit-scrollbar{width:0}
  .reader-grid .col-read{min-width:0}
}
@media print{
  body{background:#fff}
  .topbar,.reader-tools,.hintbar,.gloss,#btn-home,.btn,.tool{display:none!important}
  main{max-width:none;padding:0}
  .reader-grid{display:block}
  .col-quiz{position:static;max-height:none;overflow:visible}
  .card,.q-block{break-inside:avoid;box-shadow:none}
  .article{font-size:11.5pt;line-height:1.75}
  .opt{border-color:#ddd}
  html.drawer .col-quiz{position:static;transform:none;max-height:none;overflow:visible;box-shadow:none;border:0;padding:0}
  .quiz-handle{display:none!important}
}
</style>
</head>
<body>
<div id="rotwrap">
<header class="topbar">

    <button class="icon-btn" id="btn-back" title="返回">←</button>

  </div>

</header>
<main id="app"></main>
<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
</div>
<script id="data" type="application/json">{"DATA":{"words":[{"word":"admire","phon":"/ədˈmaɪə/","senses":[{"pos":"v.","zh":"钦佩；羡慕","ex":"I admire people who never give up.","exhint":"admire sb for sth 因某事钦佩某人","exzh":"我佩服那些从不放弃的人。"}],"note":"固定搭配 admire sb for sth（因某事佩服某人）；名词 admiration。作文里夸人很好用。"},{"word":"apology","phon":"/əˈpɒlədʒi/","senses":[{"pos":"n.","zh":"道歉","ex":"He made a short apology and left.","exhint":"make/accept an apology 道歉/接受道歉","exzh":"他简短地道了个歉就走了。"}],"note":"动词是 apologize（apologize to sb for sth）。make / accept an apology = 道歉 / 接受道歉。拼写别掉 letters：apology 中间是 o。"},{"word":"approach","phon":"/əˈprəʊtʃ/","senses":[{"pos":"v.","zh":"走近；着手处理","ex":"As winter approached, the days grew shorter.","exhint":"approach 作名词也常考：“方法、途径”","exzh":"冬天临近，白天变短了。"},{"pos":"n.","zh":"方法；途径","ex":"a different approach to the problem","exzh":"解决这个问题的另一种方法。"}],"note":"名词用法极常考：an approach to (doing) sth，to 是介词，后面接 doing 不接 do；“做某事的方法”别写成 approach to do。"},{"word":"argue","phon":"/ˈɑːɡjuː/","senses":[{"pos":"v.","zh":"争论；主张","ex":"They argued about the plan for an hour.","exhint":"argue that... 主张……；argue with sb 与某人争论","exzh":"他们就这个计划争论了一个小时。"}],"note":"argue with sb about / over sth（与某人争论某事）；argue that...（主张、认为）。名词 argument，形容词 arguable。"},{"word":"attach","phon":"/əˈtætʃ/","senses":[{"pos":"v.","zh":"系上；附上；把……固定","ex":"Please attach a photo to your form.","exhint":"attach A to B；be attached to 依恋","exzh":"请在表格上附一张照片。"}],"note":"attach A to B（把 A 附在 B 上）；be attached to（依恋；附属于）。阅读里 “Attached to the note was a small card” 是倒装，正常语序是 A small card was attached to the note。"},{"word":"benefit","phon":"/ˈbenɪfɪt/","senses":[{"pos":"n.","zh":"好处；益处","ex":"Reading brings real benefits.","exhint":"benefit from 从……中受益；for the benefit of 为了……的利益","exzh":"阅读能带来实实在在的好处。"}],"note":"动词用法 benefit from sth（从……中受益）、benefit sb（对某人有好处）；形容词 beneficial；for the benefit of sb（为了某人）。"},{"word":"charming","phon":"/ˈtʃɑːmɪŋ/","senses":[{"pos":"adj.","zh":"迷人的；有魅力的","ex":"a charming little town","exhint":"charm n. 魅力 v. 吸引","exzh":"一个迷人的小镇。"}],"note":"charm 是名词“魅力”、动词“吸引”；charming 在阅读里常用来正面描写人物或地方。"},{"word":"concern","phon":"/kənˈsɜːn/","senses":[{"pos":"n.","zh":"担心；关心的事","ex":"His biggest concern is time.","exhint":"be concerned about 担心；as far as I'm concerned 就我而言","exzh":"他最大的顾虑是时间。"},{"pos":"v.","zh":"使担心；涉及","ex":"The news concerned us all.","exzh":"这个消息让我们都担心。"}],"note":"as far as I'm concerned（就我而言）；be concerned about（担心）/ be concerned with（与……有关）；concerning 作介词 = 关于。"},{"word":"confident","phon":"/ˈkɒnfɪdənt/","senses":[{"pos":"adj.","zh":"自信的；有把握的","ex":"She felt confident before the exam.","exhint":"be confident of/about sth 对……有信心","exzh":"考试前她很有信心。"}],"note":"be confident of / about sth；名词 confidence，副词 confidently。别和 confidential（机密的）混。"},{"word":"contain","phon":"/kənˈteɪn/","senses":[{"pos":"v.","zh":"包含；容纳","ex":"This box contains old letters.","exhint":"注意：contain 不是“控制”，那是 control","exzh":"这个盒子里装着一些旧信。"}],"note":"contain 强调“里面装着”（容器、成分），include 强调“作为一部分列入”。重音在后 conTAIN。派生 container（容器）。"},{"word":"convince","phon":"/kənˈvɪns/","senses":[{"pos":"v.","zh":"使确信；说服","ex":"He convinced me to try again.","exhint":"convince sb of sth / convince sb to do sth","exzh":"他说服我再试一次。"}],"note":"convince sb of sth / convince sb that...；convince sb to do sth（更偏美式）。形容词 convincing（有说服力的）、convinced（确信的）。"},{"word":"deserve","phon":"/dɪˈzɜːv/","senses":[{"pos":"v.","zh":"值得；应得","ex":"You deserve a rest.","exhint":"deserve to do sth 值得做某事","exzh":"你该休息一下。"}],"note":"deserve to do sth；deserve doing = deserve to be done（值得被……）。口语 You deserve it = 这是你应得的。"},{"word":"choice","phon":"/tʃɔɪs/","senses":[{"pos":"n.","zh":"选择；抉择","col":"make a choice / have no choice but to do","ex":"She had no choice but to stay.","exzh":"她别无选择，只能留下。"},{"pos":"n.","zh":"选项；可选的东西","col":"a wide choice of","ex":"The menu offers a wide choice of fish.","exzh":"菜单上有多种鱼可以选。"}],"note":"高考里常与 have no choice but to do（不得不）搭配；choice 与 chance 拼写只差两个字母，别混。"},{"word":"balance","phon":"/ˈbæləns/","senses":[{"pos":"v.","zh":"使平衡；权衡","col":"balance A and B","ex":"It is hard to balance study and rest.","exzh":"很难在学习和休息之间取得平衡。"},{"pos":"n.","zh":"平衡","col":"keep a balance between","ex":"Keep a balance between work and life.","exzh":"在工作和生活之间保持平衡。"}],"note":"抽象搭配极常考：strike a balance between A and B（在两者间取得平衡）。"},{"word":"guilty","phon":"/ˈɡɪlti/","senses":[{"pos":"adj.","zh":"内疚的；有罪的","col":"feel guilty about (doing) sth.","ex":"I felt guilty about forgetting her birthday.","exzh":"我因为忘了她的生日而感到内疚。"}],"note":"guilty 与 blame、regret 是一组“心理负担”词，阅读里常用来表现人物矛盾。"},{"word":"willing","phon":"/ˈwɪlɪŋ/","senses":[{"pos":"adj.","zh":"乐意的；愿意的","col":"be willing to do","ex":"Are you willing to help?","exzh":"你愿意帮忙吗？"}],"note":"反义是 unwilling（不乐意）；注意 willing 不是“将要”，别和 will 混。"},{"word":"unwilling","phon":"/ʌnˈwɪlɪŋ/","senses":[{"pos":"adj.","zh":"不乐意的；不愿意的","col":"be unwilling to do","ex":"He was unwilling to admit his mistake.","exzh":"他不愿意承认自己的错误。"}],"note":"un- + willing；阅读题问态度时，unwilling 常是“消极、抵触”的信号词。"},{"word":"confidence","phon":"/ˈkɒnfɪdəns/","senses":[{"pos":"n.","zh":"自信；信心","col":"build / lose confidence","ex":"Practice builds confidence.","exzh":"练习能建立信心。"}],"note":"形近词 confident（adj. 自信的）。作文里常用 confidence 写心理变化。"},{"word":"accept","phon":"/əkˈsept/","senses":[{"pos":"v.","zh":"接受；认可","col":"accept the fact that / accept an offer","ex":"She slowly accepted the fact.","exzh":"她慢慢接受了这个事实。"}],"note":"与 receive 不同：receive 是“收到”（客观），accept 是“接受”（主观，要点头）。"},{"word":"adapt","phon":"/əˈdæpt/","senses":[{"pos":"v.","zh":"适应；调整","col":"adapt (oneself) to","ex":"He quickly adapted to the new class.","exzh":"他很快适应了新班级。"},{"pos":"v.","zh":"改编","col":"be adapted from","ex":"The film is adapted from a true story.","exzh":"这部电影改编自一个真实故事。"}],"note":"adapt to（适应）vs adopt（采纳、收养），只差一个字母，高考常拿来设陷阱。"},{"word":"panic","phon":"/ˈpænɪk/","senses":[{"pos":"n.","zh":"恐慌","col":"in panic","ex":"The crowd ran in panic.","exzh":"人群惊慌地跑开。"},{"pos":"v.","zh":"惊慌失措","col":"panic about sth.","ex":"Don't panic about the exam.","exzh":"别为考试惊慌。"}],"note":"过去式 panicked（加 k 再 ed），作文里写“慌了”很常用。"},{"word":"grateful","phon":"/ˈɡreɪtfl/","senses":[{"pos":"adj.","zh":"感激的","col":"be grateful to sb. for sth.","ex":"I am grateful to you for your help.","exzh":"我很感激你的帮助。"}],"note":"grateful 是“对人感激”，thankful 更偏“对处境庆幸”；注意介词 for。"},{"word":"afford","phon":"/əˈfɔːd/","senses":[{"pos":"v.","zh":"负担得起（钱/时间）","col":"can / could afford to do","ex":"We can't afford to waste time.","exzh":"我们浪费不起时间。"}],"note":"常与 can't / can hardly 连用；afford 后接 to do，不接 doing。"},{"word":"relief","phon":"/rɪˈliːf/","senses":[{"pos":"n.","zh":"宽慰；减轻","col":"to one's relief / bring relief","ex":"To my relief, the door opened.","exzh":"让我松一口气的是，门开了。"}],"note":"to one's relief（令某人宽慰的是）是读后续写的万能情绪句；动词是 relieve。"},{"word":"quality","phon":"/ˈkwɒləti/","senses":[{"pos":"n.","zh":"质量；品质","col":"the quality of life / water quality","ex":"The quality of the water has improved.","exzh":"水质已经好转了。"},{"pos":"n.","zh":"（人的）品性，素质","col":"personal qualities","ex":"Honesty is his best quality.","exzh":"诚实是他最好的品质。"}],"note":"water / air / life 后面都爱接 quality，环保类阅读高频；复数是 qualities。"},{"word":"protect","phon":"/prəˈtekt/","senses":[{"pos":"v.","zh":"保护","col":"protect sb./sth. from","ex":"Trees protect the soil from wind.","exzh":"树木保护土壤不被风刮走。"}],"note":"protect from 强调“挡住伤害”，名词 protection，形容词 protective。"},{"word":"reduce","phon":"/rɪˈdjuːs/","senses":[{"pos":"v.","zh":"减少；降低","col":"reduce ... by / to","ex":"They reduced the price by 20%.","exzh":"他们把价格降了 20%。"}],"note":"reduce by 是“减少了多少”，reduce to 是“减少到多少”，阅读细节题常设这个坑。"},{"word":"recycle","phon":"/ˌriːˈsaɪkl/","senses":[{"pos":"v.","zh":"回收利用","col":"recycle paper and plastic","ex":"We recycle bottles at home.","exzh":"我们在家里回收利用玻璃瓶。"}],"note":"re-（再）+ cycle（循环）；同族词 recycling（n.）。"},{"word":"ordinary","phon":"/ˈɔːdnri/","senses":[{"pos":"adj.","zh":"普通的；平常的","col":"an ordinary day / out of the ordinary","ex":"It was an ordinary morning.","exzh":"那是一个平平常常的早晨。"}],"note":"与 common（常见）、normal（正常）近义；反义 unusual, extraordinary。"},{"word":"realize","phon":"/ˈriːəlaɪz/","senses":[{"pos":"v.","zh":"意识到；认识到","col":"realize that / come to realize","ex":"I didn't realize how late it was.","exzh":"我没意识到已经这么晚了。"},{"pos":"v.","zh":"实现（目标、梦想）","col":"realize a dream","ex":"She realized her dream at last.","exzh":"她最终实现了自己的梦想。"}],"note":"两个义项都常考：意识到（跟从句）+ 实现（跟名词）。"},{"word":"doubt","phon":"/daʊt/","senses":[{"pos":"v.","zh":"怀疑；不相信","col":"doubt whether / there is no doubt that","ex":"I doubt whether he will come.","exzh":"我怀疑他会不会来。"},{"pos":"n.","zh":"怀疑","col":"without doubt / no doubt","ex":"Without doubt, she is the best.","exzh":"毫无疑问，她是最棒的。"}],"note":"doubt 后面接 whether/if，不接 that（疑问）；no doubt 意为“毫无疑问”。b 不发音。"},{"word":"survive","phon":"/səˈvaɪv/","senses":[{"pos":"v.","zh":"幸存；挺过","col":"survive the winter / survive on","ex":"Few plants survive the cold.","exzh":"很少有植物能熬过这样的严寒。"}],"note":"survive 后直接跟宾语，不加 from；名词 survival，幸存者 survivor。"},{"word":"prevent","phon":"/prɪˈvent/","senses":[{"pos":"v.","zh":"阻止；预防","col":"prevent sb. from doing / prevent sth.","ex":"Rain prevented us from going out.","exzh":"下雨使我们没法出门。"}],"note":"prevent ... from doing 里的 from 在被动中不能省：be prevented from doing。"},{"word":"community","phon":"/kəˈmjuːnəti/","senses":[{"pos":"n.","zh":"社区；群体","col":"the local community / a sense of community","ex":"The whole community helped.","exzh":"整个社区的人都来帮忙了。"}],"note":"指“人”不指“地方”；社区里的人、群体、共同体都用它。"},{"word":"chemical","phon":"/ˈkemɪkl/","senses":[{"pos":"n.","zh":"化学品","col":"harmful chemicals","ex":"The factory poured chemicals into the river.","exzh":"这家工厂把化学品排进了河里。"},{"pos":"adj.","zh":"化学的","col":"chemical waste","ex":"Chemical waste is a serious problem.","exzh":"化学废料是个严重问题。"}],"note":"环保类文章里 chemical(s) 几乎等于“污染源”，看到要有警觉。"},{"word":"effort","phon":"/ˈefət/","senses":[{"pos":"n.","zh":"努力；力气","col":"make an effort to do / spare no effort","ex":"She made an effort to smile.","exzh":"她努力挤出一个微笑。"}],"note":"make an effort（可数，要加 an）；spare no effort（不遗余力）是写作亮点。"},{"word":"technology","phon":"/tekˈnɒlədʒi/","senses":[{"pos":"n.","zh":"技术；科技","col":"modern technology / information technology","ex":"Technology has changed the way we learn.","exzh":"科技改变了我们学习的方式。"}],"note":"不可数，一般不加 a；复数 technologies 指“多种技术”。"},{"word":"device","phon":"/dɪˈvaɪs/","senses":[{"pos":"n.","zh":"装置；设备","col":"a mobile device / electronic devices","ex":"Please turn off all devices.","exzh":"请把所有电子设备都关掉。"}],"note":"与 advice（建议）拼写接近，注意 -ice 是名词后缀；device 是“装置”。"},{"word":"distract","phon":"/dɪˈstrækt/","senses":[{"pos":"v.","zh":"分散（注意力）；使分心","col":"distract sb. from sth.","ex":"The noise distracted me from my work.","exzh":"噪音让我没法专心工作。"}],"note":"名词 distraction；被动 be distracted by（被……吸引走神）。"},{"word":"concentrate","phon":"/ˈkɒnsntreɪt/","senses":[{"pos":"v.","zh":"集中（注意力）","col":"concentrate on","ex":"I can't concentrate on my homework.","exzh":"我没法专心写作业。"}],"note":"名词 concentration；concentrate on = focus on，同义替换常考。"},{"word":"screen","phon":"/skriːn/","senses":[{"pos":"n.","zh":"屏幕","col":"on the screen / screen time","ex":"Too much screen time hurts your eyes.","exzh":"看屏幕时间太长伤眼睛。"},{"pos":"v.","zh":"筛查；放映","col":"screen passengers","ex":"All bags are screened at the gate.","exzh":"所有包在入口处都要过检。"}],"note":"screen time（屏幕使用时间）是近年阅读热词。"},{"word":"independent","phon":"/ˌɪndɪˈpendənt/","senses":[{"pos":"adj.","zh":"独立的；自主的","col":"be independent of / independent thinking","ex":"She is independent of her parents now.","exzh":"她现在不依赖父母了。"}],"note":"be independent of（不依赖），别写成 from；名词 independence。"},{"word":"constantly","phon":"/ˈkɒnstəntli/","senses":[{"pos":"adv.","zh":"不断地；经常地","col":"constantly checking / constantly changing","ex":"He is constantly checking his phone.","exzh":"他不停地看手机。"}],"note":"形容词 constant；写作里替换 always 更高级。"},{"word":"require","phon":"/rɪˈkwaɪə/","senses":[{"pos":"v.","zh":"需要；要求","col":"require sb. to do / be required to do","ex":"The job requires patience.","exzh":"这份工作需要耐心。"}],"note":"require doing = require to be done（需要被做），主动表被动是语法填空常见考点。"},{"word":"responsible","phon":"/rɪˈspɒnsəbl/","senses":[{"pos":"adj.","zh":"负责的；有责任的","col":"be responsible for","ex":"Who is responsible for this?","exzh":"这件事谁负责？"}],"note":"be responsible for 后接名词或 doing；名词 responsibility。"},{"word":"active","phon":"/ˈæktɪv/","senses":[{"pos":"adj.","zh":"积极的；活跃的","col":"take an active part in","ex":"She takes an active part in class.","exzh":"她在课堂上积极参与。"}],"note":"take an active part in（积极参加）是写作高频短语，比 join 更地道。"},{"word":"allow","phon":"/əˈlaʊ/","senses":[{"pos":"v.","zh":"允许；让","col":"allow sb. to do / allow doing","ex":"My parents allow me to stay up late on Friday.","exzh":"我父母允许我周五晚上熬夜。"}],"note":"allow doing（允许做）与 allow sb. to do（允许某人做）都要会。"},{"word":"recover","phon":"/rɪˈkʌvə/","senses":[{"pos":"v.","zh":"恢复；康复","col":"recover from","ex":"It took him a month to recover from the flu.","exzh":"他花了一个月才从流感中恢复过来。"}],"note":"recover from illness 是“病后康复”；名词 recovery。"},{"word":"ignore","phon":"/ɪɡˈnɔː/","senses":[{"pos":"v.","zh":"忽视；不理会","col":"ignore the warning signs","ex":"He ignored the pain and kept running.","exzh":"他没有理会疼痛，继续跑。"}],"note":"ignore 是“故意不理”，don't know 是“不知道”，阅读题区分这两种态度。"},{"word":"habit","phon":"/ˈhæbɪt/","senses":[{"pos":"n.","zh":"习惯","col":"form/develop a habit of doing / break the habit","ex":"Reading before bed is a good habit.","exzh":"睡前读书是个好习惯。"}],"note":"form a habit of doing 中 of 后要接 doing；break the habit 是“改掉习惯”。"},{"word":"regular","phon":"/ˈreɡjələ/","senses":[{"pos":"adj.","zh":"规律的；定期的","col":"regular exercise / on a regular basis","ex":"Regular exercise keeps you healthy.","exzh":"规律的锻炼让你保持健康。"}],"note":"副词 regularly；on a regular basis（定期地）是阅读里的高频短语。"},{"word":"stress","phon":"/stres/","senses":[{"pos":"n.","zh":"压力；紧张","col":"under stress / relieve stress","ex":"Exams put students under great stress.","exzh":"考试让学生压力很大。"},{"pos":"v.","zh":"强调","col":"stress the importance of","ex":"She stressed the importance of sleep.","exzh":"她强调了睡眠的重要性。"}],"note":"stress 既考“压力”也考“强调”，看到 stress that... 就是“强调说”。"},{"word":"pressure","phon":"/ˈpreʃə/","senses":[{"pos":"n.","zh":"压力","col":"under pressure / put pressure on","ex":"He works well under pressure.","exzh":"他在压力下工作得很好。"}],"note":"stress 偏“紧张感”，pressure 偏“外来的压迫”，两者常一起搭配出现。"},{"word":"improve","phon":"/ɪmˈpruːv/","senses":[{"pos":"v.","zh":"改善；提高","col":"improve your English / improve on","ex":"Reading every day will improve your writing.","exzh":"每天阅读会提高你的写作水平。"}],"note":"名词 improvement；improve on 是“在……基础上做得更好”。"},{"word":"avoid","phon":"/əˈvɔɪd/","senses":[{"pos":"v.","zh":"避免；避开","col":"avoid doing sth.","ex":"Try to avoid eating late at night.","exzh":"尽量不要在深夜吃东西。"}],"note":"avoid 后接 doing，不能接 to do，这是语法填空必考点。"},{"word":"consistent","phon":"/kənˈsɪstənt/","senses":[{"pos":"adj.","zh":"一贯的；持续的","col":"be consistent with / consistent effort","ex":"Her work is always consistent.","exzh":"她的工作状态一直很稳定。"}],"note":"consistent effort（持续的努力）比 hard work 更强调“不间断”。"},{"word":"last","phon":"/lɑːst/","senses":[{"pos":"v.","zh":"持续；维持","col":"last for + 时间","ex":"The meeting lasted two hours.","exzh":"会开了两个小时。"},{"pos":"adj.","zh":"最后的；上一个的","col":"last week","ex":"I saw her last week.","exzh":"我上周见过她。"}],"note":"作动词是“持续”，作形容词是“最后的”，阅读题常拿“last”设词义题。"},{"word":"invite","phon":"/ɪnˈvaɪt/","senses":[{"pos":"v.","zh":"邀请；招致","col":"invite sb. to do / be invited to","ex":"He invited me to join the run.","exzh":"他邀请我参加这次跑步。"}],"note":"invite sb. to do（邀请某人做），不是 invite sb. doing；名词 invitation（注意 t 变）。"},{"word":"volunteer","phon":"/ˌvɒlənˈtɪə/","senses":[{"pos":"n.","zh":"志愿者","col":"a volunteer for","ex":"She is a volunteer at the hospital.","exzh":"她是医院的志愿者。"},{"pos":"v.","zh":"自愿做","col":"volunteer to do","ex":"He volunteered to clean the room.","exzh":"他自愿去打扫房间。"}],"note":"动词用法 volunteer to do 是语法填空常考点；形容词 voluntary（自愿的）。"},{"word":"offer","phon":"/ˈɒfə/","senses":[{"pos":"v.","zh":"提供；主动提出","col":"offer sb. sth. / offer to do","ex":"She offered me a seat.","exzh":"她给我让了个座。"},{"pos":"n.","zh":"提议；报价","col":"make an offer","ex":"They made me an offer I could not refuse.","exzh":"他们开出的条件我无法拒绝。"}],"note":"offer to do（主动提出做）≠ provide sb. with（提供），后者更中性。"},{"word":"treasure","phon":"/ˈtreʒə/","senses":[{"pos":"v.","zh":"珍视；珍惜","col":"treasure the memory","ex":"I treasure the time we spent together.","exzh":"我珍惜我们一起度过的时间。"},{"pos":"n.","zh":"珍宝","col":"a national treasure","ex":"The old bridge is a local treasure.","exzh":"这座老桥是当地的珍宝。"}],"note":"作动词“珍惜”比 value 更有感情色彩，读后续写很好用。"},{"word":"expect","phon":"/ɪkˈspekt/","senses":[{"pos":"v.","zh":"预料；期待","col":"expect to do / expect sb. to do / as expected","ex":"We expect to finish by Friday.","exzh":"我们预计周五前完成。"}],"note":"expect sb. to do（指望某人做）；be expected to（应该）也很常考。"},{"word":"share","phon":"/ʃeə/","senses":[{"pos":"v.","zh":"分享；分担","col":"share sth. with sb.","ex":"She shared her lunch with me.","exzh":"她把午饭分给我吃。"},{"pos":"n.","zh":"份额；股份","col":"a share of","ex":"Everyone did a share of the work.","exzh":"每个人都分担了一份工作。"}],"note":"share with（与……分享）和 share in（共享）介词不同。"},{"word":"promise","phon":"/ˈprɒmɪs/","senses":[{"pos":"v.","zh":"承诺；答应","col":"promise to do / promise that","ex":"He promised to come back.","exzh":"他答应会回来。"},{"pos":"n.","zh":"诺言；希望","col":"keep/break a promise","ex":"She kept her promise.","exzh":"她信守了自己的诺言。"}],"note":"keep a promise（守诺）vs break a promise（食言），写作对比句常用。"},{"word":"situation","phon":"/ˌsɪtʃuˈeɪʃn/","senses":[{"pos":"n.","zh":"情况；处境","col":"in this situation / deal with the situation","ex":"In this situation, silence was the best answer.","exzh":"在这种情况下，沉默是最好的回答。"}],"note":"可数名词，前面要加 a/the；比 condition 更强调“处境的整体”。"},{"word":"convenient","phon":"/kənˈviːniənt/","senses":[{"pos":"adj.","zh":"方便的","col":"it is convenient for sb. to do","ex":"Is it convenient for you to meet at six?","exzh":"六点见面对你方便吗？"}],"note":"主语不能是人：不说 I am convenient，要说 It is convenient for me to..."},{"word":"although","phon":"/ɔːlˈðəʊ/","senses":[{"pos":"conj.","zh":"虽然；尽管","col":"although + 从句","ex":"Although it was raining, we went out.","exzh":"虽然下着雨，我们还是出门了。"}],"note":"although 不能和 but 连用，这是高考改错/语填的经典考点。"},{"word":"manage","phon":"/ˈmænɪdʒ/","senses":[{"pos":"v.","zh":"设法做到；管理","col":"manage to do / manage a company","ex":"She managed to finish on time.","exzh":"她设法按时完成了。"}],"note":"manage to do（设法做成，含“不容易”），与 try to do（尝试，未必成功）不同。"}],"passages":[{"id":1,"title":"The Boy Who Built a Bridge","level":"B 篇难度 · 记叙","words":338,"min":6,"tags":["励志","坚持"],"targets":["admire","apology","approach","argue","attach","benefit","charming","concern","confident","contain","convince","deserve"],"paras":["Lin was a quiet boy in Class 3. When asked what he wanted to do after high school, he always said, \"Build bridges.\" His classmates laughed, because Lin's English was the worst in the class. He could read the word bridge, but he could not say anything about it. Every exam brought the same result: a low score and a red mark.","One evening, his teacher asked him to stay. \"I admire your dream,\" she said, \"but a bridge needs a plan, and a plan needs language. What is your approach?\" Lin had no answer. He had tried many things, but nothing worked, and he had even argued with his parents that English was useless for an engineer.","The next morning, Lin found a note on his desk. It was a short apology from a classmate who had laughed at him. Attached to the note was a small card with ten new words. \"Learn these,\" the note said. \"Ten a day. That is all.\" Lin was not sure it would work, but he was tired of being afraid, so he decided to try.","The first week was hard, and his biggest concern was time. The words did not stay in his head. He wrote them on his hand, on his notebook, and on a piece of paper attached to his desk. Then something changed. He began to meet the words in small stories his teacher gave him. Each story was short, and each one contained a few new words that came back in a different sentence.","By the end of the month, Lin felt confident for the first time. \"Reading brings real benefits,\" he told his friend. \"You meet a word again and again, and one day it is yours.\" His friend laughed, but not in a bad way. \"You sound charming,\" she said. Lin smiled. He could not convince everyone that a quiet boy could become an engineer, but he no longer needed to. He deserved a chance to try, and now he was giving himself one."],"ctx":{"admire":"\"I admire your dream,\" she said, \"but a bridge needs a plan, and a plan needs language.","apology":"It was a short apology from a classmate who had laughed at him.","approach":"What is your approach?","argue":"he had even argued with his parents that English was useless for an engineer.","attach":"Attached to the note was a small card with ten new words.","benefit":"\"Reading brings real benefits,\" he told his friend.","charming":"\"You sound charming,\" she said.","concern":"The first week was hard, and his biggest concern was time.","confident":"By the end of the month, Lin felt confident for the first time.","contain":"each one contained a few new words that came back in a different sentence.","convince":"He could not convince everyone that a quiet boy could become an engineer","deserve":"He deserved a chance to try, and now he was giving himself one."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["How Lin gave up his dream.","How Lin found a way to study English for his dream.","Why Lin's classmates laughed at him.","How to build a real bridge."],"answer":1,"exp":"文章写林想当桥梁工程师、英语却很差，最后靠“每天十词+小故事反复读”的方法慢慢变好。","src":"He could not convince everyone that a quiet boy could become an engineer, but he no longer needed to."},{"type":"细节","q":"What was on the card that Lin found?","options":["His exam score.","A short apology and ten new words.","A picture of a bridge.","His teacher's plan for the class."],"answer":1,"exp":"第三段：卡片是一封简短的道歉，上面“附”了十个新词。","src":"It was a short apology from a classmate who had laughed at him. Attached to the note was a small card with ten new words."},{"type":"推理","q":"Why did the method start to work in the second week?","options":["Lin studied ten hours a day.","Lin's teacher gave him answers.","The words kept coming back in short stories.","His parents helped him."],"answer":2,"exp":"第四段：他“开始在小故事里遇见这些词”，同一批词在不同句子里反复出现。","src":"each one contained a few new words that came back in a different sentence"},{"type":"词义猜测","q":"What does \"it is yours\" mean in Paragraph 5?","options":["You own the book.","You have really learned the word.","Someone gave the word to you.","You can sell the word."],"answer":1,"exp":"前一句说“你一遍遍遇见一个词”，所以“它就是你的了”指真正掌握、内化。","src":"You meet a word again and again, and one day it is yours."}],"ctxzh":{"admire":"“我佩服你的梦想，”她说，“但造桥需要计划，而计划需要语言。”","apology":"那是一个曾嘲笑过他的同学一句简短的道歉。","approach":"你的方法是什么？","argue":"他甚至和父母争辩过，说英语对一个工程师毫无用处。","attach":"纸条上附着一张写着十个新单词的小卡片。","benefit":"“阅读能带来实实在在的好处，”他对朋友说。","charming":"“你说话挺迷人的，”她说。","concern":"第一周很难熬，他最大的顾虑是时间。","confident":"到月底，林第一次感到自信。","contain":"每一篇都包含几个新词，这些词会在不同的句子里再次出现。","convince":"他无法让所有人相信，一个安静的男孩也能成为工程师。","deserve":"他值得一个尝试的机会，而现在他正在给自己这个机会。"}},{"id":11,"title":"The Choice at the Crossroads","level":"B 篇难度 · 记叙","words":396,"min":7,"tags":["成长","家庭","选择"],"targets":["choice","balance","guilty","willing","unwilling","confidence","accept","adapt","panic","grateful","afford","relief"],"paras":["Chen had five days. In five days her mid-term exams would begin, and in five days her grandmother would have surgery in a hospital two hours away. Her parents were both working. Someone had to go and stay with her grandmother, and that someone was her, the only child still at home.","On the first evening, Chen sat at her desk and looked at her books without reading a word. She had no choice. Or did she? Staying home might cost her grandmother a familiar face in the morning. Going to the hospital might cost her the whole week of studying. It was impossible to balance the two, and she felt guilty for even thinking about her own exams.","The next morning she told her teacher. He did not offer a plan. Instead he asked her one question: \"Which choice would you be able to live with?\" Chen thought about it all through the second class. She was unwilling to tell her parents that she felt worried, because they were tired enough. She was willing to miss a few classes, but not a whole week.","So she made a plan. She would go to the hospital for two afternoons, not five days. She packed her books into one bag. On the train she read; in the waiting room she read; at night, after her grandmother fell asleep, she read by a small lamp. The plan was not perfect, but it held.","She did panic once. On Wednesday, she opened a practice paper and discovered that she could not remember how to do half of it. She sat in the hospital corridor and wanted to cry. Then she told herself: the paper was hard for everyone, and one bad day proves nothing. She closed the book, took a short walk, and came back to it. By Thursday her confidence was back.","By the last exam she was tired but steady. She could not afford to do everything, and she had stopped trying. She had learned to adapt to a week that was not hers, and she had learned to accept that some things would simply be unfinished. When the marks came out, they were not great, but they were enough, and for the first time in a week she felt grateful rather than guilty. Her grandmother was fine. That was the relief she had been waiting for."],"ctx":{"choice":"She had no choice. Or did she?","balance":"It was impossible to balance the two, and she felt guilty for even thinking about her own exams.","guilty":"It was impossible to balance the two, and she felt guilty for even thinking about her own exams.","willing":"She was willing to miss a few classes, but not a whole week.","unwilling":"She was unwilling to tell her parents that she felt worried, because they were tired enough.","confidence":"By Thursday her confidence was back.","accept":"She had learned to adapt to a week that was not hers, and she had learned to accept that some things would simply be unfinished.","adapt":"She had learned to adapt to a week that was not hers, and she had learned to accept that some things would simply be unfinished.","panic":"She did panic once.","grateful":"When the marks came out, they were not great, but they were enough, and for the first time in a week she felt grateful rather than guilty.","afford":"She could not afford to do everything, and she had stopped trying.","relief":"Her grandmother was fine. That was the relief she had been waiting for."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["How Chen learned to make a hard decision.","Why Chen was late for her exams.","How to take care of a sick grandmother.","Why Chen's parents could not help her."],"answer":0,"exp":"全文围绕她在“照顾奶奶”和“复习考试”之间的选择展开，以及她如何确定并执行自己的选择。","src":"Which choice would you be able to live with?"},{"type":"细节","q":"How did Chen deal with the time problem?","options":["She asked her teacher to give her more time.","She studied wherever she went and shortened the visit.","She gave up studying for the whole week.","She asked her parents to come home to work."],"answer":1,"exp":"第四段：她把探望压缩成两个下午，并在火车上、候诊室、夜里都读。","src":"On the train she read; in the waiting room she read; at night, after her grandmother fell asleep, she read by a small lamp."},{"type":"推理","q":"What does the teacher's question in Paragraph 3 suggest about him?","options":["He wanted Chen to stay at home.","He wanted her to fix her own problem properly.","He did not care about her exams.","He thought her grandmother was fine."],"answer":1,"exp":"老师没有直接给方案，而是让她自己判断，提示他有意让她独立解决问题。","src":"He did not offer a plan. Instead he asked her one question"},{"type":"词义猜测","q":"What does the underlined word \"held\" (in Paragraph 4) probably mean?","options":["Lasted without breaking.","Was held by someone.","Stopped suddenly.","Became harder."],"answer":0,"exp":"“The plan was not perfect, but it held.” 与不完美相对，意思是这个计划没有垮掉、坚持住了。","src":"The plan was not perfect, but it held."}],"ctxzh":{"choice":"她别无选择。真的是这样吗？","balance":"两者根本没法兼顾，她甚至因为想到自己的考试而感到内疚。","guilty":"两者根本没法兼顾，她甚至因为想到自己的考试而感到内疚。","willing":"她愿意缺几节课，但不肯缺整整一周。","unwilling":"她不愿告诉父母自己很焦虑，因为他们已经够累了。","confidence":"到星期四，她的信心回来了。","accept":"她学会了适应这不属于自己的一周，也学会了接受有些事就是做不完。","adapt":"她学会了适应这不属于自己的一周，也学会了接受有些事就是做不完。","panic":"她确实慌过一次。","grateful":"成绩出来时不算好，但已经够了；一周以来她第一次感到的是感激而不是内疚。","afford":"她没有精力把所有事都做完，也就不再强求了。","relief":"奶奶没事。那就是她一直在等的宽慰。"}},{"id":12,"title":"The River That Came Back","level":"B 篇难度 · 记叙/环保","words":301,"min":5,"tags":["环境","社区","坚持"],"targets":["quality","protect","reduce","recycle","ordinary","realize","doubt","survive","prevent","community","chemical","effort"],"paras":["Old Wu had fished in the river for forty years. When he was a boy, the water was so clear that you could see the stones at the bottom. Now the stones were covered with a thick green skin, and the water smelled bad in summer. The quality of the water had fallen so far that even the fish had left.","It was not an ordinary problem. A factory upstream had poured chemicals into the river for years, and the town had let it happen. Wu had complained, but people told him to stop making trouble. He had almost stopped believing that anything could be done.","Then a group of students came to the town. They tested the water, wrote a report, and showed it at a community meeting. They did not shout. They simply asked: can we still protect this river? Can we reduce what we pour into it, and recycle what we can?","Wu doubted it at first. \"You are young,\" he said. \"You will be gone next year.\" One of the students answered, \"Then teach us what you know before we go.\" That answer changed his mind.","The effort was small at first. Some families started to bring their rubbish to a recycling point. The factory was asked to stop using one harmful chemical. Nobody expected the river to survive such damage, yet by the second summer the green skin was thinner, and small fish had come back.","Wu still goes down to the water every morning. He does not know if the river will ever be what it was. But he has realized something: a community that tries to prevent one more bad year is already different from a town that does nothing. \"It is not the water that came back first,\" he says. \"It is us.\""],"ctx":{"quality":"The quality of the water had fallen so far that even the fish had left.","protect":"They simply asked: can we still protect this river?","reduce":"Can we reduce what we pour into it, and recycle what we can?","recycle":"Can we reduce what we pour into it, and recycle what we can?","ordinary":"It was not an ordinary problem.","realize":"But he has realized something: a community that tries to prevent one more bad year is already different from a town that does nothing.","doubt":"Wu doubted it at first.","survive":"Nobody expected the river to survive such damage, yet by the second summer the green skin was thinner, and small fish had come back.","prevent":"a community that tries to prevent one more bad year","community":"They tested the water, wrote a report, and showed it at a community meeting.","chemical":"The factory was asked to stop using one harmful chemical.","effort":"The effort was small at first."},"questions":[{"type":"主旨","q":"What is the main idea of the passage?","options":["A river can be saved only by the government.","Small, steady efforts by a community can bring a damaged river back.","Old Wu was wrong to complain about the factory.","Students should not test river water."],"answer":1,"exp":"文章主体是社区从小事做起——回收、减少化学品——两年后河里又有了鱼，结尾点明“改变的是我们”。","src":"a community that tries to prevent one more bad year is already different from a town that does nothing"},{"type":"细节","q":"What first made Old Wu change his mind?","options":["The factory closed down.","The students asked him to teach them.","The fish came back.","The town paid him money."],"answer":1,"exp":"第四段：学生说“那你走之前教教我们”，这句话打动了他。","src":"\"Then teach us what you know before we go.\" That answer changed his mind."},{"type":"推理","q":"Why did the students show their report at a community meeting?","options":["To prove the river was already dead.","To get the town to act together, not just to complain.","To become famous.","To blame Old Wu."],"answer":1,"exp":"他们“没有喊叫”，只是提问，目的是让整个社区一起行动，而不是单纯指责。","src":"They did not shout. They simply asked"},{"type":"词义猜测","q":"What does Old Wu mean by \"It is us\" in the last paragraph?","options":["The river is now owned by the town.","What came back first was the community's courage to act.","Old Wu is the one who cleaned the river.","The students stayed in the town."],"answer":1,"exp":"前一句说“不是水先回来”，因此“先回来”的是人——社区改变的态度与行动。","src":"\"It is not the water that came back first,\" he says. \"It is us.\""}],"ctxzh":{"quality":"水质已经差到连鱼都离开了。","protect":"他们只是问：我们还能保护这条河吗？","reduce":"我们能不能少往河里排一点，能回收的就回收？","recycle":"我们能不能少往河里排一点，能回收的就回收？","ordinary":"这不是一个普通的问题。","realize":"但他已经意识到一件事：一个努力避免再糟糕一年的社区，已经和一个什么都不做的小镇不一样了。","doubt":"吴一开始也对此表示怀疑。","survive":"没人指望这条河能挺过这样的破坏，但到第二个夏天，那层绿色的浮沫变薄了，小鱼也回来了。","prevent":"一个努力避免再糟糕一年的社区","community":"他们检测水质，写了一份报告，在社区会议上展示。","chemical":"这家工厂被要求停止使用一种有害化学品。","effort":"起初的努力很小。"}},{"id":13,"title":"A Lesson Without a Screen","level":"C 篇难度 · 议论/校园","words":365,"min":7,"tags":["科技","教育","专注"],"targets":["technology","device","distract","convince","concentrate","screen","independent","constantly","require","responsible","active","allow"],"paras":["When the new head teacher arrived, she found a problem that no one wanted to talk about. Students were not lazy. They were not even bored. They were simply unable to stay with one thing for more than a few minutes. In class, phones were put away, but their owners still looked down, as if a screen were still in front of them.","Her first idea was simple: take the devices away. She told the students that, for two hours every morning, no phone would be allowed in the classroom. Some parents were angry. They said their children needed to be reachable, and that young people are constantly checking their phones anyway. A few students were not convinced, either. \"We can concentrate,\" one of them said. \"We just choose not to.\"","The head teacher did not argue. Instead she asked the class to try a test. On Monday, they would study as usual. On Tuesday, they would study with no device within reach. At the end of each day, they would write down how much they remembered.","The result surprised almost everyone. On Tuesday, the same students finished more work in half the time. \"It was not that I worked faster,\" one girl wrote. \"It was that I did not have to start again every time something distracted me.\" She had not realized how often she had been looking at her phone until it was not there.","This does not mean that technology is the enemy. The head teacher is the first to say that a good video can teach in five minutes what a book takes an hour to explain. But using a tool requires knowing when to put it down. A student who depends on the screen to think will find it hard to think independently, and a school that never teaches this lesson is not doing its job.","Now the school has a rule, but it is not just a rule. Students run a weekly discussion about when devices help and when they steal time. The head teacher watches them argue, take notes, and decide together. Being responsible for their own attention, she says, is the most active lesson they can learn."],"ctx":{"technology":"This does not mean that technology is the enemy.","device":"Her first idea was simple: take the devices away.","distract":"It was that I did not have to start again every time something distracted me.","convince":"A few students were not convinced, either.","concentrate":"\"We can concentrate,\" one of them said.","screen":"In class, phones were put away, but their owners still looked down, as if a screen were still in front of them.","independent":"A student who depends on the screen to think will find it hard to think independently","constantly":"They said their children needed to be reachable, and that young people are constantly checking their phones anyway.","require":"But using a tool requires knowing when to put it down.","responsible":"Being responsible for their own attention, she says, is the most active lesson they can learn.","active":"Being responsible for their own attention, she says, is the most active lesson they can learn.","allow":"She told the students that, for two hours every morning, no phone would be allowed in the classroom."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["Why phones should be completely banned in schools.","How a school helped students see when technology helps and when it steals time.","Why the head teacher was unpopular.","How to make videos for class."],"answer":1,"exp":"文章既不否定科技（第五段），也不只讲禁令，重点是学生通过对比学会管理注意力。","src":"using a tool requires knowing when to put it down"},{"type":"细节","q":"What happened on the Tuesday test?","options":["Students finished more work in less time.","Students refused to study.","Phones were banned forever.","Parents took the devices home."],"answer":0,"exp":"第四段：没有设备在眼前时，同样的学生用一半时间完成了更多任务。","src":"On Tuesday, the same students finished more work in half the time."},{"type":"推理","q":"What can we infer from the girl's words in Paragraph 4?","options":["She worked faster because the work was easy.","She kept losing her place because of small distractions.","She wanted her phone back.","She did not like the head teacher."],"answer":1,"exp":"她说\"不是因为我更快，而是每次被分心后不用重新开始\"，说明频繁分心打断了她。","src":"\"It was that I did not have to start again every time something distracted me.\""},{"type":"作者态度","q":"What is the head teacher's attitude toward technology in class?","options":["It is always harmful.","It should be used, but with control.","It should replace books.","It is not worth discussing."],"answer":1,"exp":"第五段明确说科技不是敌人、好视频也能教东西，但“用工具需要知道何时放下”。","src":"This does not mean that technology is the enemy."}],"ctxzh":{"technology":"这并不意味着技术就是敌人。","device":"她的第一个想法很简单：把这些设备都收走。","distract":"而是我不必每次被什么分心就得从头再来。","convince":"有几个学生也并没有被说服。","concentrate":"“我们能专心，”其中一个说。","screen":"上课时手机被收了起来，但机主们仍旧低着头，好像面前还有一块屏幕。","independent":"一个依赖屏幕来思考的学生，会觉得独立思考很难。","constantly":"他们说孩子需要随时能被联系到，而且年轻人本来就不停地在看手机。","require":"但使用一件工具，需要知道什么时候把它放下。","responsible":"她说，为自己的注意力负责，是他们能学到的最积极的一课。","active":"她说，为自己的注意力负责，是他们能学到的最积极的一课。","allow":"她告诉学生，每天早上有两个小时，教室里不允许出现手机。"}},{"id":14,"title":"The Month Without a Phone","level":"B 篇难度 · 说明+记叙","words":343,"min":6,"tags":["健康","习惯","自律"],"targets":["recover","ignore","habit","regular","stress","pressure","improve","avoid","consistent","last","effort","invite"],"paras":["Lin was tired all the time, and he could not explain why. He went to bed at one in the morning, got up at six, and ate whatever was quick. His teacher told him to see a doctor, but the doctor found nothing wrong. \"You are not ill,\" she said. \"You are just not giving your body a chance to recover.\"","Lin did not believe her at first. He ignored the advice for another two weeks. Then he failed a maths test that he had studied hard for, and for the first time he began to worry. If he was studying more than anyone in his class and still doing badly, something else had to be wrong.","His cousin, who was a nurse, asked him one question: what was the last habit he had changed on purpose? Lin could not answer. He had never thought about his life that way. He had always believed that success came from working harder, not from sleeping regular hours.","His cousin did not argue. She simply invited him to try a small plan for two weeks: lights out by eleven, a proper breakfast, and twenty minutes of exercise every day. \"Nothing difficult,\" she said. \"Just keep it long enough to see whether it works.\"","The first three days were hard, and Lin almost stopped. On the fourth morning, something small happened: he understood a passage in his English book the first time he read it. It was not a great change, but it was a real one. After a week he could concentrate better, and the stress he had carried for months began to lift.","The plan lasted two weeks, and then became a habit. What Lin learned was not that sleep makes you clever. He learned that a consistent effort, even a small one, can improve a life that feels stuck. The pressure of exams did not disappear, but he was no longer fighting it with a tired body. The best part, he says, is that he now knows how to avoid the same mistake again."],"ctx":{"recover":"\"You are just not giving your body a chance to recover.\"","ignore":"He ignored the advice for another two weeks.","habit":"what was the last habit he had changed on purpose?","regular":"He had always believed that success came from working harder, not from sleeping regular hours.","stress":"After a week he could concentrate better, and the stress he had carried for months began to lift.","pressure":"The pressure of exams did not disappear, but he was no longer fighting it with a tired body.","improve":"He learned that a consistent effort, even a small one, can improve a life that feels stuck.","avoid":"he now knows how to avoid the same mistake again.","consistent":"He learned that a consistent effort, even a small one, can improve a life that feels stuck.","last":"The plan lasted two weeks, and then became a habit.","effort":"He learned that a consistent effort, even a small one, can improve a life that feels stuck.","invite":"She simply invited him to try a small plan for two weeks"},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["Why exams cause too much pressure.","How small regular changes in daily life helped Lin study better.","How to pass a maths test.","Why sleeping less is necessary in senior high."],"answer":1,"exp":"全文讲的是他通过早睡、吃早饭、运动这些日常小改变，学习状态反而变好。","src":"a consistent effort, even a small one, can improve a life that feels stuck"},{"type":"细节","q":"Why did Lin begin to worry?","options":["The doctor said he was ill.","He studied hard but failed a maths test.","His cousin stopped talking to him.","He could not sleep at all."],"answer":1,"exp":"第二段：他认真复习却考砸了数学，才意识到问题不在“不够努力”。","src":"he failed a maths test that he had studied hard for"},{"type":"推理","q":"What does the sentence \"he understood a passage ... the first time he read it\" suggest?","options":["The passage was easy.","His improved sleep and exercise had begun to affect his study.","He had read the passage before.","His teacher helped him."],"answer":1,"exp":"这一天的小变化正好发生在改变作息三天后，是作者用来证明“身体状态影响学习”的证据。","src":"On the fourth morning, something small happened"},{"type":"词义猜测","q":"What does \"lift\" most probably mean in Paragraph 5?","options":["Become lighter in weight.","Go away or ease.","Go up higher.","Move something else."],"answer":1,"exp":"“the stress ... began to lift”指压力“减轻、消散”，与前面压力持续数月形成对照。","src":"the stress he had carried for months began to lift"}],"ctxzh":{"recover":"“你只是没给身体一个恢复的机会。”","ignore":"他又把这条建议放在一边，过了两周才理。","habit":"他上一个主动改掉的习惯是什么？","regular":"他一直相信成功来自更拼命，而不是按时睡觉。","stress":"一周后他更能集中注意力了，几个月来一直压着他的那份紧张开始消退。","pressure":"考试的压力并没有消失，但他不再用疲惫的身体去硬扛。","improve":"他明白了，持续的努力哪怕很小，也能改善一种感觉卡住的生活。","avoid":"他现在知道怎么避免再犯同样的错。","consistent":"他明白了，持续的努力哪怕很小，也能改善一种感觉卡住的生活。","last":"这个计划持续了两周，然后就变成了习惯。","effort":"他明白了，持续的努力哪怕很小，也能改善一种感觉卡住的生活。","invite":"她只是邀请他试一个小计划，为期两周。"}},{"id":15,"title":"The Room With Two Extra Beds","level":"B 篇难度 · 记叙/公益","words":320,"min":6,"tags":["公益","社区","温暖"],"targets":["volunteer","community","offer","treasure","expect","share","promise","situation","convenient","although","manage","willing"],"paras":["The old building on Green Street used to be a small hotel. Now it has twelve rooms, a shared kitchen, and a sign by the door that says: FREE FOR FAMILIES WITH A CHILD IN HOSPITAL.","The group that runs it was started three years ago by people from the local community. Zhao, a retired nurse, and her daughter, a college student, were the first volunteers. Zhao had once spent a month in a strange city while her own son was ill. She remembered how lonely it felt to be near a hospital and have nowhere to sit down.","\"I could not offer money,\" she says. \"But I could offer a bed and a hot meal.\" The daughter put a notice online, and within a week, three families came. Now about twelve families stay there each month, for a week or longer.","The work is not easy. Some guests are angry; some cry; some do not want to talk. \"Everyone has their own situation,\" Zhao says. \"We do not ask. We just make sure the room is warm and the food is there.\"","Although the building is old, it has almost everything a family needs, and it is convenient for the hospital: ten minutes on foot. Volunteers share the cleaning and the cooking. Nobody is paid, and nobody expects to be. \"People think we are very kind,\" the daughter says. \"But honestly, we get more than we give.\"","What Zhao treasures most are the small moments. A child who was too weak to speak waves from the window. A father who has not slept for a week finally sleeps. Last winter, a family that had left a month earlier came back with two boxes of fruit and a promise: \"When our situation is better, we will come and volunteer with you.\"","Zhao is willing to wait. \"We manage this place one day at a time,\" she says. \"That is enough.\""],"ctx":{"volunteer":"Zhao, a retired nurse, and her daughter, a college student, were the first volunteers.","community":"The group that runs it was started three years ago by people from the local community.","offer":"\"I could not offer money,\" she says. \"But I could offer a bed and a hot meal.\"","treasure":"What Zhao treasures most are the small moments.","expect":"Nobody is paid, and nobody expects to be.","share":"Volunteers share the cleaning and the cooking.","promise":"came back with two boxes of fruit and a promise","situation":"\"Everyone has their own situation,\" Zhao says.","convenient":"it is convenient for the hospital: ten minutes on foot.","although":"Although the building is old, it has almost everything a family needs","manage":"\"We manage this place one day at a time,\" she says.","willing":"Zhao is willing to wait."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["How a free home for families near a hospital started and works.","How to become a nurse.","Why old buildings should be rebuilt.","How hospitals treat children."],"answer":0,"exp":"全文介绍这栋“医院旁的免费住处”的由来、运转方式，以及给住的人带来的安慰。","src":"FREE FOR FAMILIES WITH A CHILD IN HOSPITAL"},{"type":"细节","q":"Why did Zhao start this place?","options":["She wanted to make money from the old hotel.","She remembered her own lonely month near a hospital.","The government asked her to.","She had nowhere else to live."],"answer":1,"exp":"第二段：她曾在一个陌生城市陪儿子看病一个月，记得那种孤独和无处可坐的感觉。","src":"She remembered how lonely it felt to be near a hospital and have nowhere to sit down."},{"type":"推理","q":"What does the daughter mean by \"we get more than we give\"?","options":["They receive more money than they spend.","The reward of helping others is greater than what they give.","They get free food from the families.","They work less than other people."],"answer":1,"exp":"前文说“人们觉得我们很善良”，女儿说其实收获更多——指精神上的回报，而非金钱。","src":"But honestly, we get more than we give."},{"type":"词义猜测","q":"What does the word \"wait\" in the last paragraph refer to?","options":["Waiting for the families to pay.","Waiting for those helped to come back and help others.","Waiting for the building to be sold.","Waiting for her daughter to graduate."],"answer":1,"exp":"上一段刚写到离开的家庭承诺“以后回来当志愿者”，所以“愿意等”是等他们回来接力。","src":"When our situation is better, we will come and volunteer with you."}],"ctxzh":{"volunteer":"赵是一名退休护士，她的女儿是个大学生，她们是最早的志愿者。","community":"运营这个机构的团队，是三年前由当地社区的人发起成立的。","offer":"“我拿不出钱，”她说，“但我能提供一张床和一顿热饭。”","treasure":"赵最珍惜的是那些细小的瞬间。","expect":"没有人拿工资，也没有人指望拿。","share":"志愿者们分担打扫和做饭的活。","promise":"回来时带着两箱水果和一个承诺","situation":"“每个人都有自己的处境，”赵说。","convenient":"对医院来说这很方便：步行十分钟就到。","although":"虽然这栋楼很旧，但一个家庭需要的东西它几乎都有。","manage":"“我们就一天一天地把这个地方撑下去，”她说。","willing":"赵愿意等。"}}]}}</script>
<script>
(function(){
"use strict";
var DATA=(function(){try{return JSON.parse(document.getElementById('data').textContent||'{}')}catch(e){return {}}})().DATA||{words:[],passages:[]};
var LS='cijing.progress.v1';
var LS_OLD='cjbao.progress.v1';
var DEF={words:{},passages:{},settings:{font:'sans',dailyNew:12}};
var IV=[0,1,2,4,7,15,30,45,90];
if(typeof Object.assign!=='function')Object.assign=function(t){for(var i=1;i<arguments.length;i++){var s=arguments[i]||{};for(var k in s)if(Object.prototype.hasOwnProperty.call(s,k))t[k]=s[k]}return t};
if(typeof NodeList!=='undefined'&&NodeList.prototype&&!NodeList.prototype.forEach)NodeList.prototype.forEach=Array.prototype.forEach;
var MEM=null;
var STORE=(function(){
  try{localStorage.setItem('cijing.p','1');localStorage.removeItem('cijing.p');return 'local'}catch(e){}
  try{sessionStorage.setItem('cijing.p','1');sessionStorage.removeItem('cijing.p');return 'session'}catch(e){}
  return 'memory';
})();
/* 旧版本进度用的是 cjbao.* 前缀：先搬过来，免得升级后看起来“进度丢了” */
(function(){
  try{
    var box=STORE==='local'?localStorage:STORE==='session'?sessionStorage:null;
    if(!box)return;
    var old=box.getItem(LS_OLD);
    if(old){if(!box.getItem(LS))box.setItem(LS,old);box.removeItem(LS_OLD)}
  }catch(e){}
})();
var S=load();
function pad(n){return String(n).length<2?'0'+n:String(n)}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmt(new Date())}
function shift(n){var d=new Date();d.setDate(d.getDate()+n);return fmt(d)}
function rawGet(){try{if(STORE==='local')return localStorage.getItem(LS);if(STORE==='session')return sessionStorage.getItem(LS)}catch(e){}return MEM}
function rawSet(v){try{if(STORE==='local'){localStorage.setItem(LS,v);return 'local'}if(STORE==='session'){sessionStorage.setItem(LS,v);return 'session'}}catch(e){}MEM=v;return 'memory'}
function load(){try{var r=JSON.parse(rawGet());if(r&&r.words)return merge(r)}catch(e){}return merge({})}
function save(){rawSet(JSON.stringify(S))}
function merge(r){return {words:r.words||{},passages:r.passages||{},settings:Object.assign({},DEF.settings,r.settings||{})}}
function wp(w){if(!S.words[w])S.words[w]={lv:0,next:shift(-1),seen:0,ok:0,bad:0,last:'',lastDate:'',first:today()};return S.words[w]}
function rate(w,level){
  var st=wp(w),lv;
  if(level==='y')lv=1;else if(level==='v')lv=Math.max(1,st.lv);else lv=Math.min(IV.length-1,st.lv+1);
  st.lv=lv;st.seen=(st.seen||0)+1;
  if(level==='g')st.ok=(st.ok||0)+1;else st.bad=(st.bad||0)+1;
  st.last=level==='y'?'bad':level==='v'?'vague':'good';
  st.lastDate=today();
  st.next=shift(IV[Math.min(lv,IV.length-1)]);
  save();queueSync();
}
function due(w){var st=S.words[w];return !!st&&(st.next||'2000-01-01')<=today()}
function isNew(w){return !S.words[w]}
function counts(){
  var total=DATA.words.length,seen=0,duec=0;
  for(var i=0;i<DATA.words.length;i++){var w=DATA.words[i].word;if(S.words[w]){seen++;if(due(w))duec++}}
  return {total:total,seen:seen,due:duec,passages:DATA.passages.length};
}
function dueList(){
  var out=[];
  DATA.words.forEach(function(x){var st=S.words[x.word];if(st&&due(x.word))out.push({w:x.word,p:st.last==='bad'?0:st.last==='vague'?1:2})});
  out.sort(function(a,b){return a.p-b.p});
  return out.map(function(x){return x.w});
}
function pickBatch(n){
  var out=dueList();
  DATA.words.forEach(function(x){if(out.length<n&&isNew(x.word))out.push(x.word)});
  return out.slice(0,n);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var findWord=function(w){for(var i=0;i<DATA.words.length;i++)if(DATA.words[i].word===w)return DATA.words[i];return null};
var findPassage=function(id){for(var i=0;i<DATA.passages.length;i++)if(DATA.passages[i].id===id)return DATA.passages[i];return null};
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},1900)}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('backdrop').classList.add('show');syncBack()}
function closeSheet(){document.getElementById('backdrop').classList.remove('show');syncBack()}
function sheetOn(){try{return document.getElementById('backdrop').classList.contains('show')}catch(e){return false}}
function bindBackdrop(){
  var bd=document.getElementById('backdrop');
  if(bd&&!bd.onclick)bd.onclick=function(e){if(e&&e.target===bd)closeSheet()};
}
function syncBack(){
  if(!state)return;
  var b=document.getElementById('btn-back');if(!b)return;
  b.style.display=(sheetOn()||state.screen!=='home')?'inline-flex':'none';
}
function goBack(){
  if(sheetOn()){closeSheet();return}
  if(state.screen==='review')toast('已退出复习，答过的词都记下了');
  state.screen='home';state.reading=null;state.review=null;render();toTop();
}
document.getElementById('backdrop').addEventListener('click',function(e){if(e.target.id==='backdrop')closeSheet()});
document.getElementById('btn-font').addEventListener('click',function(){S.settings.font=S.settings.font==='sans'?'serif':'sans';save();document.body.setAttribute('data-font',S.settings.font)});
document.getElementById('btn-settings').addEventListener('click',openSettings);
document.body.setAttribute('data-font',S.settings.font||'sans');
var DOLLAR=String.fromCharCode(36);
function escRe(w){w=String(w).replace(/[^A-Za-z]+/g,'');return w.replace(/[.*+?^$()|[\]\\]/g,'\\' + DOLLAR + '&')}
function findPassages(w){return DATA.passages.filter(function(p){return p.targets.indexOf(w)>=0})}
var IRR={find:['found'],keep:['kept'],lose:['lost'],spend:['spent'],tell:['told'],make:['made'],take:['took','taken'],get:['got'],begin:['began','begun'],grow:['grew','grown'],know:['knew','known'],say:['said'],pay:['paid'],feel:['felt'],leave:['left'],mean:['meant'],meet:['met'],run:['ran'],see:['saw','seen'],think:['thought'],write:['wrote','written'],bring:['brought'],buy:['bought'],catch:['caught'],teach:['taught'],hold:['held'],stand:['stood'],understand:['understood'],win:['won'],sit:['sat'],sleep:['slept'],speak:['spoke','spoken'],break:['broke','broken'],choose:['chose','chosen'],drive:['drove','driven'],eat:['ate','eaten'],fall:['fell','fallen'],give:['gave','given'],hear:['heard'],send:['sent'],sell:['sold'],show:['shown'],wake:['woke','woken'],wear:['wore','worn'],become:['became'],come:['came'],child:['children'],man:['men'],woman:['women'],person:['people'],foot:['feet'],go:['went','gone'],do:['did','done','does'],have:['had','has'],be:['is','are','was','were','been','being']};
var SUF=['s','es','ed','d','ing','er','est','ly','ies','ied','ier','iest','ily','ness','ful','less','ally'];
function isForm(m,w){
  var M=m.toLowerCase(),W=w.toLowerCase();
  if(M===W)return true;
  var irr=IRR[W];if(irr&&irr.indexOf(M)>=0)return true;
  var bases=[W];
  if(/e$/.test(W))bases.push(W.slice(0,-1));
  if(/y$/.test(W))bases.push(W.slice(0,-1));
  for(var i=0;i<bases.length;i++){
    var b=bases[i];
    if(M.indexOf(b)!==0)continue;
    var rest=M.slice(b.length);
    if(SUF.indexOf(rest)>=0)return true;
    if(/^([a-z])(ed|ing|er|est)$/.test(rest))return true;
  }
  return false;
}
function stemOf(w){var n=w.length;if(n<=3)return w;return w.slice(0,n>=8?n-3:n-2)}
function renderWithTargets(para,targets){
  var out=esc(para);
  targets.slice().sort(function(a,b){return b.length-a.length}).forEach(function(w){
    var re=new RegExp('\\b'+escRe(stemOf(w))+'[A-Za-z]{0,6}\\b','gi');
    out=out.replace(re,function(m){
      if(!isForm(m,w))return m;
      return '<span class="tw" data-w="'+esc(w)+'">'+m+'</span>';
    });
  });
  return out;
}

function fullSenseHTML(wd){
  if(!wd)return '';
  var ss=(wd.senses&&wd.senses.length)?wd.senses:[{pos:'',zh:wd.zh||''}];
  return ss.map(function(s){
    return '<div class="sense"><div class="sh"><span class="pos">'+esc(s.pos||'')+'</span><span class="zh">'+esc(s.zh||'')+'</span></div>'+
      (s.col?'<div class="col">搭配：'+esc(s.col)+'</div>':'')+
      (s.ex?'<div class="ex">'+esc(s.ex)+'</div>':'')+
      (s.exzh?'<div class="exzh">'+esc(s.exzh)+'</div>':'')+
      (s.exhint?'<div class="exhint">'+esc(s.exhint)+'</div>':'')+'</div>';
  }).join('');
}
