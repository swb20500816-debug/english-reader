"}],"note":"a high percentage of students（单数动词常与复数名词连用）；不要写 percent of 作主语。"},{"word":"irrelevant","phon":"/ɪˈreləvənt/","senses":[{"pos":"adj.","zh":"不相关的","col":"an irrelevant number 不相关的数字","ex":"The irrelevant number had evidently entered the estimate.","exzh":"这个不相关的数字显然进入了估计结果。","exhint":"ir-（不）＋relevant（相关的）。"}],"note":"反义词 relevant；be relevant to sth 与……相关。"},{"word":"reference","phon":"/ˈrefrəns/","senses":[{"pos":"n.","zh":"参照；参考","col":"become a reference 成为参照","ex":"The earlier number becomes a reference for judging the new price.","exzh":"先前的数字成了判断新价格的参照。","exhint":"refer（提到；参照）＋-ence。"}],"note":"with reference to 关于；reference book 工具书。锚定效应里 reference＝参照点。"},{"word":"substantial","phon":"/səbˈstænʃl/","senses":[{"pos":"adj.","zh":"可观的；大量的","col":"a substantial discount 可观的折扣","ex":"A reference price can make a small discount look substantial.","exzh":"一个参照价能让不大的折扣看起来很多。","exhint":"比 big 正式，常修饰 amount、number、discount。"}],"note":"写作替换 big/large 的好词：a substantial increase 大幅增长。"},{"word":"perspective","phon":"/pəˈspektɪv/","senses":[{"pos":"n.","zh":"视角；观点","col":"keep sth in perspective 客观看待某事","ex":"Setting criteria first keeps the starting figure in perspective.","exzh":"先定标准，才能客观看待那个起始数字。","exhint":"from my perspective＝在我看来。"}],"note":"keep/put sth in perspective 是高频短语，意为“客观地看待”。"},{"word":"punishment","phon":"/ˈpʌnɪʃmənt/","senses":[{"pos":"n.","zh":"惩罚","col":"influence punishment 影响量刑","ex":"An early figure can influence punishment in a court.","exzh":"一个先出现的数字可能影响法庭量刑。","exhint":"动词 punish（惩罚）。"}],"note":"capital punishment 死刑；本篇指“量刑建议”受锚定影响。"},{"word":"sensible","phon":"/ˈsensəbl/","senses":[{"pos":"adj.","zh":"合理的；明智的","col":"seem sensible 看起来合理","ex":"An anchor changes what seems sensible to us.","exzh":"锚点会改变我们觉得什么才算合理。","exhint":"与 sensitive（敏感的）易混，注意词尾 -ble / -tive。"}],"note":"sensible 明智的 / sensitive 敏感的 —— 高考辨析常客。"},{"word":"account","phon":"/əˈkaʊnt/","senses":[{"pos":"n.","zh":"叙述；说法","col":"our own account of events 我们自己那套说法","ex":"We get used to our own account of events.","exzh":"我们会习惯自己对事情的那套说法。","exhint":"account for＝解释、占（比例），是熟词考点。"},{"pos":"n.","zh":"账户","col":"open an account 开户","ex":"He opened a bank account last week.","exzh":"他上周开了个银行账户。"}],"note":"account 多义：叙述 / 账户 / 解释（account for）。熟词生义高频。"},{"word":"otherwise","phon":"/ˈʌðəwaɪz/","senses":[{"pos":"adv.","zh":"以另一种方式；否则","col":"see sth otherwise 从别的角度看某事","ex":"We may forget that anyone sees events otherwise.","exzh":"我们可能忘了别人会从别的角度看这些事。","exhint":"句首 otherwise＝否则；句中＝以别的方式。"}],"note":"阅读里 otherwise 常指“反过来、另有看法”，不是“否则”那么简单。"},{"word":"angle","phon":"/ˈæŋɡl/","senses":[{"pos":"n.","zh":"角度；视角","col":"from every angle 从每个角度","ex":"No single person sees everything from every angle.","exzh":"没有人能从所有角度看清一切。","exhint":"引申义＝看问题的立场，常与 perspective 换用。"}],"note":"from a different angle 换个角度看；本篇“every angle”指立场，不是几何角。"},{"word":"reasoning","phon":"/ˈriːzənɪŋ/","senses":[{"pos":"n.","zh":"推理；论证","col":"weaknesses in my reasoning 我推理中的漏洞","ex":"He spotted weaknesses in my reasoning that I had missed.","exzh":"他指出了我推理中的漏洞，而我自己没看出来。","exhint":"不可数名词；动词 reason（推理）。"}],"note":"reasoning 是“推理过程”，不是“理由”（reason）。"},{"word":"remarkable","phon":"/rɪˈmɑːkəbl/","senses":[{"pos":"adj.","zh":"非凡的；显著的","col":"a remarkable achievement 非凡的成就","ex":"He would never deny that the journey was a remarkable achievement.","exzh":"他绝不会否认那次旅程是一项非凡的成就。","exhint":"remark（评论）＋-able＝值得一说的。"}],"note":"写作替换 great 的升级词；be remarkable for sth 因……而引人注目。"},{"word":"extraordinary","phon":"/ɪkˈstrɔːdnri/","senses":[{"pos":"adj.","zh":"非凡的；离奇的","col":"how extraordinary it was 那是多么了不起","ex":"I told him how extraordinary it was that people had walked on the moon.","exzh":"我跟他说，人能在月球上行走是多么了不起。","exhint":"extra-（超出）＋ordinary（平常）＝超出寻常。"}],"note":"extraordinary 不等于“很 extra”。反义 ordinary。"},{"word":"deny","phon":"/dɪˈnaɪ/","senses":[{"pos":"v.","zh":"否认","col":"deny that… 否认……","ex":"He would never deny that the journey was a remarkable achievement.","exzh":"他绝不会否认那次旅程是一项非凡的成就。","exhint":"deny doing sth（不接 to do）；deny sb sth＝拒绝给某人某物。"}],"note":"deny 后接 that 从句或 doing，不接 to do —— 语法填空高频。"},{"word":"guide","phon":"/ɡaɪd/","senses":[{"pos":"n.","zh":"向导；指导","col":"the guide he had lived by 他赖以生活的向导","ex":"The guide he had lived by seemed to have become just a bare rock.","exzh":"他多年来依循的向导，似乎只剩下一块光秃的石头。","exhint":"动词 guide 指“引导、指导”。"},{"pos":"v.","zh":"引导","col":"guide sb through sth 引导某人做某事","ex":"The moon guided their work in the fields.","exzh":"月亮指导着他们在田里的劳作。"}],"note":"本篇 guide 指“月亮”这一生活依据，是隐喻用法，读懂它才能懂全文情感。"},{"word":"improvement","phon":"/ɪmˈpruːvmənt/","senses":[{"pos":"n.","zh":"改进；改善","col":"regard sth as an improvement 把某事看成进步","ex":"He did not regard every change as an improvement.","exzh":"他不把每一种变化都看成进步。","exhint":"动词 improve；an improvement on sth 比……更好。"}],"note":"an improvement on/over sth＝比某物好；注意介词用 on。"},{"word":"pleasure","phon":"/ˈpleʒə/","senses":[{"pos":"n.","zh":"快乐；乐事","col":"take pleasure in doing sth 以做某事为乐","ex":"He took pleasure in learning things that were new to him.","exzh":"他乐于学习对他而言新鲜的事物。","exhint":"with pleasure＝很乐意（回答请求）。"}],"note":"take pleasure in doing 是固定搭配，写作可直接用。"},{"word":"loss","phon":"/lɒs/","senses":[{"pos":"n.","zh":"失去；损失","col":"a feeling of loss 失落感","ex":"The landing left him with a feeling of loss.","exzh":"这次登月让他产生了失落感。","exhint":"动词 lose；at a loss＝不知所措。"}],"note":"a sense of loss 失落感；loss 与 lose 的词性区分是拼写题常考。"},{"word":"identify","phon":"/aɪˈdentɪfaɪ/","senses":[{"pos":"v.","zh":"识别；确认","col":"identify the cause 找出原因","ex":"The researchers used a separate measure to identify problematic viewing.","exzh":"研究者用另一套指标来识别“有问题的观看”。","exhint":"identify A as B＝确认 A 是 B；identification 身份证/鉴定。"}],"note":"identify with sb＝对某人有认同感，是熟词生义考点。"}],"passages":[{"id":1,"title":"The Boy Who Built a Bridge","level":"B 篇难度 · 记叙","words":338,"min":6,"tags":["励志","坚持"],"targets":["admire","apology","approach","argue","attach","benefit","charming","concern","confident","contain","convince","deserve"],"paras":["Lin was a quiet boy in Class 3. When asked what he wanted to do after high school, he always said, \"Build bridges.\" His classmates laughed, because Lin's English was the worst in the class. He could read the word bridge, but he could not say anything about it. Every exam brought the same result: a low score and a red mark.","One evening, his teacher asked him to stay. \"I admire your dream,\" she said, \"but a bridge needs a plan, and a plan needs language. What is your approach?\" Lin had no answer. He had tried many things, but nothing worked, and he had even argued with his parents that English was useless for an engineer.","The next morning, Lin found a note on his desk. It was a short apology from a classmate who had laughed at him. Attached to the note was a small card with ten new words. \"Learn these,\" the note said. \"Ten a day. That is all.\" Lin was not sure it would work, but he was tired of being afraid, so he decided to try.","The first week was hard, and his biggest concern was time. The words did not stay in his head. He wrote them on his hand, on his notebook, and on a piece of paper attached to his desk. Then something changed. He began to meet the words in small stories his teacher gave him. Each story was short, and each one contained a few new words that came back in a different sentence.","By the end of the month, Lin felt confident for the first time. \"Reading brings real benefits,\" he told his friend. \"You meet a word again and again, and one day it is yours.\" His friend laughed, but not in a bad way. \"You sound charming,\" she said. Lin smiled. He could not convince everyone that a quiet boy could become an engineer, but he no longer needed to. He deserved a chance to try, and now he was giving himself one."],"ctx":{"admire":"\"I admire your dream,\" she said, \"but a bridge needs a plan, and a plan needs language.","apology":"It was a short apology from a classmate who had laughed at him.","approach":"What is your approach?","argue":"he had even argued with his parents that English was useless for an engineer.","attach":"Attached to the note was a small card with ten new words.","benefit":"\"Reading brings real benefits,\" he told his friend.","charming":"\"You sound charming,\" she said.","concern":"The first week was hard, and his biggest concern was time.","confident":"By the end of the month, Lin felt confident for the first time.","contain":"each one contained a few new words that came back in a different sentence.","convince":"He could not convince everyone that a quiet boy could become an engineer","deserve":"He deserved a chance to try, and now he was giving himself one."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["How Lin gave up his dream.","How Lin found a way to study English for his dream.","Why Lin's classmates laughed at him.","How to build a real bridge."],"answer":1,"exp":"文章写林想当桥梁工程师、英语却很差，最后靠“每天十词+小故事反复读”的方法慢慢变好。","src":"He could not convince everyone that a quiet boy could become an engineer, but he no longer needed to."},{"type":"细节","q":"What was on the card that Lin found?","options":["His exam score.","A short apology and ten new words.","A picture of a bridge.","His teacher's plan for the class."],"answer":1,"exp":"第三段：卡片是一封简短的道歉，上面“附”了十个新词。","src":"It was a short apology from a classmate who had laughed at him. Attached to the note was a small card with ten new words."},{"type":"推理","q":"Why did the method start to work in the second week?","options":["Lin studied ten hours a day.","Lin's teacher gave him answers.","The words kept coming back in short stories.","His parents helped him."],"answer":2,"exp":"第四段：他“开始在小故事里遇见这些词”，同一批词在不同句子里反复出现。","src":"each one contained a few new words that came back in a different sentence"},{"type":"词义猜测","q":"What does \"it is yours\" mean in Paragraph 5?","options":["You own the book.","You have really learned the word.","Someone gave the word to you.","You can sell the word."],"answer":1,"exp":"前一句说“你一遍遍遇见一个词”，所以“它就是你的了”指真正掌握、内化。","src":"You meet a word again and again, and one day it is yours."}],"ctxzh":{"admire":"“我佩服你的梦想，”她说，“但造桥需要计划，而计划需要语言。”","apology":"那是一个曾嘲笑过他的同学一句简短的道歉。","approach":"你的方法是什么？","argue":"他甚至和父母争辩过，说英语对一个工程师毫无用处。","attach":"纸条上附着一张写着十个新单词的小卡片。","benefit":"“阅读能带来实实在在的好处，”他对朋友说。","charming":"“你说话挺迷人的，”她说。","concern":"第一周很难熬，他最大的顾虑是时间。","confident":"到月底，林第一次感到自信。","contain":"每一篇都包含几个新词，这些词会在不同的句子里再次出现。","convince":"他无法让所有人相信，一个安静的男孩也能成为工程师。","deserve":"他值得一个尝试的机会，而现在他正在给自己这个机会。"}},{"id":11,"title":"The Choice at the Crossroads","level":"B 篇难度 · 记叙","words":396,"min":7,"tags":["成长","家庭","选择"],"targets":["choice","balance","guilty","willing","unwilling","confidence","accept","adapt","panic","grateful","afford","relief"],"paras":["Chen had five days. In five days her mid-term exams would begin, and in five days her grandmother would have surgery in a hospital two hours away. Her parents were both working. Someone had to go and stay with her grandmother, and that someone was her, the only child still at home.","On the first evening, Chen sat at her desk and looked at her books without reading a word. She had no choice. Or did she? Staying home might cost her grandmother a familiar face in the morning. Going to the hospital might cost her the whole week of studying. It was impossible to balance the two, and she felt guilty for even thinking about her own exams.","The next morning she told her teacher. He did not offer a plan. Instead he asked her one question: \"Which choice would you be able to live with?\" Chen thought about it all through the second class. She was unwilling to tell her parents that she felt worried, because they were tired enough. She was willing to miss a few classes, but not a whole week.","So she made a plan. She would go to the hospital for two afternoons, not five days. She packed her books into one bag. On the train she read; in the waiting room she read; at night, after her grandmother fell asleep, she read by a small lamp. The plan was not perfect, but it held.","She did panic once. On Wednesday, she opened a practice paper and discovered that she could not remember how to do half of it. She sat in the hospital corridor and wanted to cry. Then she told herself: the paper was hard for everyone, and one bad day proves nothing. She closed the book, took a short walk, and came back to it. By Thursday her confidence was back.","By the last exam she was tired but steady. She could not afford to do everything, and she had stopped trying. She had learned to adapt to a week that was not hers, and she had learned to accept that some things would simply be unfinished. When the marks came out, they were not great, but they were enough, and for the first time in a week she felt grateful rather than guilty. Her grandmother was fine. That was the relief she had been waiting for."],"ctx":{"choice":"She had no choice. Or did she?","balance":"It was impossible to balance the two, and she felt guilty for even thinking about her own exams.","guilty":"It was impossible to balance the two, and she felt guilty for even thinking about her own exams.","willing":"She was willing to miss a few classes, but not a whole week.","unwilling":"She was unwilling to tell her parents that she felt worried, because they were tired enough.","confidence":"By Thursday her confidence was back.","accept":"She had learned to adapt to a week that was not hers, and she had learned to accept that some things would simply be unfinished.","adapt":"She had learned to adapt to a week that was not hers, and she had learned to accept that some things would simply be unfinished.","panic":"She did panic once.","grateful":"When the marks came out, they were not great, but they were enough, and for the first time in a week she felt grateful rather than guilty.","afford":"She could not afford to do everything, and she had stopped trying.","relief":"Her grandmother was fine. That was the relief she had been waiting for."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["How Chen learned to make a hard decision.","Why Chen was late for her exams.","How to take care of a sick grandmother.","Why Chen's parents could not help her."],"answer":0,"exp":"全文围绕她在“照顾奶奶”和“复习考试”之间的选择展开，以及她如何确定并执行自己的选择。","src":"Which choice would you be able to live with?"},{"type":"细节","q":"How did Chen deal with the time problem?","options":["She asked her teacher to give her more time.","She studied wherever she went and shortened the visit.","She gave up studying for the whole week.","She asked her parents to come home to work."],"answer":1,"exp":"第四段：她把探望压缩成两个下午，并在火车上、候诊室、夜里都读。","src":"On the train she read; in the waiting room she read; at night, after her grandmother fell asleep, she read by a small lamp."},{"type":"推理","q":"What does the teacher's question in Paragraph 3 suggest about him?","options":["He wanted Chen to stay at home.","He wanted her to fix her own problem properly.","He did not care about her exams.","He thought her grandmother was fine."],"answer":1,"exp":"老师没有直接给方案，而是让她自己判断，提示他有意让她独立解决问题。","src":"He did not offer a plan. Instead he asked her one question"},{"type":"词义猜测","q":"What does the underlined word \"held\" (in Paragraph 4) probably mean?","options":["Lasted without breaking.","Was held by someone.","Stopped suddenly.","Became harder."],"answer":0,"exp":"“The plan was not perfect, but it held.” 与不完美相对，意思是这个计划没有垮掉、坚持住了。","src":"The plan was not perfect, but it held."}],"ctxzh":{"choice":"她别无选择。真的是这样吗？","balance":"两者根本没法兼顾，她甚至因为想到自己的考试而感到内疚。","guilty":"两者根本没法兼顾，她甚至因为想到自己的考试而感到内疚。","willing":"她愿意缺几节课，但不肯缺整整一周。","unwilling":"她不愿告诉父母自己很焦虑，因为他们已经够累了。","confidence":"到星期四，她的信心回来了。","accept":"她学会了适应这不属于自己的一周，也学会了接受有些事就是做不完。","adapt":"她学会了适应这不属于自己的一周，也学会了接受有些事就是做不完。","panic":"她确实慌过一次。","grateful":"成绩出来时不算好，但已经够了；一周以来她第一次感到的是感激而不是内疚。","afford":"她没有精力把所有事都做完，也就不再强求了。","relief":"奶奶没事。那就是她一直在等的宽慰。"}},{"id":12,"title":"The River That Came Back","level":"B 篇难度 · 记叙/环保","words":301,"min":5,"tags":["环境","社区","坚持"],"targets":["quality","protect","reduce","recycle","ordinary","realize","doubt","survive","prevent","community","chemical","effort"],"paras":["Old Wu had fished in the river for forty years. When he was a boy, the water was so clear that you could see the stones at the bottom. Now the stones were covered with a thick green skin, and the water smelled bad in summer. The quality of the water had fallen so far that even the fish had left.","It was not an ordinary problem. A factory upstream had poured chemicals into the river for years, and the town had let it happen. Wu had complained, but people told him to stop making trouble. He had almost stopped believing that anything could be done.","Then a group of students came to the town. They tested the water, wrote a report, and showed it at a community meeting. They did not shout. They simply asked: can we still protect this river? Can we reduce what we pour into it, and recycle what we can?","Wu doubted it at first. \"You are young,\" he said. \"You will be gone next year.\" One of the students answered, \"Then teach us what you know before we go.\" That answer changed his mind.","The effort was small at first. Some families started to bring their rubbish to a recycling point. The factory was asked to stop using one harmful chemical. Nobody expected the river to survive such damage, yet by the second summer the green skin was thinner, and small fish had come back.","Wu still goes down to the water every morning. He does not know if the river will ever be what it was. But he has realized something: a community that tries to prevent one more bad year is already different from a town that does nothing. \"It is not the water that came back first,\" he says. \"It is us.\""],"ctx":{"quality":"The quality of the water had fallen so far that even the fish had left.","protect":"They simply asked: can we still protect this river?","reduce":"Can we reduce what we pour into it, and recycle what we can?","recycle":"Can we reduce what we pour into it, and recycle what we can?","ordinary":"It was not an ordinary problem.","realize":"But he has realized something: a community that tries to prevent one more bad year is already different from a town that does nothing.","doubt":"Wu doubted it at first.","survive":"Nobody expected the river to survive such damage, yet by the second summer the green skin was thinner, and small fish had come back.","prevent":"a community that tries to prevent one more bad year","community":"They tested the water, wrote a report, and showed it at a community meeting.","chemical":"The factory was asked to stop using one harmful chemical.","effort":"The effort was small at first."},"questions":[{"type":"主旨","q":"What is the main idea of the passage?","options":["A river can be saved only by the government.","Small, steady efforts by a community can bring a damaged river back.","Old Wu was wrong to complain about the factory.","Students should not test river water."],"answer":1,"exp":"文章主体是社区从小事做起——回收、减少化学品——两年后河里又有了鱼，结尾点明“改变的是我们”。","src":"a community that tries to prevent one more bad year is already different from a town that does nothing"},{"type":"细节","q":"What first made Old Wu change his mind?","options":["The factory closed down.","The students asked him to teach them.","The fish came back.","The town paid him money."],"answer":1,"exp":"第四段：学生说“那你走之前教教我们”，这句话打动了他。","src":"\"Then teach us what you know before we go.\" That answer changed his mind."},{"type":"推理","q":"Why did the students show their report at a community meeting?","options":["To prove the river was already dead.","To get the town to act together, not just to complain.","To become famous.","To blame Old Wu."],"answer":1,"exp":"他们“没有喊叫”，只是提问，目的是让整个社区一起行动，而不是单纯指责。","src":"They did not shout. They simply asked"},{"type":"词义猜测","q":"What does Old Wu mean by \"It is us\" in the last paragraph?","options":["The river is now owned by the town.","What came back first was the community's courage to act.","Old Wu is the one who cleaned the river.","The students stayed in the town."],"answer":1,"exp":"前一句说“不是水先回来”，因此“先回来”的是人——社区改变的态度与行动。","src":"\"It is not the water that came back first,\" he says. \"It is us.\""}],"ctxzh":{"quality":"水质已经差到连鱼都离开了。","protect":"他们只是问：我们还能保护这条河吗？","reduce":"我们能不能少往河里排一点，能回收的就回收？","recycle":"我们能不能少往河里排一点，能回收的就回收？","ordinary":"这不是一个普通的问题。","realize":"但他已经意识到一件事：一个努力避免再糟糕一年的社区，已经和一个什么都不做的小镇不一样了。","doubt":"吴一开始也对此表示怀疑。","survive":"没人指望这条河能挺过这样的破坏，但到第二个夏天，那层绿色的浮沫变薄了，小鱼也回来了。","prevent":"一个努力避免再糟糕一年的社区","community":"他们检测水质，写了一份报告，在社区会议上展示。","chemical":"这家工厂被要求停止使用一种有害化学品。","effort":"起初的努力很小。"}},{"id":13,"title":"A Lesson Without a Screen","level":"C 篇难度 · 议论/校园","words":365,"min":7,"tags":["科技","教育","专注"],"targets":["technology","device","distract","convince","concentrate","screen","independent","constantly","require","responsible","active","allow"],"paras":["When the new head teacher arrived, she found a problem that no one wanted to talk about. Students were not lazy. They were not even bored. They were simply unable to stay with one thing for more than a few minutes. In class, phones were put away, but their owners still looked down, as if a screen were still in front of them.","Her first idea was simple: take the devices away. She told the students that, for two hours every morning, no phone would be allowed in the classroom. Some parents were angry. They said their children needed to be reachable, and that young people are constantly checking their phones anyway. A few students were not convinced, either. \"We can concentrate,\" one of them said. \"We just choose not to.\"","The head teacher did not argue. Instead she asked the class to try a test. On Monday, they would study as usual. On Tuesday, they would study with no device within reach. At the end of each day, they would write down how much they remembered.","The result surprised almost everyone. On Tuesday, the same students finished more work in half the time. \"It was not that I worked faster,\" one girl wrote. \"It was that I did not have to start again every time something distracted me.\" She had not realized how often she had been looking at her phone until it was not there.","This does not mean that technology is the enemy. The head teacher is the first to say that a good video can teach in five minutes what a book takes an hour to explain. But using a tool requires knowing when to put it down. A student who depends on the screen to think will find it hard to think independently, and a school that never teaches this lesson is not doing its job.","Now the school has a rule, but it is not just a rule. Students run a weekly discussion about when devices help and when they steal time. The head teacher watches them argue, take notes, and decide together. Being responsible for their own attention, she says, is the most active lesson they can learn."],"ctx":{"technology":"This does not mean that technology is the enemy.","device":"Her first idea was simple: take the devices away.","distract":"It was that I did not have to start again every time something distracted me.","convince":"A few students were not convinced, either.","concentrate":"\"We can concentrate,\" one of them said.","screen":"In class, phones were put away, but their owners still looked down, as if a screen were still in front of them.","independent":"A student who depends on the screen to think will find it hard to think independently","constantly":"They said their children needed to be reachable, and that young people are constantly checking their phones anyway.","require":"But using a tool requires knowing when to put it down.","responsible":"Being responsible for their own attention, she says, is the most active lesson they can learn.","active":"Being responsible for their own attention, she says, is the most active lesson they can learn.","allow":"She told the students that, for two hours every morning, no phone would be allowed in the classroom."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["Why phones should be completely banned in schools.","How a school helped students see when technology helps and when it steals time.","Why the head teacher was unpopular.","How to make videos for class."],"answer":1,"exp":"文章既不否定科技（第五段），也不只讲禁令，重点是学生通过对比学会管理注意力。","src":"using a tool requires knowing when to put it down"},{"type":"细节","q":"What happened on the Tuesday test?","options":["Students finished more work in less time.","Students refused to study.","Phones were banned forever.","Parents took the devices home."],"answer":0,"exp":"第四段：没有设备在眼前时，同样的学生用一半时间完成了更多任务。","src":"On Tuesday, the same students finished more work in half the time."},{"type":"推理","q":"What can we infer from the girl's words in Paragraph 4?","options":["She worked faster because the work was easy.","She kept losing her place because of small distractions.","She wanted her phone back.","She did not like the head teacher."],"answer":1,"exp":"她说\"不是因为我更快，而是每次被分心后不用重新开始\"，说明频繁分心打断了她。","src":"\"It was that I did not have to start again every time something distracted me.\""},{"type":"作者态度","q":"What is the head teacher's attitude toward technology in class?","options":["It is always harmful.","It should be used, but with control.","It should replace books.","It is not worth discussing."],"answer":1,"exp":"第五段明确说科技不是敌人、好视频也能教东西，但“用工具需要知道何时放下”。","src":"This does not mean that technology is the enemy."}],"ctxzh":{"technology":"这并不意味着技术就是敌人。","device":"她的第一个想法很简单：把这些设备都收走。","distract":"而是我不必每次被什么分心就得从头再来。","convince":"有几个学生也并没有被说服。","concentrate":"“我们能专心，”其中一个说。","screen":"上课时手机被收了起来，但机主们仍旧低着头，好像面前还有一块屏幕。","independent":"一个依赖屏幕来思考的学生，会觉得独立思考很难。","constantly":"他们说孩子需要随时能被联系到，而且年轻人本来就不停地在看手机。","require":"但使用一件工具，需要知道什么时候把它放下。","responsible":"她说，为自己的注意力负责，是他们能学到的最积极的一课。","active":"她说，为自己的注意力负责，是他们能学到的最积极的一课。","allow":"她告诉学生，每天早上有两个小时，教室里不允许出现手机。"}},{"id":14,"title":"The Month Without a Phone","level":"B 篇难度 · 说明+记叙","words":343,"min":6,"tags":["健康","习惯","自律"],"targets":["recover","ignore","habit","regular","stress","pressure","improve","avoid","consistent","last","effort","invite"],"paras":["Lin was tired all the time, and he could not explain why. He went to bed at one in the morning, got up at six, and ate whatever was quick. His teacher told him to see a doctor, but the doctor found nothing wrong. \"You are not ill,\" she said. \"You are just not giving your body a chance to recover.\"","Lin did not believe her at first. He ignored the advice for another two weeks. Then he failed a maths test that he had studied hard for, and for the first time he began to worry. If he was studying more than anyone in his class and still doing badly, something else had to be wrong.","His cousin, who was a nurse, asked him one question: what was the last habit he had changed on purpose? Lin could not answer. He had never thought about his life that way. He had always believed that success came from working harder, not from sleeping regular hours.","His cousin did not argue. She simply invited him to try a small plan for two weeks: lights out by eleven, a proper breakfast, and twenty minutes of exercise every day. \"Nothing difficult,\" she said. \"Just keep it long enough to see whether it works.\"","The first three days were hard, and Lin almost stopped. On the fourth morning, something small happened: he understood a passage in his English book the first time he read it. It was not a great change, but it was a real one. After a week he could concentrate better, and the stress he had carried for months began to lift.","The plan lasted two weeks, and then became a habit. What Lin learned was not that sleep makes you clever. He learned that a consistent effort, even a small one, can improve a life that feels stuck. The pressure of exams did not disappear, but he was no longer fighting it with a tired body. The best part, he says, is that he now knows how to avoid the same mistake again."],"ctx":{"recover":"\"You are just not giving your body a chance to recover.\"","ignore":"He ignored the advice for another two weeks.","habit":"what was the last habit he had changed on purpose?","regular":"He had always believed that success came from working harder, not from sleeping regular hours.","stress":"After a week he could concentrate better, and the stress he had carried for months began to lift.","pressure":"The pressure of exams did not disappear, but he was no longer fighting it with a tired body.","improve":"He learned that a consistent effort, even a small one, can improve a life that feels stuck.","avoid":"he now knows how to avoid the same mistake again.","consistent":"He learned that a consistent effort, even a small one, can improve a life that feels stuck.","last":"The plan lasted two weeks, and then became a habit.","effort":"He learned that a consistent effort, even a small one, can improve a life that feels stuck.","invite":"She simply invited him to try a small plan for two weeks"},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["Why exams cause too much pressure.","How small regular changes in daily life helped Lin study better.","How to pass a maths test.","Why sleeping less is necessary in senior high."],"answer":1,"exp":"全文讲的是他通过早睡、吃早饭、运动这些日常小改变，学习状态反而变好。","src":"a consistent effort, even a small one, can improve a life that feels stuck"},{"type":"细节","q":"Why did Lin begin to worry?","options":["The doctor said he was ill.","He studied hard but failed a maths test.","His cousin stopped talking to him.","He could not sleep at all."],"answer":1,"exp":"第二段：他认真复习却考砸了数学，才意识到问题不在“不够努力”。","src":"he failed a maths test that he had studied hard for"},{"type":"推理","q":"What does the sentence \"he understood a passage ... the first time he read it\" suggest?","options":["The passage was easy.","His improved sleep and exercise had begun to affect his study.","He had read the passage before.","His teacher helped him."],"answer":1,"exp":"这一天的小变化正好发生在改变作息三天后，是作者用来证明“身体状态影响学习”的证据。","src":"On the fourth morning, something small happened"},{"type":"词义猜测","q":"What does \"lift\" most probably mean in Paragraph 5?","options":["Become lighter in weight.","Go away or ease.","Go up higher.","Move something else."],"answer":1,"exp":"“the stress ... began to lift”指压力“减轻、消散”，与前面压力持续数月形成对照。","src":"the stress he had carried for months began to lift"}],"ctxzh":{"recover":"“你只是没给身体一个恢复的机会。”","ignore":"他又把这条建议放在一边，过了两周才理。","habit":"他上一个主动改掉的习惯是什么？","regular":"他一直相信成功来自更拼命，而不是按时睡觉。","stress":"一周后他更能集中注意力了，几个月来一直压着他的那份紧张开始消退。","pressure":"考试的压力并没有消失，但他不再用疲惫的身体去硬扛。","improve":"他明白了，持续的努力哪怕很小，也能改善一种感觉卡住的生活。","avoid":"他现在知道怎么避免再犯同样的错。","consistent":"他明白了，持续的努力哪怕很小，也能改善一种感觉卡住的生活。","last":"这个计划持续了两周，然后就变成了习惯。","effort":"他明白了，持续的努力哪怕很小，也能改善一种感觉卡住的生活。","invite":"她只是邀请他试一个小计划，为期两周。"}},{"id":15,"title":"The Room With Two Extra Beds","level":"B 篇难度 · 记叙/公益","words":320,"min":6,"tags":["公益","社区","温暖"],"targets":["volunteer","community","offer","treasure","expect","share","promise","situation","convenient","although","manage","willing"],"paras":["The old building on Green Street used to be a small hotel. Now it has twelve rooms, a shared kitchen, and a sign by the door that says: FREE FOR FAMILIES WITH A CHILD IN HOSPITAL.","The group that runs it was started three years ago by people from the local community. Zhao, a retired nurse, and her daughter, a college student, were the first volunteers. Zhao had once spent a month in a strange city while her own son was ill. She remembered how lonely it felt to be near a hospital and have nowhere to sit down.","\"I could not offer money,\" she says. \"But I could offer a bed and a hot meal.\" The daughter put a notice online, and within a week, three families came. Now about twelve families stay there each month, for a week or longer.","The work is not easy. Some guests are angry; some cry; some do not want to talk. \"Everyone has their own situation,\" Zhao says. \"We do not ask. We just make sure the room is warm and the food is there.\"","Although the building is old, it has almost everything a family needs, and it is convenient for the hospital: ten minutes on foot. Volunteers share the cleaning and the cooking. Nobody is paid, and nobody expects to be. \"People think we are very kind,\" the daughter says. \"But honestly, we get more than we give.\"","What Zhao treasures most are the small moments. A child who was too weak to speak waves from the window. A father who has not slept for a week finally sleeps. Last winter, a family that had left a month earlier came back with two boxes of fruit and a promise: \"When our situation is better, we will come and volunteer with you.\"","Zhao is willing to wait. \"We manage this place one day at a time,\" she says. \"That is enough.\""],"ctx":{"volunteer":"Zhao, a retired nurse, and her daughter, a college student, were the first volunteers.","community":"The group that runs it was started three years ago by people from the local community.","offer":"\"I could not offer money,\" she says. \"But I could offer a bed and a hot meal.\"","treasure":"What Zhao treasures most are the small moments.","expect":"Nobody is paid, and nobody expects to be.","share":"Volunteers share the cleaning and the cooking.","promise":"came back with two boxes of fruit and a promise","situation":"\"Everyone has their own situation,\" Zhao says.","convenient":"it is convenient for the hospital: ten minutes on foot.","although":"Although the building is old, it has almost everything a family needs","manage":"\"We manage this place one day at a time,\" she says.","willing":"Zhao is willing to wait."},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["How a free home for families near a hospital started and works.","How to become a nurse.","Why old buildings should be rebuilt.","How hospitals treat children."],"answer":0,"exp":"全文介绍这栋“医院旁的免费住处”的由来、运转方式，以及给住的人带来的安慰。","src":"FREE FOR FAMILIES WITH A CHILD IN HOSPITAL"},{"type":"细节","q":"Why did Zhao start this place?","options":["She wanted to make money from the old hotel.","She remembered her own lonely month near a hospital.","The government asked her to.","She had nowhere else to live."],"answer":1,"exp":"第二段：她曾在一个陌生城市陪儿子看病一个月，记得那种孤独和无处可坐的感觉。","src":"She remembered how lonely it felt to be near a hospital and have nowhere to sit down."},{"type":"推理","q":"What does the daughter mean by \"we get more than we give\"?","options":["They receive more money than they spend.","The reward of helping others is greater than what they give.","They get free food from the families.","They work less than other people."],"answer":1,"exp":"前文说“人们觉得我们很善良”，女儿说其实收获更多——指精神上的回报，而非金钱。","src":"But honestly, we get more than we give."},{"type":"词义猜测","q":"What does the word \"wait\" in the last paragraph refer to?","options":["Waiting for the families to pay.","Waiting for those helped to come back and help others.","Waiting for the building to be sold.","Waiting for her daughter to graduate."],"answer":1,"exp":"上一段刚写到离开的家庭承诺“以后回来当志愿者”，所以“愿意等”是等他们回来接力。","src":"When our situation is better, we will come and volunteer with you."}],"ctxzh":{"volunteer":"赵是一名退休护士，她的女儿是个大学生，她们是最早的志愿者。","community":"运营这个机构的团队，是三年前由当地社区的人发起成立的。","offer":"“我拿不出钱，”她说，“但我能提供一张床和一顿热饭。”","treasure":"赵最珍惜的是那些细小的瞬间。","expect":"没有人拿工资，也没有人指望拿。","share":"志愿者们分担打扫和做饭的活。","promise":"回来时带着两箱水果和一个承诺","situation":"“每个人都有自己的处境，”赵说。","convenient":"对医院来说这很方便：步行十分钟就到。","although":"虽然这栋楼很旧，但一个家庭需要的东西它几乎都有。","manage":"“我们就一天一天地把这个地方撑下去，”她说。","willing":"赵愿意等。"}},{"id":16,"title":"When a City Cannot Breathe","level":"高考 · 说明议论","words":322,"min":8,"tags":["环境","城市"],"paras":["In July, the temperature in one old neighbourhood reached 43°C, while a park two kilometres away stayed below 36°C. The difference was not the weather but the surface. Dark asphalt and concrete absorb sunlight all day and release it slowly at night, so the streets never really cool down.","Planners call this the urban heat island effect. Its intensity depends on how dense the buildings are, how much shade the streets offer, and how easily air can move between blocks. The capacity of a neighbourhood to stay cool is therefore decided long before the first hot day, when the roads and towers were designed.","Planting trees is the most efficient long-term answer, but a young tree needs years before it gives adequate shade. A faster alternative is to paint roofs white or cover them with plants, which reflect rather than store heat. Measurements in several Chinese cities show that a white roof can lower the surface temperature by as much as 20°C.","Streets can also be redesigned. Narrow lanes that trap hot air can be opened up, pavement that lets rainwater through keeps the ground cooler, and small gardens can generate shade where a large park is impossible. No single measure is enough, but together they can mitigate the worst hours of the day. The effect differs from region to region, and a solution copied from another city may fail.","The deeper problem is exposure. Elderly people, outdoor workers and children spend more time in the heat and have fewer ways to escape it. A city that cools only its shopping centres has not solved the problem; it has moved it. What matters most is a decline in night-time temperature, because the body recovers while it sleeps. Protecting the people who cannot avoid the hottest hours is crucial, and that is a question of fairness as much as engineering."],"tr":["七月，一个老城区的气温达到 43°C，而两公里外的公园却一直低于 36°C。差别不在天气，而在地表。深色的沥青和混凝土整天吸收阳光，夜里又慢慢把热量放出来，所以街道从来没有真正凉下来。","规划者把这种现象叫作城市热岛效应。它的强度取决于楼有多密、街道有多少阴凉、空气能不能在街区之间流动。一个街区“保持凉爽的能力”，其实在第一条酷热的日子到来很久之前——在道路和高楼被设计的时候——就已经定下了。","种树是长期来看最有效的办法，但一棵小树要长好几年才能提供足够的阴凉。更快的替代方案是把屋顶刷白或种上植物，它们把热量反射出去，而不是存起来。中国多个城市的测量显示，白色屋顶能把地表温度降低多达 20°C。","街道也可以重新设计。把闷住热气的窄巷打开，让雨水能渗下去的路面能让地面更凉，在大型公园不可能存在的地方，小花园也能造出阴凉。单一措施都不够，但合起来可以缓解一天中最难熬的几个小时。效果因地区而异，从别的城市照搬来的方案可能行不通。","更深层的问题是“暴露”。老人、户外工作者和孩子在高温里待得更久，可躲开的手段更少。一个只把购物中心降温的城市并没有解决问题，它只是把问题挪走了。最重要的是夜间温度的下降，因为人是在睡觉时恢复的。保护那些躲不开最热时段的人至关重要，这既是公平问题，也是工程问题。"],"targets":["absorb","intensity","dense","capacity","efficient","adequate","alternative","generate","mitigate","region","exposure","decline","crucial"],"ctx":{"absorb":"Dark asphalt and concrete absorb sunlight all day and release it slowly at night, so the streets never really cool down.","intensity":"Its intensity depends on how dense the buildings are, how much shade the streets offer, and how easily air can move between blocks.","dense":"Its intensity depends on how dense the buildings are, how much shade the streets offer, and how easily air can move between blocks.","capacity":"The capacity of a neighbourhood to stay cool is therefore decided long before the first hot day, when the roads and towers were designed.","efficient":"Planting trees is the most efficient long-term answer, but a young tree needs years before it gives adequate shade.","adequate":"Planting trees is the most efficient long-term answer, but a young tree needs years before it gives adequate shade.","alternative":"A faster alternative is to paint roofs white or cover them with plants, which reflect rather than store heat.","generate":"Small gardens can generate shade where a large park is impossible.","mitigate":"No single measure is enough, but together they can mitigate the worst hours of the day.","region":"The effect differs from region to region, and a solution copied from another city may fail.","exposure":"The deeper problem is exposure.","decline":"What matters most is a decline in night-time temperature, because the body recovers while it sleeps.","crucial":"Protecting the people who cannot avoid the hottest hours is crucial, and that is a question of fairness as much as engineering."},"ctxzh":{"absorb":"深色的沥青和混凝土整天吸收阳光，夜里又慢慢把热量放出来，所以街道从来没有真正凉下来。","intensity":"它的强度取决于楼有多密、街道有多少阴凉、空气能不能在街区之间流动。","dense":"它的强度取决于楼有多密、街道有多少阴凉、空气能不能在街区之间流动。","capacity":"一个街区“保持凉爽的能力”，其实在第一条酷热的日子到来很久之前就已定下，那时道路和高楼正在被设计。","efficient":"种树是长期来看最有效的办法，但一棵小树要长好几年才能提供足够的阴凉。","adequate":"种树是长期来看最有效的办法，但一棵小树要长好几年才能提供足够的阴凉。","alternative":"更快的替代方案是把屋顶刷白或种上植物，它们反射热量而不是把热量存起来。","generate":"在大型公园不可能存在的地方，小花园也能造出阴凉。","mitigate":"单一措施都不够，但合起来可以缓解一天中最难熬的几个小时。","region":"效果因地区而异，从别的城市照搬来的方案可能行不通。","exposure":"更深层的问题是“暴露在高温中”。","decline":"最重要的是夜间温度的下降，因为人是在睡觉时恢复的。","crucial":"保护那些躲不开最热时段的人至关重要，这既是公平问题，也是工程问题。"},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["Why some city neighbourhoods become much hotter than others and how to help.","How to grow trees quickly in crowded Chinese cities.","Why white roofs are cheaper than planting trees.","How weather forecasts are made in summer."],"answer":0,"zh":"这篇文章主要讲什么？","optzh":["为什么有些街区比别处热得多，以及如何改善。","如何在拥挤的中国城市里快速种树。","为什么白色屋顶比种树更便宜。","夏天的天气预报是怎么做出来的。"],"exp":"全文围绕“热岛效应为什么形成、怎么缓解、该保护谁”展开。","src":"Planners call this the urban heat island effect."},{"type":"细节","q":"According to paragraph 3, what is the advantage of painting roofs white?","options":["It reflects heat instead of storing it.","It makes buildings look more modern.","It costs nothing and needs no workers.","It collects rainwater for the garden."],"answer":0,"zh":"根据第三段，把屋顶刷白的好处是什么？","optzh":["它把热量反射出去，而不是储存起来。","它让建筑看起来更现代。","它不花钱也不需要工人。","它能收集雨水浇花园。"],"exp":"原文 which reflect rather than store heat：反射而不是存热。","src":"which reflect rather than store heat"},{"type":"推断","q":"What does the author suggest about cities that cool only their shopping centres?","options":["They have not really solved the problem for the people who need help most.","They are the best model for other cities to follow.","They should close their shopping centres in summer.","They have spent too much money on parks."],"answer":0,"zh":"作者对“只给购物中心降温”的城市有什么看法？","optzh":["对最需要帮助的人来说，问题并没有真正解决。","它们是别的城市最该照抄的样板。","它们夏天应该关掉购物中心。","它们在公园上花了太多钱。"],"exp":"has not solved the problem; it has moved it —— 只是把热挪到了别处。","src":"it has moved it"},{"type":"词义","q":"The word \"exposure\" in the last paragraph is closest in meaning to ______.","options":["being left in the heat with no way to escape it","being protected by the government","being moved to a cooler city","being measured by scientists"],"answer":0,"zh":"最后一段的 exposure 最接近的意思是______。","optzh":["被留在高温里、无法躲避","受到政府保护","被搬到更凉快的城市","被科学家测量"],"exp":"后文 elderly people, outdoor workers and children ... have fewer ways to escape it 正是解释 exposure。","src":"Elderly people, outdoor workers and children spend more time in the heat"}]},{"id":17,"title":"The Cost of a Notification","level":"高考 · 议论","words":318,"min":8,"tags":["科技","心理"],"paras":["A phone that vibrates is hard to ignore. The sound is short, the screen lights up, and for a second the mind leaves whatever it was doing. Designers call this a trigger: a small signal that starts a behaviour. A well-designed app does not wait for you to open it; it interrupts you, because an interruption is the cheapest way to win attention.","Behind the screen sits an algorithm that studies which messages you answer and when. It learns that you reply in the evening but ignore the morning, that you open a photo faster than a paragraph. The system does not need to know why. It only needs to predict, and prediction is enough to keep you engaged longer than you intended.","The result is a slow change in habit. People begin to check the phone without deciding to, and the checking becomes voluntary only in name. Psychologists describe two kinds of attention: one that is deliberately directed, and one that is captured. Most screen time belongs to the second kind, and the habit can persist for years without anyone deciding to keep it.","Some designers now prioritize a different pattern. They group notifications, delay them until a fixed hour, or remove the reward of a red badge. Early studies suggest that such changes reduce stress without reducing how often people use the app, because users still return when they have a reason. When the phone stays silent, the prompt to check it slowly fades.","Critics argue that the real problem is not the technology but the business model. A service paid for by advertising must sustain attention, and attention is easiest to sustain by interruption. If that is true, no setting will fix it; the only way to resist is to ask who pays for the service, and what, in the end, they are buying."],"tr":["震动的手机会让人很难忽略。声音很短，屏幕亮起，有那么一秒，脑子就离开了手上正在做的事。设计师把这叫作“触发”：一个启动某种行为的小信号。设计得好的 App 不会等你来打开它，它来打断你，因为打断是赢得注意力最便宜的办法。","屏幕背后有一个算法，专门研究你会回复哪类消息、什么时候回复。它知道你晚上会回、早上不理，知道点开一张照片比点开一段文字快。系统并不需要知道“为什么”，它只需要预测；而预测就足以让你比原计划多待很久。","结果是习惯的缓慢改变。人会不自觉地查看手机，这种“自觉”只在名义上是自愿的。心理学家把注意力分成两种：一种是自己主动投过去的，一种是被抓走的。大多数屏幕时间属于第二种，而这个习惯可以持续好几年，却没有谁真的决定要保留它。","一些设计师开始优先考虑另一种做法：把通知归组、推迟到固定时间、去掉红点带来的那点奖励。早期研究显示，这些改变能减轻压力，却不减少使用频率，因为用户有需要时还是会回来。手机安静下来，那个“去看看吧”的冲动也就慢慢淡了。","批评者认为，真正的问题不是技术，而是商业模式。一个靠广告付费的服务必须维持注意力，而用打断来维持注意力最容易。如果真是这样，任何设置都修不好它；唯一能抵抗的办法，是问一句：谁在为这个服务付钱，说到底，他们买的又是什么。"],"targets":["trigger","interrupt","attention","algorithm","engage","voluntary","persist","resist","reward","sustain","deliberate","prioritize","prompt"],"ctx":{"trigger":"Designers call this a trigger: a small signal that starts a behaviour.","interrupt":"A well-designed app does not wait for you to open it; it interrupts you, because an interruption is the cheapest way to win attention.","attention":"An interruption is the cheapest way to win attention.","algorithm":"Behind the screen sits an algorithm that studies which messages you answer and when.","engage":"It only needs to predict, and prediction is enough to keep you engaged longer than you intended.","voluntary":"People begin to check the phone without deciding to, and the checking becomes voluntary only in name.","persist":"The habit can persist for years without anyone deciding to keep it.","resist":"The only way to resist is to ask who pays for the service.","reward":"They group notifications, delay them until a fixed hour, or remove the reward of a red badge.","sustain":"A service paid for by advertising must sustain attention, and attention is easiest to sustain by interruption.","deliberate":"Psychologists describe two kinds of attention: one that is deliberately directed, and one that is captured.","prioritize":"Some designers now prioritize a different pattern.","prompt":"When the phone stays silent, the prompt to check it slowly fades."},"ctxzh":{"trigger":"设计师把这叫作“触发”：一个启动某种行为的小信号。","interrupt":"设计得好的 App 不会等你来打开它，它来打断你，因为打断是赢得注意力最便宜的办法。","attention":"打断是赢得注意力最便宜的办法。","algorithm":"屏幕背后有一个算法，专门研究你会回复哪类消息、什么时候回复。","engage":"它只需要预测，而预测就足以让你比原计划多待很久。","voluntary":"人会不自觉地查看手机，这种“自觉”只在名义上是自愿的。","persist":"这个习惯可以持续好几年，却没有谁真的决定要保留它。","resist":"唯一能抵抗的办法，是问一句谁在为这个服务付钱。","reward":"它们把通知归组、推迟到固定时间，或者去掉红点带来的那点奖励。","sustain":"一个靠广告付费的服务必须维持注意力，而用打断来维持注意力最容易。","deliberate":"心理学家把注意力分成两种：一种是自己主动投过去的，一种是被抓走的。","prioritize":"一些设计师现在优先考虑另一种做法。","prompt":"手机安静下来，那个“去看看吧”的冲动也就慢慢淡了。"},"questions":[{"type":"主旨","q":"What is the author's main point?","options":["Apps are designed to capture attention, and the cause lies in how they are paid for.","Phones should be switched off while students study.","Algorithms are too complicated for ordinary users to understand.","Notifications are useful because they remind us of important things."],"answer":0,"zh":"作者的主要观点是什么？","optzh":["App 被设计成抓取注意力，根源在于它的付费方式。","学生读书时应该把手机关掉。","算法太复杂，普通人理解不了。","通知有用，因为它提醒我们重要的事。"],"exp":"末段点题：真正的问题不是技术，而是商业模式。","src":"the real problem is not the technology but the business model"},{"type":"细节","q":"What does the algorithm mainly do according to paragraph 2?","options":["It predicts when and what you will respond to.","It writes the messages you receive.","It blocks messages that are not important.","It repairs the phone when it slows down."],"answer":0,"zh":"根据第二段，算法主要在做什么？","optzh":["预测你什么时候会回应什么内容。","它写出你收到的消息。","它屏蔽不重要的消息。","手机变慢时它负责修理。"],"exp":"It only needs to predict —— 算法的核心是预测。","src":"It only needs to predict"},{"type":"推断","q":"What can be inferred about the changes some designers have made?","options":["They may reduce stress without driving users away.","They have made people use their phones much less.","They have solved the problem completely.","They cost the companies a lot of money and failed."],"answer":0,"zh":"关于一些设计师做的改动，可以推断出什么？","optzh":["它们可能减轻压力，同时不会把用户赶走。","它们让人大幅减少了手机使用。","它们把问题彻底解决了。","它们让公司花了大量钱，而且失败了。"],"exp":"reduce stress without reducing how often people use the app。","src":"reduce stress without reducing how often people use the app"},{"type":"态度","q":"The author's attitude towards the business model can best be described as ______.","options":["critical","supportive","uncertain","amused"],"answer":0,"zh":"作者对这种商业模式的态度最接近______。","optzh":["批判的","支持的","不确定的","觉得好笑的"],"exp":"no setting will fix it 表明作者持批判态度。","src":"no setting will fix it"}]},{"id":18,"title":"The Reward That Takes Interest Away","level":"高考 · 说明","words":330,"min":8,"tags":["心理","教育"],"paras":["In the 1970s, a group of children who already enjoyed drawing were promised a reward for each picture. Weeks later, when the reward stopped, they drew less than a second group that had never been promised anything. The experiment is still quoted today, because it suggests that a reward can sometimes undermine the very interest it was meant to encourage.","Later researchers were more careful. They found that the effect depends on how the reward is perceived. If money is given for completing a task, people tend to see the task as work; if the same money is given as a sign of appreciation, the interest often survives. The outcome is not decided by the reward itself, but by the meaning attached to it.","This has practical consequences for schools. Praise that focuses on effort — 'you kept trying until it worked' — tends to support competence, while praise that focuses on ability — 'you are so clever' — can make students reluctant to attempt harder problems, since failure would put the label at risk. Teachers who want students to accomplish more usually say less about talent and more about method.","Psychologists describe three needs behind lasting motivation: autonomy, competence and connection. A student who can choose how to study feels autonomy; one who sees progress feels competence; one who works with friends feels connection. An incentive that ignores all three may work for a week and then fail, because it has borrowed interest rather than built it.","None of this means rewards are useless. They can help people begin something they have been avoiding, and they can acknowledge effort in public. But the tension between control and interest never disappears: the more a reward is used to control behaviour, the less it is likely to keep people motivated. Assessing a programme by its first month of results, therefore, may tell you very little."],"tr":["20 世纪 70 年代，一群本来就爱画画的孩子被许诺：每画一张就得到一份奖励。几周后奖励停止，他们画得比另一组从没被许诺过奖励的孩子更少。这个实验至今仍被引用，因为它说明：奖励有时会破坏它本意想鼓励的那份兴趣。","后来的研究者更谨慎。他们发现，效果取决于奖励被怎么理解。如果钱是为“完成任务”而给的，人容易把任务看成工作；如果同样的钱是作为“被认可的表示”，兴趣往往还在。结果不由奖励本身决定，而由附着在它上面的意义决定。","这对学校有实际影响。针对努力的表扬——“你一直试到做出来”——有助于建立能力感；而针对天赋的表扬——“你真聪明”——会让学生不愿意去碰更难的题，因为失败会让那个标签受威胁。想让学生真正学有所成的老师，通常少谈天赋、多谈方法。","心理学家说，持久的动力背后有三种需要：自主、胜任和连接。能自己选择怎么学的学生感到自主；看到进步的学生感到胜任；和朋友一起学的学生感到连接。一个把这三样都忽略掉的激励，也许能管一周，然后就失效，因为它只是借来了兴趣，而没有建立兴趣。","这并不意味着奖励没用。它能帮人开始一件一直回避的事，也能公开地肯定努力。但“控制”与“兴趣”之间的紧张关系从未消失：奖励越是用来控制行为，就越难让人保持动力。所以，用一个项目头一个月的结果去评价它，可能什么都说明不了。"],"targets":["undermine","perceive","outcome","praise","competence","reluctant","accomplish","autonomy","incentive","motivate","acknowledge","assess","tension"],"ctx":{"undermine":"It suggests that a reward can sometimes undermine the very interest it was meant to encourage.","perceive":"They found that the effect depends on how the reward is perceived.","outcome":"The outcome is not decided by the reward itself, but by the meaning attached to it.","praise":"Praise that focuses on effort tends to support competence.","competence":"Praise that focuses on effort tends to support competence.","reluctant":"It can make students reluctant to attempt harder problems.","accomplish":"Teachers who want students to accomplish more usually say less about talent and more about method.","autonomy":"Psychologists describe three needs behind lasting motivation: autonomy, competence and connection.","incentive":"An incentive that ignores all three may work for a week and then fail.","motivate":"The less a reward is likely to keep people motivated.","acknowledge":"They can acknowledge effort in public.","assess":"Assessing a programme by its first month of results may tell you very little.","tension":"The tension between control and interest never disappears."},"ctxzh":{"undermine":"它说明奖励有时会破坏它本意想鼓励的那份兴趣。","perceive":"他们发现，效果取决于奖励被怎么理解。","outcome":"结果不由奖励本身决定，而由附着在它上面的意义决定。","praise":"针对努力的表扬有助于建立能力感。","competence":"针对努力的表扬有助于建立能力感。","reluctant":"它会让学生不愿意去碰更难的题。","accomplish":"想让学生真正学有所成的老师，通常少谈天赋、多谈方法。","autonomy":"心理学家说，持久的动力背后有三种需要：自主、胜任和连接。","incentive":"一个把这三样都忽略掉的激励，也许能管一周，然后就失效。","motivate":"奖励越难让人保持动力。","acknowledge":"它们也能公开地肯定努力。","assess":"用一个项目头一个月的结果去评价它，可能什么都说明不了。","tension":"“控制”与“兴趣”之间的紧张关系从未消失。"},"questions":[{"type":"主旨","q":"What is the passage mainly about?","options":["How rewards can weaken interest, and what makes the difference.","Why children should be paid for drawing pictures.","How to make students work harder with money.","Why psychologists disagree about education."],"answer":0,"zh":"这篇文章主要讲什么？","optzh":["奖励怎么会削弱兴趣，以及差别在哪里。","为什么该付钱让孩子画画。","如何用钱让学生更用功。","为什么心理学家对教育有分歧。"],"exp":"全文围绕“奖励削弱兴趣”的条件与原因展开。","src":"a reward can sometimes undermine the very interest it was meant to encourage"},{"type":"细节","q":"When does the interest often survive, according to paragraph 2?","options":["When the money is given as a sign of appreciation.","When the money is paid at the end of each month.","When the task is made easier.","When the reward is larger than expected."],"answer":0,"zh":"根据第二段，什么时候兴趣往往还在？","optzh":["当钱是作为“被认可的表示”给出时。","当钱在每月底支付时。","当任务被弄得更简单时。","当奖励比预期更大时。"],"exp":"if the same money is given as a sign of appreciation, the interest often survives。","src":"given as a sign of appreciation"},{"type":"推断","q":"Why can praise for being clever make students avoid harder problems?","options":["Failure might damage the label they have been given.","They think harder problems are badly designed.","They are too tired to try anything new.","They have already lost interest in school."],"answer":0,"zh":"为什么“夸聪明”会让学生回避更难的题？","optzh":["失败可能损害他们被贴上的标签。","他们觉得更难的题设计得不好。","他们太累了，不想试新东西。","他们已经对学校失去兴趣。"],"exp":"since failure would put the label at risk。","src":"failure would put the label at risk"},{"type":"推断","q":"The last sentence implies that a programme should be judged by ______.","options":["whether its effect lasts after the reward is gone","how much money it saves in the first month","how happy students are on the first day","whether parents support it"],"answer":0,"zh":"最后一句暗示，评价一个项目应看______。","optzh":["奖励撤走之后效果是否还在","它头一个月省了多少钱","学生第一天有多开心","家长是否支持"],"exp":"奖励借来的兴趣不持久，所以要看到撤走之后的效果。","src":"it has borrowed interest rather than built it"}]},{"id":19,"title":"What Sleep Is For","level":"高考 · 说明","words":318,"min":8,"tags":["科学","健康"],"paras":["For a long time, sleep was treated as a pause in the day's work. Research now suggests the opposite: during deep sleep the brain replays what it learned the day before, and new memories are consolidated into a more permanent form. Students who study and then sleep do better on tests than students who study the same material for the same number of hours and stay awake.","The loss is not only in memory. People deprived of sleep for several nights show slower reactions, weaker attention and a lower mood. Their immune system also suffers: after short sleep, fewer cells are available to fight infection, and the body needs longer to restore itself. Drivers who have been awake for twenty hours react almost as slowly as drivers who are legally drunk.","Modern life works against a steady rhythm. Bright screens delay the signal that tells the brain it is night; late meals and early alarms shorten the hours available for rest. An afternoon nap can help, but only if it is short — twenty minutes is often recommended — because a long sleep in the day may make the evening harder.","Doctors are careful about the difference between a symptom and a cause. Tiredness may be a sign of a sleep disorder, or of anxiety that keeps the mind alert at midnight. For some patients the most useful therapy is not a pill but a change of habit: a fixed bedtime, no coffee after noon, a dark and quiet room, and a rule that the phone stays outside.","The message is simple, though hard to follow, and it is vital for anyone who plans to work late. Sleep is not time taken away from study; it is the process that makes study last. A chronic lack of sleep does not merely make a student tired: it impairs the very ability to learn that the extra hours were supposed to improve."],"tr":["很长一段时间里，睡眠被当作白天工作中的一个停顿。现在的研究却发现相反的情况：在深睡期间，大脑会重放前一天学过的东西，新的记忆被巩固成更持久的形式。学完之后去睡觉的学生，考试成绩比学同样材料、花同样小时数却一直醒着的学生更好。","损失不只在记忆上。连续几夜被剥夺睡眠的人，反应更慢、注意力更差、情绪更低。免疫系统也受损：睡眠不足之后，可用于抵抗感染的细胞变少，身体需要更长时间才能恢复。醒着二十小时的司机，反应几乎和法定醉驾的司机一样慢。","现代生活与稳定的节律相冲突。明亮的屏幕会推迟“告诉大脑现在是夜晚”的那个信号；太晚吃饭、太早起床压缩了可用来休息的时间。下午小睡有帮助，但只有睡得短才有帮助——常建议二十分钟——因为白天睡太久，晚上会更难入睡。","医生会仔细区分症状与病因。疲倦可能是睡眠障碍的表现，也可能是焦虑让大脑在午夜仍然警觉。对有些病人来说，最有用的治疗不是药片，而是改变习惯：固定就寝时间、中午之后不喝咖啡、房间暗而安静、手机放在门外。","这个道理简单，却很难做到，而对任何打算熬夜用功的人来说都至关重要。睡眠不是从学习里被拿走的时间，而是让学习留下来的过程。长期缺觉不只是让学生疲倦：它损害的正是那些多熬的小时本来想提高的学习能力。"],"targets":["anxiety","consolidate","deprive","restore","immune","nap","rhythm","symptom","therapy","vital","alert","chronic","impair"],"ctx":{"anxiety":"Tiredness may be a sign of a sleep disorder, or of anxiety that keeps the mind alert at midnight.","consolidate":"New memories are consolidated into a more permanent form.","deprive":"People deprived of sleep for several nights show slower reactions.","restore":"The body needs longer to restore itself.","immune":"Their immune system also suffers.","nap":"An afternoon nap can help, but only if it is short.","rhythm":"Modern life works against a steady rhythm.","symptom":"Doctors are careful about the difference between a symptom and a cause.","therapy":"The most useful therapy is not a pill but a change of habit.","vital":"It is vital for anyone who plans to work late.","alert":"Anxiety keeps the mind alert at midnight.","chronic":"A chronic lack of sleep does not merely make a student tired.","impair":"It impairs the very ability to learn."},"ctxzh":{"anxiety":"疲倦可能是睡眠障碍的表现，也可能是焦虑让大脑在午夜仍然警觉。","consolidate":"新的记忆被巩固成更持久的形式。","deprive":"连续几夜被剥夺睡眠的人，反应更慢。","restore":"身体需要更长时间才能恢复。","immune":"免疫系统也受损。","nap":"下午小睡有帮助，但只有睡得短才有帮助。","rhythm":"现代生活与稳定的节律相冲突。","symptom":"医生会仔细区分症状与病因。","therapy":"最有用的治疗不是药片，而是改变习惯。","vital":"这对任何打算熬夜用功的人都至关重要。","alert":"焦虑让大脑在午夜仍然警觉。","chronic":"长期缺觉不只是让学生疲倦。","impair":"它损害的正是学习能力。"},"questions":[{"type":"细节","q":"What happens to new memories during deep sleep?","options":["They are consolidated into a more lasting form.","They are completely erased.","They move from the brain to the body.","They become easier to forget."],"answer":0,"zh":"深睡期间新的记忆会怎样？","optzh":["它们被巩固成更持久的形式。","它们被完全抹去。","它们从大脑转移到身体。","它们变得更易遗忘。"],"exp":"New memories are consolidated into a more permanent form。","src":"consolidated into a more permanent form"},{"type":"细节","q":"Which effect of sleep loss is NOT mentioned in paragraph 2?","options":["A weaker sense of taste.","Slower reactions.","A lower mood.","A weaker immune system."],"answer":0,"zh":"第二段没有提到哪种睡眠不足的影响？","optzh":["味觉变弱。","反应变慢。","情绪更低。","免疫系统变弱。"],"exp":"第二段讲反应、情绪、免疫，没有提味觉。","src":"slower reactions, weaker attention and a lower mood"},{"type":"推断","q":"The writer mentions drunk drivers in order to ______.","options":["show how serious the effect of sleeplessness can be","suggest that driving should be banned at night","prove that young drivers take more risks","explain why people drink before driving"],"answer":0,"zh":"作者提到醉驾司机是为了______。","optzh":["说明缺觉的影响可以有多严重","建议夜间禁止开车","证明年轻司机更冒险","解释人为什么酒后驾车"],"exp":"用醉驾作对照，说明缺觉二十小时已接近醉驾水平。","src":"react almost as slowly as drivers who are legally drunk"},{"type":"主旨","q":"What is the writer's main point about sleep?","options":["Sleep is part of learning, not a break from it.","Students should sleep less before exams.","Sleep problems can always be cured by pills.","The brain rests completely during sleep."],"answer":0,"zh":"作者关于睡眠的主要观点是什么？","optzh":["睡眠是学习的一部分，不是学习的间断。","考试前学生应该少睡。","睡眠问题总能靠药片治好。","大脑在睡眠中完全休息。"],"exp":"Sleep is not time taken away from study; it is the process that makes study last。","src":"the process that makes study last"}]},{"id":20,"title":"Does Language Shape Thought?","level":"高考 · 议论","words":315,"min":8,"tags":["语言","思维"],"paras":["Every language can name a tree, but languages differ in what they force you to notice. Some mark whether a fact was seen or only heard; some require a choice between 'we two' and 'we all'. Speakers of such languages do not think better, but they cannot speak without making distinctions that English leaves to context.","The stronger claim — that language shapes thought — is hard to prove. Experiments show that people remember colours more accurately when their language has separate words for them, yet the effect is small and disappears when a task is easy. What language seems to do is make some concepts easier to hold, not impossible to have.","Metaphor matters more than vocabulary lists suggest. When we say that an argument is 'on solid ground', we are not decorating a plain idea; we are using a concrete image to convey an abstract one. Such images differ across cultures, which is why a sentence translated word by word can sound strange: a literal version keeps the words and loses the picture.","Gesture gives another clue. Speakers move their hands even when talking on the phone, and the movements often carry information that the words do not. Observers may interpret the same silence as agreement or as refusal. Children asked to explain a problem gesture more when they are close to understanding it, as if the hands were testing an idea the voice cannot yet express.","None of this makes one language richer than another; the needs behind speech are universal. Every language must handle the same tasks: to distinguish what happened from what might have, to retain what matters and forget what does not, to be polite without being false. The subtle differences lie in where each language puts its effort, and that is what a translator must reproduce, nuance by nuance, rather than word by word."],"tr":["每种语言都能说出“树”，但语言强迫你注意的东西并不相同。有些语言会标明一件事是亲眼所见还是只是听说；有些语言要求你在“我们两个”和“我们大家”之间做选择。说这类语言的人并不因此想得更好，只是他们一开口就必须做出英语留给语境去处理的区分。","更强的说法——语言塑造思维——很难证明。实验显示，当母语里有区分不同颜色的词时，人对颜色的记忆更准确；但这个效应很小，任务一简单就消失了。语言似乎做的是让某些概念更容易把握，而不是让它们变得不可能拥有。","隐喻比词汇表显示的更重要。当我们说一个论点“站得住脚（on solid ground）”时，我们不是在给一个平淡的想法做装饰，而是在用一个具体的形象传达一个抽象的东西。这类形象因文化而异，这就是逐词翻译的句子听起来奇怪的原因：直译版本保住了词，却丢掉了那幅图。","手势提供了另一条线索。人们即使打电话也会挥手，而这些动作常常携带语言没有的信息。旁观者可能把同一段沉默理解为同意，也可能理解为拒绝。被要求解释一道题的孩子，在快要弄懂时手势更多，仿佛手正在测试一个嘴还说不出来的想法。","这一切都不说明哪种语言更丰富；说话背后的需要是普遍的。每种语言都必须处理同样的任务：把发生过的事和可能发生的事区分开，记住重要的、忘掉不重要的，既礼貌又不虚假。微妙的差别在于每种语言把力气用在哪里，而这正是译者必须一点一点还出来的东西，不能逐词照搬。"],"targets":["abstract","concept","convey","distinguish","gesture","interpret","literal","metaphor","nuance","subtle","retain","translate","universal"],"ctx":{"abstract":"We are using a concrete image to convey an abstract one.","concept":"Language makes some concepts easier to hold.","convey":"We are using a concrete image to convey an abstract one.","distinguish":"Every language must distinguish what happened from what might have.","gesture":"Gesture gives another clue.","interpret":"Observers may interpret the same silence as agreement or as refusal.","literal":"A literal version keeps the words and loses the picture.","metaphor":"Metaphor matters more than vocabulary lists suggest.","nuance":"A translator must reproduce the meaning nuance by nuance.","subtle":"The subtle differences lie in where each language puts its effort.","retain":"Every language must retain what matters and forget what does not.","translate":"A sentence translated word by word can sound strange.","universal":"The needs behind speech are universal."},"ctxzh":{"abstract":"我们是在用一个具体的形象传达一个抽象的东西。","concept":"语言让某些概念更容易把握。","convey":"我们是在用一个具体的形象传达一个抽象的东西。","distinguish":"每种语言都必须把发生过的事和可能发生的事区分开。","gesture":"手势提供了另一条线索。","interpret":"旁观者可能把同一段沉默理解为同意，也可能理解为拒绝。","literal":"直译版本保住了词，却丢掉了那幅图。","metaphor":"隐喻比词汇表显示的更重要。","nuance":"译者必须一点一点还出意思，不能逐词照搬。","subtle":"微妙的差别在于每种语言把力气用在哪里。","retain":"每种语言都必须记住重要的、忘掉不重要的。","translate":"逐词翻译的句子听起来会奇怪。","universal":"说话背后的需要是普遍的。"},"questions":[{"type":"细节","q":"What do the experiments on colour words show?","options":["The effect of language on memory is real but small.","People without colour words cannot see colours.","Language completely decides what we remember.","Colour words make a task harder."],"answer":0,"zh":"关于颜色词的实验说明了什么？","optzh":["语言对记忆的影响真实但很小。","没有颜色词的人看不见颜色。","语言完全决定我们记住什么。","颜色词会让任务变难。"],"exp":"yet the effect is small and disappears when a task is easy。","src":"the effect is small"},{"type":"推断","q":"Why does a word-by-word translation often sound strange?","options":["The image behind the words is lost.","The grammar of the two languages is the same.","Translators do not know enough vocabulary.","Some languages have no abstract words."],"answer":0,"zh":"为什么逐词翻译常常听起来奇怪？","optzh":["词背后的那幅图丢了。","两种语言的语法相同。","译者词汇量不够。","有些语言没有抽象词。"],"exp":"a literal version keeps the words and loses the picture。","src":"keeps the words and loses the picture"},{"type":"细节","q":"When do children gesture more, according to the passage?","options":["When they are close to understanding a problem.","When they are bored with the lesson.","When they have already solved the problem.","When they are talking on the phone."],"answer":0,"zh":"根据文章，孩子什么时候手势更多？","optzh":["当他们快要弄懂一道题时。","当他们对课感到无聊时。","当他们已经解出题时。","当他们打电话时。"],"exp":"Children gesture more when they are close to understanding it。","src":"close to understanding it"},{"type":"主旨","q":"What is the writer's view of the language-thought question?","options":["Language makes some ideas easier without making others impossible.","Language fully controls thought.","Thought has nothing to do with language.","Only English allows abstract thinking."],"answer":0,"zh":"作者对“语言与思维”问题的看法是什么？","optzh":["语言让某些想法更容易，但不会让别的想法不可能。","语言完全控制思维。","思维与语言毫无关系。","只有英语能进行抽象思考。"],"exp":"make some concepts easier to hold, not impossible to have；结尾强调 needs are universal。","src":"easier to hold, not impossible to have"}]},{"id":21,"title":"Who Carries the Risk?","level":"高考 · 议论","words":322,"min":8,"tags":["社会","经济"],"paras":["Ask a delivery rider what he likes about his job, and the answer is often the same: nobody tells him when to start. Ask what he dislikes, and the answer is also the same: nobody tells him what he will earn next month. Both answers describe the same arrangement, and that arrangement is at the heart of the debate about flexible work.","Supporters advocate this model for good reasons. It lets a student earn income between terms, a parent work around school hours, and a factory add labour only when orders arrive, without signing a long contract. For people who cannot take a nine-to-five job, the choice is often not between a good job and a bad one, but between this job and none.","Critics point to what the model hides. The work is often temporary by design, so a worker cannot plan a loan or a family around it. The wage is set by an algorithm that the worker cannot see, and if demand falls, the cost is carried by the person at the bottom. Such workers are vulnerable in a way that a contract with a company is meant to prevent.","Much of the argument turns on a single question: who carries the risk? In a traditional job the employer does; in this model the worker does. Regulation can shift part of that risk back — a minimum wage, accident insurance, the right to join a union — but each rule raises the cost of hiring, and firms may respond by hiring fewer people or by asking more of each one.","The honest answer is that both sides describe real things. Flexibility and stability are genuine goods, and the people who most need the first are often the least able to afford the second. A society that must rely on this kind of work will have to decide, openly, how much insecure work it is willing to accept — and who should pay for the rest."],"tr":["问一个外卖骑手他喜欢这份工作的什么，答案往往一样：没人规定他几点开始。问他讨厌什么，答案也一样：没人告诉他下个月能挣多少。两个回答说的是同一件事，而这件事正处在关于“灵活用工”的争论中心。","支持者有支持的道理。它让学生在两学期之间挣到收入，让家长能配合上学时间工作，让工厂只在订单到来时增加劳动力，而不必签长期合同。对没法做朝九晚五的人来说，选择常常不是“好工作”和“坏工作”之间，而是“这份工作”和“没有工作”之间。","批评者指出这个模式藏起来的东西。这类工作在设计上就是临时的，工人没法据此规划贷款或家庭。工资由工人看不见的算法决定；需求一降，代价由最底层的人承担。这类工人的脆弱，正是与公司签合同本来要防止的。","争论大部分落在一个问题上：风险由谁承担？传统工作里由雇主承担；这个模式里由工人承担。监管可以把一部分风险移回去——最低工资、工伤保险、加入工会的权利——但每条规则都会抬高用工成本，企业可能少招人，或对每个人要求更多。","诚实的答案是：双方说的都是真的。灵活与稳定都是真实的好处，而最需要前者的人，往往最负担不起后者。一个必须依赖这类工作的社会，必须公开决定它愿意接受多少不稳定的工作，以及剩下的部分该由谁来付账。"],"targets":["advocate","contract","flexible","income","insecure","labour","regulation","rely","stability","temporary","union","vulnerable","wage"],"ctx":{"advocate":"Supporters advocate this model for good reasons.","contract":"A factory can add labour without signing a long contract.","flexible":"That arrangement is at the heart of the debate about flexible work.","income":"It lets a student earn income between terms.","insecure":"A society must decide how much insecure work it is willing to accept.","labour":"A factory can add labour only when orders arrive.","regulation":"Regulation can shift part of that risk back.","rely":"A society that must rely on this kind of work will have to decide.","stability":"Flexibility and stability are genuine goods.","temporary":"The work is often temporary by design.","union":"Workers may have the right to join a union.","vulnerable":"Such workers are vulnerable in a way that a contract is meant to prevent.","wage":"The wage is set by an algorithm that the worker cannot see."},"ctxzh":{"advocate":"支持者有支持的道理（主张这个模式）。","contract":"工厂不必签长期合同就能增加劳动力。","flexible":"这件事正处在关于“灵活用工”的争论中心。","income":"它让学生在两学期之间挣到收入。","insecure":"社会必须决定它愿意接受多少不稳定的工作。","labour":"工厂只在订单到来时增加劳动力。","regulation":"监管可以把一部分风险移回去。","rely":"必须依赖这类工作的社会将不得不做出决定。","stability":"灵活与稳定都是真实的好处。","temporary":"这类工作在设计上就是临时的。","union":"工人可能有权加入工会。","vulnerable":"这类工人是脆弱的，而这正是一纸合同本应防止的。","wage":"工资由工人看不见的算法决定。"},"questions":[{"type":"细节","q":"What do the rider's two answers have in common?","options":["They both describe the same lack of control from two sides.","They both praise the freedom of the job.","They both complain about the pay.","They both mention the weather."],"answer":0,"zh":"骑手的两个回答有什么共同点？","optzh":["它们从两面描述了同一种“没人管”。","它们都在夸这份工作的自由。","它们都在抱怨工资。","它们都提到天气。"],"exp":"nobody tells him when to start / what he will earn —— 都是“无人负责”，即风险在工人身上。","src":"Both answers describe the same arrangement"},{"type":"细节","q":"Which group does the writer say may benefit from flexible work?","options":["A parent who must work around school hours.","A worker who wants a lifelong contract.","A firm that needs stable orders.","A student who has no free time."],"answer":0,"zh":"作者说哪类人可能从灵活用工中受益？","optzh":["必须配合上学时间工作的家长。","想要终身合同的工人。","需要稳定订单的企业。","没有空闲时间的学生。"],"exp":"a parent work around school hours。","src":"a parent work around school hours"},{"type":"推断","q":"Why does each new rule worry some economists?","options":["It raises the cost of hiring and may reduce jobs.","It makes algorithms more powerful.","It forces workers to sign longer contracts.","It stops students from working."],"answer":0,"zh":"为什么每条新规会让一些经济学家担心？","optzh":["它抬高用工成本，可能减少岗位。","它让算法更有权力。","它迫使工人签更长的合同。","它让学生无法工作。"],"exp":"each rule raises the cost of hiring, and firms may respond by hiring fewer people。","src":"raises the cost of hiring"},{"type":"主旨","q":"What is the passage mainly arguing?","options":["The debate is about who carries the risk, and both sides have real points.","Flexible work should be banned completely.","Algorithms should set all wages.","Only students should do flexible work."],"answer":0,"zh":"这篇文章主要在论证什么？","optzh":["争论的核心是风险由谁承担，而双方都有道理。","灵活用工应被完全禁止。","工资应全部由算法决定。","只有学生才该做灵活工作。"],"exp":"Much of the argument turns on a single question: who carries the risk? + both sides describe real things。","src":"who carries the risk"}]},{"id":22,"title":"The Studio Behind the Picture","level":"高考 · 说明议论","words":310,"min":8,"tags":["艺术","文化"],"paras":["A visitor standing in front of a famous portrait often says the same thing: 'It looks so real.' Yet the quality that holds the eye is rarely accuracy. The painter has chosen what to leave out, and those choices reveal more about the sitter than any photograph could.","We praise 'talent' as if it were a single gift, but the studio tells a different story. Before the final work there are dozens of sketches, each testing the position of a hand or the turn of a head. What looks like inspiration is usually the last version of a long argument with the material.","Craft matters as much as feeling. A composer who cannot write down a melody loses it; a potter who has not learned the temperature of the kiln can break a month of work in an hour. Tradition is not the enemy of original work here: it is the set of solved problems a beginner may borrow before asking a new question.","This is why copying is part of learning. Students in old workshops copied the master's work until its logic became their own. The danger comes only when copying never stops — when a painter can reproduce a style but cannot compose a picture that needs to exist.","The aesthetic experience, then, is not passive. To appreciate a work is to notice what the artist decided, and to feel how close the decision came to failing. A vivid image is not one that shows everything; it is one that makes us see something we had walked past a hundred times."],"tr":["站在一幅名画肖像前的参观者常常说同一句话：“太像真的了。”但真正抓住眼睛的，很少是准确。画家选择了省略什么，而这些选择透露出的关于被画者的东西，比任何照片都多。","我们称赞“天赋”，仿佛它是一种单一的礼物；但画室讲的是另一个故事。在最终作品之前有几十张草图，每一张都在试一只手的位置、或头的转向。看起来像灵感的东西，通常是与材料长时间争论后的最后一版。","手艺和感觉一样重要。写不下旋律的作曲家会把它弄丢；没学会窑温的陶工能在一小时内毁掉一个月的工作。在这里，传统不是原创的敌人：它是一堆已经被解决的问题，初学者可以先借用，再提出新问题。","这就是为什么临摹是学习的一部分。旧时工坊里的学生临摹师傅的作品，直到它的逻辑变成自己的。危险只在于临摹永不停止——当一个画家能复制一种风格，却无法构图出一幅非存在不可的画。","所以，审美经验不是被动的。欣赏一件作品，就是注意到艺术家做了什么决定，并感受到这个决定离失败有多近。鲜明的形象不是把一切都画出来，而是让我们看见一个已经路过一百次的东西。"],"targets":["aesthetic","craft","compose","inspiration","original","portrait","reveal","sketch","studio","talent","tradition","appreciate","vivid"],"ctx":{"aesthetic":"The aesthetic experience is not passive.","craft":"Craft matters as much as feeling.","compose":"A painter may be unable to compose a picture that needs to exist.","inspiration":"What looks like inspiration is usually the last version of a long argument.","original":"Tradition is not the enemy of original work.","portrait":"A visitor standing in front of a famous portrait says the same thing.","reveal":"Those choices reveal more about the sitter than any photograph could.","sketch":"Before the final work there are dozens of sketches.","studio":"The studio tells a different story.","talent":"We praise 'talent' as if it were a single gift.","tradition":"Tradition is not the enemy of original work.","appreciate":"To appreciate a work is to notice what the artist decided.","vivid":"A vivid image is not one that shows everything."},"ctxzh":{"aesthetic":"审美经验不是被动的。","craft":"手艺和感觉一样重要。","compose":"画家可能无法构图出一幅非存在不可的画。","inspiration":"看起来像灵感的东西，通常是长时间争论后的最后一版。","original":"传统不是原创作品的敌人。","portrait":"站在一幅名画肖像前的参观者会说同一句话。","reveal":"这些选择透露出的关于被画者的东西比照片多。","sketch":"在最终作品之前有几十张草图。","studio":"画室讲的是另一个故事。","talent":"我们称赞“天赋”，仿佛它是一种单一的礼物。","tradition":"传统不是原创作品的敌人。","appreciate":"欣赏一件作品，就是注意到艺术家做了什么决定。","vivid":"鲜明的形象不是把一切都画出来。"},"questions":[{"type":"细节","q":"What most holds the viewer's eye in a good portrait, according to the writer?","options":["The choices the painter made about what to leave out.","The exact accuracy of every detail.","The size of the painting.","The fame of the person in it."],"answer":0,"zh":"按作者说法，好肖像最抓住观者眼睛的是什么？","optzh":["画家关于省略什么所做的选择。","每个细节的精确。","画幅的大小。","画中人的名气。"],"exp":"The painter has chosen what to leave out, and those choices...","src":"chosen what to leave out"},{"type":"推断","q":"What does the studio show about 'inspiration'?","options":["It usually comes after long practice and many failed versions.","It arrives suddenly and cannot be prepared for.","It is more important than craft.","It belongs only to young artists."],"answer":0,"zh":"画室说明了“灵感”的什么？","optzh":["它通常在长期练习和许多失败版本之后到来。","它突然降临，无法准备。","它比手艺更重要。","它只属于年轻艺术家。"],"exp":"What looks like inspiration is usually the last version of a long argument with the material。","src":"the last version of a long argument"},{"type":"推断","q":"The writer warns that copying becomes harmful when ______.","options":["a painter can copy a style but cannot create anything new","students copy too slowly","masters refuse to teach","workshops use modern tools"],"answer":0,"zh":"作者警告：当______时，临摹才有害。","optzh":["画家能复制风格却造不出新东西","学生临摹得太慢","师傅拒绝教","工坊使用现代工具"],"exp":"can reproduce a style but cannot compose a picture that needs to exist。","src":"cannot compose a picture"},{"type":"主旨","q":"What does the passage suggest about art?","options":["It grows out of craft, tradition and many discarded attempts.","It depends mainly on natural talent.","It should copy photographs exactly.","It is best understood without any training."],"answer":0,"zh":"文章对艺术提出了什么看法？","optzh":["它生长于手艺、传统和许多被丢弃的尝试。","它主要靠天赋。","它应该精确复制照片。","不懂训练反而最能理解它。"],"exp":"craft、tradition、sketches 三方面共同支撑。","src":"Craft matters as much as feeling"}]},{"id":23,"title":"The Part of Science Nobody Reports","level":"高考 · 议论","words":316,"min":8,"tags":["科学","社会"],"paras":["A single study rarely proves anything. What gives a claim credibility is not the confidence of the author but the number of independent groups that have tested it and failed to break it. This is slow, unglamorous work, and it is the part of science that the news rarely reports.","The process begins with a sample. If the group studied is small, or chosen in a way that favours one result, the finding may not hold for anyone else — or the difference may be too small to be significant. Bias can enter long before the data are analysed: in the question asked, in the people invited, in the measurements that were kept and the ones quietly dropped.","Publication adds another pressure. Journals prefer new and striking results, so a study that finds nothing may never appear, and the literature slowly fills with successes. Peer review is meant to catch this, but reviewers chosen by the authors may share their assumptions, which is why some fields now ask for the evidence to be shared before a paper is accepted.","The strongest test is whether others can reproduce the result. When a group fails to do so, the fault may lie with the original work or with the attempt, and telling the two apart requires detail: the exact conditions, the statistics used, the version of the software. Transparent reporting is not a formality; it is what allows others to verify the work.","None of this means scientists are dishonest. It means that funding, careers and attention all reward the exciting claim, and that a system built on trust needs checks that do not depend on trust. A field that can cite its own failures is more credible than one that cannot."],"tr":["单个研究很少能证明什么。让一个说法可信的，不是作者的自信，而是有多少独立团队检验过它、却没能推翻它。这是缓慢、不光彩的工作，也正是新闻很少报道的那部分科学。","过程从样本开始。如果研究的群体很小，或选取方式偏向某一个结果，结论可能对别人都不成立——或者差异小到没有统计学意义。偏差在分析数据之前很久就能进入：在提的问题里、在邀请的人里、在保留下来和悄悄丢掉的那些测量里。","发表又增加一重压力。期刊偏爱新鲜、惊人的结果，所以“什么都没发现”的研究可能永远发不出来，文献慢慢被成功案例填满。同行评审本应抓住这一点，但由作者挑选的评审人可能和作者有同样的预设——这就是为什么有些领域现在要求论文接收前先公开证据。","最强的检验是别人能否复现这个结果。当一个团队复现失败，错可能在原始工作，也可能在这次尝试，而区分两者需要细节：确切的条件、用过的统计方法、软件的版本。透明的报告不是形式；它正是让别人能够核实这项工作的东西。","这并不意味着科学家不诚实。它意味着经费、职业和关注都在奖励那个“惊人的说法”，也意味着一个建立在信任之上的系统，需要不依赖信任的核查。一个能引用自己失败的领域，比一个做不到的更可信。"],"targets":["bias","cite","credibility","evidence","peer","reproduce","sample","significant","statistics","transparent","verify","funding","publication"],"ctx":{"bias":"Bias can
